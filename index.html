function toFrac(n){if(n<=0)return'0';const w=Math.floor(n),d=n-w;const fs=[[0,''],[0.25,'¼'],[0.333,'⅓'],[0.5,'½'],[0.667,'⅔'],[0.75,'¾']];let best=fs[0];fs.forEach(f=>{if(Math.abs(d-f[0])<Math.abs(d-best[0]))best=f;});if(Math.abs(d-1)<Math.abs(d-best[0]))return String(w+1);return(w>0?String(w):'')+best[1]||'0';}

// Construye el array de comidas desde la fila de Dietas + food DB
function parseDietas(row,foodDB){
  const MEALS=[
    {id:'desayuno',nom:'Desayuno',ic:'☀️',cols:['DesayunoA','DesayunoB','DesayunoC']},
    {id:'almuerzo',nom:'Almuerzo',ic:'🌞',cols:['AlmuerzoA','AlmuerzoB','AlmuerzoC']},
    {id:'merienda',nom:'Merienda',ic:'☕',cols:['MeriendaA','MeriendaB','MeriendaC']},
    {id:'cena',nom:'Cena',ic:'🌙',cols:['CenaA','CenaB','CenaC']},
    {id:'postentreno',nom:'Post-Entreno',ic:'💪',cols:['PostEntrenoA','PostEntrenoB','PostEntrenoC']},
  ];
  const OPT=['A','B','C'];
  return MEALS.map(meal=>{
    const ops=meal.cols.map((col,i)=>{
      const val=String(row[col]||'').trim();if(!val)return null;
      const items=val.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).map(k=>{
        const food=foodDB[k];if(!food)return null;
        return{...food,key:k};
      }).filter(Boolean);
      if(!items.length)return null;
      return{id:OPT[i],nom:'Opción '+OPT[i],items};
    }).filter(Boolean);
    if(!ops.length)return null;
    return{...meal,ops};
  }).filter(Boolean);
}

// Semana secuencial basada en contador localStorage — Lun a Dom
function getWkForNum(user,num){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  const diffToMon=day===0?-6:1-day;
  startMon.setDate(startMon.getDate()+diffToMon);
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label,mon:wkMon,sun:wkSun};
}
// Calcula la semana real según el calendario hoy
function getRealWkNum(user){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const today=new Date();today.setHours(12,0,0,0);
  const diffMs=today-startMon;
  if(diffMs<0)return 1;
  return Math.floor(diffMs/(7*24*60*60*1000))+1;
}
// Devuelve el sábado (fin de semana) de una semana dada
function getWkSat(user,num){
  const wk=getWkForNum(user,num);
  const sat=new Date(wk.mon);sat.setDate(wk.mon.getDate()+5);sat.setHours(23,59,59,999);
  return sat;
}

// ── CHARTS ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=140,labels,pointLabels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:pointLabels?22:10,b:24,l:pointLabels?10:32,r:10};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block',overflow:'visible'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    pointLabels&&pointLabels.map((pl,i)=>(i%step===0||i===data.length-1)?h('text',{key:'pl'+i,x:x(i),y:y(data[i])-8,textAnchor:'middle',fontSize:'9',fontWeight:'700',fill:color},pl):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-6,textAnchor:'middle',fontSize:'9',fill:'#999'},l):null),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mn.toFixed(1)),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mx.toFixed(1))
  );
}
function DualBarChart({data,key2='toxics',color2=R}){
  if(!data||data.length<1)return null;
  const W=300,H=100,pad={t:8,b:22,l:20,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const bW=Math.min(10,iW/data.length/2-2);
  const gap=iW/data.length;
  const max2=Math.max(...data.map(d=>d[key2]||0),1);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('line',{x1:pad.l,y1:pad.t+iH,x2:W-pad.r,y2:pad.t+iH,stroke:'rgba(0,0,0,0.08)',strokeWidth:'1'}),
    data.map((d,i)=>{
      const cx=pad.l+i*gap+gap/2;
      const sH=(d.sleep/7)*iH;
      const v2=d[key2]||0;
      const tH=(v2/max2)*iH;
      return h('g',{key:i},
        h('rect',{x:cx-bW-1,y:pad.t+iH-sH,width:bW,height:Math.max(sH,1),fill:'#111',rx:'2'}),
        h('rect',{x:cx+1,y:pad.t+iH-tH,width:bW,height:Math.max(tH,1),fill:color2,rx:'2'}),
        h('text',{x:cx,y:H-6,textAnchor:'middle',fontSize:'8',fill:'#999'},d.label)
      );
    })
  );
}

function AjustarSemana({onClose}){
  var COACH_PIN='1234';
  var [pin,setPin]=useState('');
  var [auth,setAuth]=useState(false);
  var [nombre,setNombre]=useState('');
  var [msg,setMsg]=useState('');
  var [plan,setPlan]=useState(null);
  var [ejRows,setEjRows]=useState([]);

  var dark={background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.12)',color:'#fff',borderRadius:'10px',padding:'11px 12px',width:'100%',fontSize:'14px',fontFamily:'inherit',outline:'none'};
  var box={background:'rgba(255,255,255,0.06)',borderRadius:'10px',padding:'12px',marginBottom:'10px'};
  var tag={fontSize:'10px',fontWeight:'700',color:'rgba(255,255,255,0.4)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'6px'};
  function pfx(u){return 'ase_'+u+'_';}
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function put(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
  function parse(v,f){try{return JSON.parse(v);}catch(e){return f;}}
  function norm(x){return String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

  useEffect(function(){
    fetch(SCRIPT_URL+'?action=ejercicios').then(function(r){return r.json();}).then(function(rows){setEjRows(rows||[]);}).catch(function(){});
  },[]);

  function stableMaps(){
    var byName={}, byId={};
    (ejRows||[]).forEach(function(r){
      var id=String(r.ID||r.id||'').trim(), name=String(r.Nombre||r.NOMBRE||r.nombre||'').trim();
      if(id&&name){byName[norm(name)]=id;byId[id]=name;}
    });
    return{byName:byName,byId:byId};
  }

  function mapId(oldId,weekObj,maps){
    var sid=String(oldId);
    if(maps.byId[sid])return sid;
    var arr=(weekObj&&weekObj.e)||[];
    var old=arr.find(function(e){return String(e.id)===sid;});
    if(old&&old.n&&maps.byName[norm(old.n)])return maps.byName[norm(old.n)];
    return sid;
  }

  function mergeMissingWeek(target,source,maps,counter,wid){
    if(!source)return target;
    target=target||{};
    ['sr','skUsed','sk'].forEach(function(field){
      var src=source[field]||{};
      if(!target[field])target[field]={};
      Object.keys(src).forEach(function(sess){
        if(!target[field][sess])target[field][sess]={};
        Object.keys(src[sess]||{}).forEach(function(oldId){
          var id=mapId(oldId,source,maps);
          var sv=src[sess][oldId], tv=target[field][sess][id];
          if(field==='sr'){
            if(!target[field][sess][id])target[field][sess][id]={};
            Object.keys(sv||{}).forEach(function(k){
              if((target[field][sess][id][k]===undefined||target[field][sess][id][k]==='')&&sv[k]!==undefined&&sv[k]!==''){
                target[field][sess][id][k]=sv[k];counter.n++;counter.items.push({wid:wid,sess:sess,name:(maps.byId[id]||id),field:k,value:sv[k]});
              }
            });
          }else if((tv===undefined||tv===null||tv==='')&&sv!==undefined&&sv!==null&&sv!==''){
            target[field][sess][id]=sv;counter.n++;counter.items.push({wid:wid,sess:sess,name:(maps.byId[id]||id),field:field,value:sv});
          }
        });
      });
    });
    if(!target.e&&source.e)target.e=source.e;
    if(!target.rutina&&source.rutina)target.rutina=source.rutina;
    if(!target.wi&&source.wi)target.wi=source.wi;
    if(!target.wl&&source.wl)target.wl=source.wl;
    return target;
  }

  function collectSources(u){
    var p=pfx(u), current={}, backups=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(!k||k.indexOf(p)!==0)continue;
        var v=localStorage.getItem(k);
        if(k.indexOf(p+'migbackup_')===0){
          var b=parse(v,null); if(b&&typeof b==='object')backups.push(b);
        }else current[k]=v;
      }
    }catch(e){}
    backups.sort(function(a,b){return 0;});
    return{current:current,backups:backups};
  }

  function buildPlan(){
    var u=nombre.trim(); if(!u){setMsg('Escribí el nombre exacto del asesorado.');return;}
    var p=pfx(u), maps=stableMaps(), srcs=collectSources(u);
    var hist=parse(srcs.current[p+'hist']||'[]',[]);
    var weekIds={};
    hist.forEach(function(x){weekIds[String(x)]=true;});
    Object.keys(srcs.current).forEach(function(k){
      var m=k.match(new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(sem_\\d+)$'));
      if(m)weekIds[m[1]]=true;
      var d=k.match(/_draft_(sem_\d+)$/); if(d)weekIds[d[1]]=true;
    });
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).forEach(function(k){
        var m=k.match(/(sem_\d+)$/); if(m)weekIds[m[1]]=true;
      });
    });

    var changes=[], counter={n:0,items:[]};
    Object.keys(weekIds).filter(function(wid){return /^sem_\d+$/.test(wid);}).sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));}).forEach(function(wid){
      var savedKey=p+wid, draftKey=p+'draft_'+wid;
      var target=parse(srcs.current[savedKey]||'null',null);
      var draft=parse(srcs.current[draftKey]||'null',null);
      var base=target||{};
      if(draft)base=mergeMissingWeek(base,draft,maps,counter,wid);
      srcs.backups.forEach(function(b){
        var sw=parse(b[savedKey]||'null',null), dw=parse(b[draftKey]||'null',null);
        if(sw)base=mergeMissingWeek(base,sw,maps,counter,wid);
        if(dw)base=mergeMissingWeek(base,dw,maps,counter,wid);
      });
      if(counter.n>0||target||draft){
        changes.push({wid:wid,key:savedKey,data:base,draftKey:draftKey,draft:draft});
      }
    });

    // Base: recuperar respuestas Cumplí/No cumplí faltantes desde backups, sin sobrescribir.
    var protoChanges=[];
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).filter(function(k){return k.indexOf(p+'baseProto_sem_')===0;}).forEach(function(k){
        var old=parse(b[k]||'{}',{}), cur=parse(get(k)||'{}',{});
        var changed=false;
        Object.keys(old||{}).forEach(function(id){
          var v=old[id]; if((v==='si'||v==='no')&&!cur[id]){cur[id]=v;changed=true;counter.n++;counter.items.push({wid:(k.match(/sem_\d+/)||['sem_?'])[0],sess:'',name:'protocolo '+id,field:'Base',value:v});}
        });
        if(changed)protoChanges.push({key:k,data:cur});
      });
    });

    // Fuerza: recuperar referencias/test sólo si la clave completa falta. Nunca toca sessKg.
    var forceKeys={};
    srcs.backups.forEach(function(b){
      Object.keys(b||{}).forEach(function(k){
        if(k.indexOf(p+'rmRef_')===0||k.indexOf(p+'rmRefFinal_')===0||k.indexOf(p+'rmTest_')===0){
          if(!get(k)&&b[k])forceKeys[k]=b[k];
        }
      });
    });
    Object.keys(forceKeys).forEach(function(k){counter.n++;counter.items.push({wid:(k.match(/sem_\d+/)||['sem_?'])[0],sess:'',name:'referencia Fuerza',field:'Fuerza',value:'recuperable'});});

    var realChanges=changes.filter(function(c){
      var before=get(c.key)||''; return JSON.stringify(parse(before,null))!==JSON.stringify(c.data);
    });
    var orderedItems=counter.items.slice().sort(function(a,b){
      function pri(x){return (x.field==='skUsed'||x.field==='sk')?0:1;}
      return pri(a)-pri(b);
    });
    var result={user:u,weeks:realChanges,proto:protoChanges,force:forceKeys,count:counter.n,items:orderedItems.slice(0,60)};
    setPlan(result);
    setMsg(result.count?'Encontré '+result.count+' dato(s) local(es) faltante(s) que pueden recuperarse.':'No encontré datos locales faltantes para recuperar.');
  }

  function applyRecovery(){
    if(!plan||!plan.count)return;
    if(!window.confirm('Se completarán únicamente datos vacíos. No se reemplazará ningún valor visible, no se tocará sessKg y no se ejecutarán progresiones. ¿Recuperar ahora?'))return;
    var p=pfx(plan.user);
    // Backup de seguridad de las claves que sí vamos a tocar.
    var safety={};
    plan.weeks.forEach(function(x){safety[x.key]=get(x.key);safety[x.draftKey]=get(x.draftKey);});
    plan.proto.forEach(function(x){safety[x.key]=get(x.key);});
    Object.keys(plan.force||{}).forEach(function(k){safety[k]=get(k);});
    put(p+'recoverybackup_'+Date.now(),JSON.stringify(safety));

    var hist=parse(get(p+'hist')||'[]',[]);
    plan.weeks.forEach(function(x){
      put(x.key,JSON.stringify(x.data));
      if(!hist.includes(x.wid))hist.push(x.wid);
      // Si hay draft, alinearlo con los campos recuperados para que no vuelva a ocultarlos.
      var dr=parse(get(x.draftKey)||'null',null);
      if(dr){
        dr.sr=x.data.sr||dr.sr||{};
        dr.sk=x.data.sk||dr.sk||{};
        dr.skUsed=x.data.skUsed||dr.skUsed||{};
        put(x.draftKey,JSON.stringify(dr));
      }
    });
    hist.sort(function(a,b){return parseInt(a.replace('sem_',''))-parseInt(b.replace('sem_',''));});
    put(p+'hist',JSON.stringify(hist));
    plan.proto.forEach(function(x){put(x.key,JSON.stringify(x.data));});
    Object.keys(plan.force||{}).forEach(function(k){put(k,plan.force[k]);});
    setMsg('✅ Recuperación terminada. Se completaron '+plan.count+' dato(s). Recargá la app para verlos.');
    setPlan(null);
  }

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#0A0A0A',minHeight:'100vh',padding:'24px',overflowY:'auto'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'24px'}},
      h('button',{onClick:onClose,style:{background:'none',border:'none',fontSize:'22px',cursor:'pointer',color:'#fff'}},'←'),
      h('div',null,
        h('div',{style:{fontSize:'18px',fontWeight:'800',color:'#fff'}},'Recuperar datos'),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.45)',marginTop:'2px'}},'Herramienta de reparación local · no modifica la planificación')
      )
    ),
    !auth
      ?h('div',null,
        h('div',{style:tag},'PIN del coach'),
        h('input',{type:'password',value:pin,onChange:function(e){setPin(e.target.value);},style:Object.assign({},dark,{marginBottom:'12px'})}),
        h('button',{onClick:function(){pin===COACH_PIN?setAuth(true):setMsg('PIN incorrecto');},style:{width:'100%',background:GRAD,color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontSize:'15px',fontWeight:'700',cursor:'pointer'}},'Ingresar'),
        msg&&h('div',{style:{color:'#FCA5A5',marginTop:'8px',fontSize:'13px'}},msg)
      )
      :h('div',null,
        h('div',{style:box},
          h('div',{style:tag},'Asesorado'),
          h('input',{value:nombre,onChange:function(e){setNombre(e.target.value);setPlan(null);setMsg('');},placeholder:'Nombre exacto de ingreso',style:Object.assign({},dark,{marginBottom:'10px'})}),
          h('button',{onClick:buildPlan,style:{width:'100%',background:AC,color:'#fff',border:'none',borderRadius:'10px',padding:'13px',fontSize:'14px',fontWeight:'800',cursor:'pointer'}},'🔎 Revisar datos recuperables')
        ),
        msg&&h('div',{style:{...box,fontSize:'12px',lineHeight:'1.5',color:msg.indexOf('✅')===0?'#86EFAC':'rgba(255,255,255,0.75)'}},msg),
        plan&&plan.count>0&&h('div',{style:box},
          h('div',{style:tag},'Vista previa'),
          h('div',{style:{fontSize:'12px',color:'#fff',fontWeight:'700',marginBottom:'8px'}},plan.count+' dato(s) faltante(s)'),
          plan.items.map(function(x,i){
            var sem=String(x.wid||'').replace('sem_','S');
            var val=(x.value===undefined||x.value===null||x.value==='')?'':(' = '+x.value);
            return h('div',{key:i,style:{fontSize:'11px',color:'rgba(255,255,255,0.6)',padding:'4px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}},
              sem+' · '+(x.sess?x.sess+' · ':'')+x.name+' · '+x.field+val
            );
          }),
          plan.count>plan.items.length&&h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.4)',marginTop:'6px'}},'… y '+(plan.count-plan.items.length)+' más'),
          h('div',{style:{fontSize:'11px',color:'#FCD34D',lineHeight:'1.5',marginTop:'10px'}},'Sólo completa vacíos. No pisa datos existentes, no toca sessKg y no ejecuta progresiones.'),
          h('button',{onClick:applyRecovery,style:{width:'100%',background:'#1D9E75',color:'#fff',border:'none',borderRadius:'10px',padding:'13px',fontSize:'14px',fontWeight:'800',cursor:'pointer',marginTop:'12px'}},'♻️ Recuperar '+plan.count+' dato(s)')
        )
      )
  );
}

// ── TRAINING ──────────────────────────────────────────────────────────
function Training({exes,setExes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes,isViewingPast,isViewingFuture,realWkNum,onReloadHist}){
  // SNAPSHOT DE RUTINA POR SEMANA: si se está viendo una semana pasada que guardó su propia
  // rutina, usar ESA para armar la vista (ejercicios, bloque, series) en vez de la rutina actual.
  // Semanas viejas sin snapshot -> se usa la rutina actual (fallback, comportamiento previo).
  if(isViewingPast&&hist&&wk){
    var _wSnap=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;});
    if(_wSnap&&_wSnap.rutina&&_wSnap.rutina.assign){
      cfg=Object.assign({},cfg,{
        num:_wSnap.rutina.num||cfg.num,
        assign:_wSnap.rutina.assign,
        bloque:_wSnap.rutina.bloque||cfg.bloque,
        series:_wSnap.rutina.series||cfg.series,
        bloqueInicio:_wSnap.rutina.bloqueInicio||cfg.bloqueInicio
      });
    }
  }
  const BLOQUES={
    volumen:{label:'Volumen',color:'#1D9E75',emoji:'📈',hint:'2-2-3-3-4-4 series efectivas. Registrá kg + reps; al llegar al techo en la primera serie, la próxima exposición sube 5%.'},
    intensidad:{label:'Intensidad',color:'#378ADD',emoji:'🏋️',hint:'1 serie efectiva + técnica de intensificación. Registrá lo que realmente ejecutaste.'},
    fuerza:{label:'Fuerza',color:'#DC2626',emoji:'💪',hint:'Ejercicio 1 por protocolo e1RM; accesorios con progresión por primera serie efectiva.'},
    base:{label:'Base',color:'#F59E0B',emoji:'🌱',hint:'3 series efectivas con reps pautadas. Cumplí → +5% próxima exposición; No cumplí → mantiene.'},
    rehab:{label:'Rehabilitación',color:'#8B5CF6',emoji:'🩺',hint:'3 series efectivas con reps pautadas y registro de cumplimiento. Sin progresión automática.'}
  };
  const bloque=(cfg?.bloque||'volumen').toLowerCase();
  const bloqueInfo=BLOQUES[bloque]||BLOQUES.volumen;
  const bloqueInicio=cfg?.bloqueInicio||1;
  const wkNum=wk?.num||1;
  const weeksInBlock=Math.max(0,wkNum-bloqueInicio);
  const hasProgression=bloque==='volumen'||bloque==='fuerza';
  const hasAutoSeries=bloque==='volumen';
  const seriesBase=Math.min(4,Math.max(2,cfg?.series||2));
  const defCfg={num:3,assign:{A:[],B:[],C:[],D:[]}};
  if(!cfg)cfg=defCfg;
  const [activeSess,setActiveSess]=useState('A');
  const [tut,setTut]=useState(null);
  const [showHistorial,setShowHistorial]=useState(null); // exId
  const [editKg,setEditKg]=useState(null);
  const [kgVal,setKgVal]=useState('');
  const [exEquiv,setExEquiv]=useState(null); // exercise to show equivalents for
  const [swapVerEx,setSwapVerEx]=useState(0);
  const [correcting,setCorrecting]=useState(false); // modo corrección de datos en semana pasada
  const [corrMsg,setCorrMsg]=useState('');
  const [corrEdits,setCorrEdits]=useState({}); // cambios históricos en borrador hasta Guardar corrección
  const [videos,setVideos]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_videos`)||'{}')}catch(e){return{};}});
  const [uploading,setUploading]=useState({});
  const [showCamera,setShowCamera]=useState(null); // {sessId,exId}
  const fileRef=useRef(null);
  const uploadTarget=useRef(null);

  function getVideoKey(sessId,exId){return sessId+'_'+exId;}
  function getVideo(sessId,exId){return videos[getVideoKey(sessId,exId)];}
  function saveVideoUrl(sessId,exId,url){
    const nv={...videos,[getVideoKey(sessId,exId)]:url};
    setVideos(nv);localStorage.setItem(`ase_${user}_videos`,JSON.stringify(nv));
    // Notificar al panel del coach via Apps Script
    const exName=exes.find(e=>e.id===parseInt(exId))?.n||exId;
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'video',user,asesoradoId:localStorage.getItem(`ase_${user}_asesoradoId`)||'',sessId,exId,exName,url,fecha:new Date().toISOString()})
    }).catch(()=>{});
  }
  async function uploadBlob(blob,sessId,exId){
    const key=getVideoKey(sessId,exId);
    setUploading(p=>({...p,[key]:true}));
    try{
      const fd=new FormData();
      fd.append('file',blob);
      fd.append('upload_preset',UPLOAD_PRESET);
      fd.append('public_id',`${user}_${key}_${Date.now()}`);
      const res=await fetch(CLOUD_URL,{method:'POST',body:fd});
      const data=await res.json();
      if(data.secure_url)saveVideoUrl(sessId,exId,data.secure_url);
    }catch(e){}
    setUploading(p=>({...p,[key]:false}));
  }
  function triggerGallery(sessId,exId){
    uploadTarget.current={sessId,exId};fileRef.current.click();
  }
  function onFileChange(e){
    const file=e.target.files[0];if(!file||!uploadTarget.current)return;
    const{sessId,exId}=uploadTarget.current;
    const mb=Math.round(file.size/1024/1024);
    if(file.size>80*1024*1024){
      if(!window.confirm(`El video pesa ${mb}MB y puede fallar al subir.\n¿Intentar igual? Si falla, usá "Grabar" desde la app.`)){e.target.value='';return;}
    }
    uploadBlob(file,sessId,exId);e.target.value='';
  }
  const [cfgSess,setCfgSess]=useState('A');
  const [openTec,setOpenTec]=useState(null);
  const SESS=['A','B','C','D','E'].slice(0,cfg.num);

  const saveCfg=nc=>{setCfg(nc);localStorage.setItem(CFG_KEY(user),JSON.stringify(nc));};
  const toggleEx=(s,id)=>{const cur=cfg.assign[s]||[];const na=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];saveCfg({...cfg,assign:{...cfg.assign,[s]:na}});};
  const setNum=n=>{const na={};['A','B','C','D','E'].slice(0,n).forEach(s=>{na[s]=cfg.assign[s]||[];});saveCfg({...cfg,num:n,assign:na});};

  const getKg=function(ex){
    // En modo Corregir, el valor tipeado manda visualmente aunque todavía no se haya confirmado.
    // Así al salir del input no desaparece: queda como borrador hasta “Guardar corrección”.
    if(isViewingPast&&correcting){
      const ck=String(ex.id)+'|kg';
      if(Object.prototype.hasOwnProperty.call(corrEdits,ck)){
        const cv=parseFloat(corrEdits[ck]);
        if(!isNaN(cv)&&cv>0)return cv;
        return undefined;
      }
    }
    if(isViewingPast){
      // El snapshot persistido de ESA semana es la fuente visual del histórico.
      // Leer localStorage primero evita que, tras Guardar corrección, el render siga
      // mostrando el objeto `hist` anterior hasta cambiar de semana/recargar.
      var thisWkData=null;
      try{thisWkData=JSON.parse(localStorage.getItem('ase_'+user+'_'+wk.id)||'null');}catch(e){}
      if(!thisWkData)thisWkData=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;});
      if(thisWkData){
        var skU=thisWkData.skUsed||thisWkData.sk||{};
        var skSess=skU[activeSess];
        if(skSess){
          var kg=skSess[ex.id]||skSess[String(ex.id)];
          if(kg)return kg;
        }
      }
      return undefined; // en sem pasada NO caer al sessKg de hoy
    }
    return sessionKg&&sessionKg[activeSess]?(sessionKg[activeSess][ex.id]||sessionKg[activeSess][String(ex.id)]||undefined):undefined;
  };
  const getRep=(sess,exId,k)=>{
    // Buscar con la clave tal cual, como string y como int (post-migración ex.id es int del sheet,
    // pero el draft cargado del JSON trae claves string). Mismo criterio que getKg.
    const ss=sessionReps?.[sess]||{};
    const cell=ss[exId]||ss[String(exId)]||ss[parseInt(exId)]||null;
    const stored=cell?(cell[k]||''):'';
    if(stored)return stored;
    if(bloque==='base'||bloque==='rehab'){const ex=exes.find(e=>e.id==exId);if(ex)return String(Math.round((ex.low+ex.hi)/2));}
    return '';
  };

  const numSeries=(()=>{
    if(bloque==='base'||bloque==='rehab')return 3;
    if(hasAutoSeries)return Math.min(4,seriesBase+Math.floor(weeksInBlock/2));
    return seriesBase;
  })();
  const semanasParaSiguienteSerie=(hasAutoSeries&&numSeries<4)?(2-(weeksInBlock%2)||2):null;
  const SERIES_KEYS=['r1','r2','r3','r4'].slice(0,numSeries);

  // FUERZA: protocolo fijo del ejercicio principal por semana del bloque.
  // FUERZA vigente: S1 test + back-off; S2-3 80%; S4-5 85%; S6 90%; S7 95%; S8 retest.
  const FUERZA_PROTOCOLO=[
    {sems:[1],series:3,reps:4,pct:70,label:'Back-off'},
    {sems:[2,3],series:3,reps:4,pct:80},
    {sems:[4,5],series:4,reps:3,pct:85},
    {sems:[6],series:5,reps:2,pct:90},
    {sems:[7],series:5,reps:1,pct:95}
  ];
  const semEnBloque=weeksInBlock+1;
  const rolFuerza=(ex)=>{
    const lista=(cfg.assign[activeSess]||[]);
    let pos=-1,count=0;
    for(const item of lista){
      const ids=Array.isArray(item)?item:[item];
      for(const id of ids){if(String(id)===String(ex.id))pos=count;count++;}
    }
    if(pos===0)return 'principal';
    if(pos===1||pos===2)return 'accesorio';
    return 'finalizador';
  };
  const protoActual=()=>FUERZA_PROTOCOLO.find(p=>p.sems.includes(semEnBloque))||null;
  const rmRefKey=(ex)=>`ase_${user}_rmRef_${activeSess}_${ex.id}`;
  const getRmRef=(ex)=>{const v=parseFloat(localStorage.getItem(rmRefKey(ex)));return isNaN(v)?0:v;};
  const rmRefFinalKey=(ex)=>`ase_${user}_rmRefFinal_${activeSess}_${ex.id}`;
  const getRmRefFinal=(ex)=>{const v=parseFloat(localStorage.getItem(rmRefFinalKey(ex)));return isNaN(v)?0:v;};
  const setRmRef=(ex,val)=>{try{localStorage.setItem(rmRefKey(ex),String(val));}catch(e){}};
  const setRmRefFinal=(ex,val)=>{try{localStorage.setItem(rmRefFinalKey(ex),String(val));}catch(e){}};
  const epley=(kg,reps)=>Math.round(kg*(1+reps/30));
  const esDia1Fuerza=bloque==='fuerza'&&semEnBloque===1;
  const esRetestFuerza=bloque==='fuerza'&&semEnBloque===8;
  const fuerzaCerrada=bloque==='fuerza'&&semEnBloque>8;
  const rmTestLSKey=`ase_${user}_rmTest_${activeSess}`;
  const [rmTest,setRmTest]=useState(()=>{try{return JSON.parse(localStorage.getItem(rmTestLSKey)||'{}');}catch(e){return{};}});
  useEffect(()=>{try{setRmTest(JSON.parse(localStorage.getItem(`ase_${user}_rmTest_${activeSess}`)||'{}'));}catch(e){setRmTest({});}},[activeSess,user]);
  useEffect(()=>{try{localStorage.setItem(rmTestLSKey,JSON.stringify(rmTest));}catch(e){}},[rmTest,rmTestLSKey]);
  const kgPrincipal=(ex)=>{
    const p=protoActual();
    if(!p)return 0;
    const rm=getRmRef(ex);
    if(rm>0)return Math.round((rm*p.pct/100)/2.5)*2.5;
    return 0;
  };
  const seriesKeysEx=(ex)=>{
    if(bloque!=='fuerza')return SERIES_KEYS;
    const rol=rolFuerza(ex);
    const p=protoActual();
    const n=rol==='principal'?(p?p.series:0):(rol==='accesorio'?2:1);
    return ['r1','r2','r3','r4','r5'].slice(0,n);
  };

  // BASE: respuesta del protocolo por ejercicio, persistida por semana + sesión.
  const baseProtoKey=`ase_${user}_baseProto_${wk.id}_${activeSess}`;
  const [baseProto,setBaseProto]=useState(()=>{try{return JSON.parse(localStorage.getItem(baseProtoKey)||'{}');}catch(e){return{};}});
  const baseProtoLoadedKey=useRef(baseProtoKey);
  useEffect(()=>{
    const k=`ase_${user}_baseProto_${wk.id}_${activeSess}`;
    baseProtoLoadedKey.current=k;
    try{setBaseProto(JSON.parse(localStorage.getItem(k)||'{}'));}catch(e){setBaseProto({});}
  },[activeSess,wk.id,user]);
  useEffect(()=>{
    if(baseProtoLoadedKey.current!==baseProtoKey)return;
    try{localStorage.setItem(baseProtoKey,JSON.stringify(baseProto));}catch(e){}
  },[baseProto,baseProtoKey]);

  const getBaseProto=function(exId){

function CameraModal({onCapture,onClose}){
  const [recording,setRecording]=useState(false);
  const [countdown,setCountdown]=useState(120);
  const [mrState,setMrState]=useState(null);
  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const mrRef=useRef(null);
  const chunksRef=useRef([]);
  const timerRef=useRef(null);
  useEffect(()=>{
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:720}},audio:true})
      .then(stream=>{streamRef.current=stream;if(videoRef.current)videoRef.current.srcObject=stream;})
      .catch(()=>onClose());
    return()=>{
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
      if(timerRef.current)clearInterval(timerRef.current);
    };
  },[]);
  function startRec(){
    chunksRef.current=[];
    const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm';
    const mr=new MediaRecorder(streamRef.current,{mimeType:mime,videoBitsPerSecond:500000});
    mr.ondataavailable=e=>e.data.size>0&&chunksRef.current.push(e.data);
    mr.onstop=()=>{const blob=new Blob(chunksRef.current,{type:'video/webm'});onCapture(blob);};
    mrRef.current=mr;mr.start(1000);setRecording(true);setMrState('recording');
    let secs=0;setCountdown(120);
    timerRef.current=setInterval(()=>{secs++;setCountdown(120-secs);if(secs>=120)stopRec();},1000);
  }
  function stopRec(){
    if(mrRef.current&&mrRef.current.state!=='inactive')mrRef.current.stop();
    clearInterval(timerRef.current);setRecording(false);setMrState('done');
  }
  return h('div',{style:{position:'fixed',inset:0,background:'#000',zIndex:200,display:'flex',flexDirection:'column'}},
    h('video',{ref:videoRef,autoPlay:true,muted:true,playsInline:true,style:{flex:1,width:'100%',objectFit:'cover'}}),
    h('div',{style:{padding:'20px 24px',background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',gap:'24px',position:'relative'}},
      h('button',{onClick:onClose,style:{position:'absolute',top:'16px',left:'16px',background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',borderRadius:'8px',padding:'8px 12px',cursor:'pointer',fontSize:'13px'}},'✕ Cancelar'),
      !recording
        ?h('button',{onClick:startRec,style:{background:R,color:'#fff',border:'4px solid rgba(255,255,255,0.3)',borderRadius:'50%',width:'70px',height:'70px',fontSize:'28px',cursor:'pointer'}}, '⏺')
        :h('div',{style:{display:'flex',alignItems:'center',gap:'16px'}},
            h('div',{style:{color:'#fff',fontSize:'22px',fontWeight:'800',minWidth:'60px',textAlign:'center'}},countdown+'s'),
            h('button',{onClick:stopRec,style:{background:'#fff',color:'#111',border:'none',borderRadius:'50%',width:'70px',height:'70px',fontSize:'22px',cursor:'pointer',fontWeight:'800'}},'⏹')
          ),
      recording&&h('div',{style:{position:'absolute',top:'16px',right:'16px',display:'flex',alignItems:'center',gap:'6px'}},
        h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:R,animation:'pulse 1s infinite'}}),
        h('span',{style:{color:'#fff',fontSize:'12px',fontWeight:'700'}})
      )
    )
  );
}

// ── HELPERS DE BACKUP / MIGRACIÓN ─────────────────────────────────────
function _ftNorm(s){return String(s||'').trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');}
function _ftGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _ftSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// Devuelve el contenido del backup pre-migración más ANTIGUO (el original limpio), como objeto {clave:valor}.
function _ftBackupOriginal(user){
  var p='ase_'+user+'_';
  var keys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p+'migbackup_')===0)keys.push(k);}}catch(e){}
  if(!keys.length)return null;
  // el más antiguo = timestamp menor = estado más limpio (pre primera migración)
  keys.sort(function(a,b){var ta=parseInt(a.split('migbackup_')[1])||0;var tb=parseInt(b.split('migbackup_')[1])||0;return ta-tb;});
  try{return {key:keys[0],data:JSON.parse(_ftGet(keys[0])||'{}')};}catch(e){return null;}
}
// Guarda un backup del estado ACTUAL antes de cualquier operación (por si acaso).
function _ftSnapshot(user,tagPrefix){
  var p='ase_'+user+'_';var snap={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p)===0&&k.indexOf(p+'migbackup_')!==0)snap[k]=localStorage.getItem(k);}}catch(e){}
  _ftSet(p+(tagPrefix||'migbackup')+'_'+Date.now(),JSON.stringify(snap));
}

// ── RESTAURAR desde el backup original (pre-migración) ────────────────
// Repone TODAS las claves del usuario tal como estaban antes de migrar.
function restaurarBackupOriginal(user){
  var p='ase_'+user+'_';
  var bk=_ftBackupOriginal(user);
  if(!bk||!bk.data||Object.keys(bk.data).length===0)return {error:'no hay backup para restaurar'};
  // Snapshot del estado actual antes de pisarlo (por seguridad)
  _ftSnapshot(user,'prerestore');
  var count=0;
  Object.keys(bk.data).forEach(function(k){
    // No reponer los propios backups dentro del backup (no debería haberlos, pero por si acaso)
    if(k.indexOf(p+'migbackup_')===0)return;
    _ftSet(k,bk.data[k]);count++;
  });
  // Al restaurar, quitamos la marca de migrado para poder re-migrar limpio
  try{localStorage.removeItem(p+'migrated_v1');}catch(e){}
  return {ok:true,claves:count,backup:bk.key};
}

// ── MIGRACIÓN A IDs ESTABLES DEL SHEET (v2 — por semana, desde backup) ─
// Traduce sr/skUsed/sk de cada semana usando el snapshot `e` de ESA MISMA
// semana (cada semana tiene su propio orden), tomando SIEMPRE como fuente
// el backup original (nunca datos ya migrados). Idempotente.
function migrarIDsEstables(user,rows,force){
  var p='ase_'+user+'_';
  if(!force&&_ftGet(p+'migrated_v2'))return {skipped:true};
  var nameToId={};
  (rows||[]).forEach(function(r){var id=parseInt(r.ID!==undefined?r.ID:r.id);var nm=_ftNorm(r.Nombre||r.NOMBRE||r.nombre);if(!isNaN(id)&&nm)nameToId[nm]=id;});
  if(Object.keys(nameToId).length===0)return {error:'sin ejercicios del sheet'};
  // FUENTE: backup original si existe (datos limpios); si no, estado actual (solo si no migrado v2).
  var bk=_ftBackupOriginal(user);
  var source=bk?bk.data:null;
  var getRaw=function(k){return source?source[k]:_ftGet(k);};
  // Snapshot del estado actual antes de sobrescribir (por seguridad)
  _ftSnapshot(user,'premig2');
  var histIds=[];try{histIds=JSON.parse(getRaw(p+'hist')||'[]');}catch(e){}
  var unmapped=0, mapped=0;
  histIds.forEach(function(semId){
    var raw=getRaw(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w.e||!w.e.length)return; // sin snapshot no se puede traducir: dejar como está
    // diccionario de ESTA semana: id_viejo -> nombre
    var oldToName={};
    w.e.forEach(function(ex){if(ex&&ex.id!==undefined&&ex.n)oldToName[String(ex.id)]=_ftNorm(ex.n);});
    var remap=function(obj){
      if(!obj)return obj;
      var out={};
      Object.keys(obj).forEach(function(sess){
        out[sess]={};
        Object.keys(obj[sess]||{}).forEach(function(oldId){
          var nm=oldToName[String(oldId)];
          var nid=nm?nameToId[nm]:undefined;
          if(nid!==undefined){out[sess][nid]=obj[sess][oldId];mapped++;}
          else{out[sess][oldId]=obj[sess][oldId];unmapped++;} // preservar huérfano tal cual
        });
      });
      return out;
    };
    w.sr=remap(w.sr);
    w.skUsed=remap(w.skUsed);
    w.sk=remap(w.sk);
    // e nuevo con ids del sheet (para que la app lo lea coherente)
    w.e=w.e.map(function(ex){var nid=ex&&ex.n?nameToId[_ftNorm(ex.n)]:undefined;return Object.assign({},ex,{id:nid!==undefined?nid:ex.id});});
    w._migrated2=true;
    _ftSet(p+semId,JSON.stringify(w));
    // MIGRAR TAMBIÉN EL DRAFT de esta semana: la app lee el draft primero al abrir.
    // El draft no tiene su propio `e`, así que se traduce con el oldToName de ESTA semana.
    var draftKey=p+'draft_'+semId;
    var draftRaw=getRaw(draftKey);
    if(draftRaw){
      try{
        var dr=JSON.parse(draftRaw);
        if(dr&&dr.sr)dr.sr=remap(dr.sr);
        dr._migrated2=true;
        _ftSet(draftKey,JSON.stringify(dr));
      }catch(e){}
    }
  });
  // Asegurar que hist esté repuesto (viene del backup)
  var histRaw=getRaw(p+'hist');if(histRaw)_ftSet(p+'hist',histRaw);
  // Reconstruir sessKg vivo desde las semanas ya migradas (más nueva -> más vieja)
  var newSessKg={};
  histIds.slice().reverse().forEach(function(semId){
    var raw=_ftGet(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w._migrated2)return;
    var src=w.skUsed||w.sk||{};
    Object.keys(src).forEach(function(sess){
      if(!newSessKg[sess])newSessKg[sess]={};
      Object.keys(src[sess]||{}).forEach(function(exId){
        if(newSessKg[sess][exId]===undefined){var v=src[sess][exId];if(v&&parseFloat(v)>0)newSessKg[sess][exId]=v;}
      });
    });
  });
  _ftSet(p+'sessKg',JSON.stringify(newSessKg));
  _ftSet(p+'migrated_v2','1');
  return {ok:true,semanas:histIds.length,mapped:mapped,unmapped:unmapped,fuente:bk?'backup':'actual'};
}

                localStorage.setItem(SK(id,user),JSON.stringify(snapRemote));

            }

            setNut(iN());setHab(iH());setSessionReps({});setSessionKg({});setHiitData(iHiit());setSaved(false);
          }
        })
        .catch(function(){

          setNut(iN());setHab(iH());setSessionReps({});setSessionKg({});setHiitData(iHiit());setSaved(false);

  function mergeMissingTree(localObj,remoteObj){
    const out=JSON.parse(JSON.stringify(localObj||{}));
    Object.keys(remoteObj||{}).forEach(function(k){
      const rv=remoteObj[k],lv=out[k];
      if(rv&&typeof rv==='object'&&!Array.isArray(rv))out[k]=mergeMissingTree((lv&&typeof lv==='object'&&!Array.isArray(lv))?lv:{},rv);
      else if(lv===undefined||lv===null||lv==='')out[k]=rv;
    });
    return out;
  }
  function syncRemoteHistoricalDrafts(){
    if(!user)return Promise.resolve();
    const realNum=getRealWkNum(user);
    return fetch(SCRIPT_URL+'?action=drafts').then(r=>r.json()).then(rows=>{
      let changed=false;
      (rows||[]).forEach(function(row){
        if(String(row.Asesorado||'').trim().toLowerCase()!==user.trim().toLowerCase())return;
        const id=String(row.SemanID||'').trim();
        if(!/^sem_\d+$/.test(id))return;
        const n=parseInt(id.replace('sem_',''))||0;
        // Sólo importar como HISTÓRICO semanas ya ocurridas. Nunca tocar la semana actual/futura ni sessKg.
        if(n<=0||n>=realNum||!row.Draft)return;
        let d;try{d=JSON.parse(row.Draft);}catch(e){return;}
        // Blindaje: sólo snapshots del formato actual, con identidad metodológica de la semana.
        if(!d||!d.rutina||!d.rutina.bloque)return;
        const hasExec=Object.keys(d.sr||{}).length||Object.keys(d.skUsed||{}).length;
        if(!hasExec)return;
        let local={};try{local=JSON.parse(localStorage.getItem(SK(id,user))||'{}')||{};}catch(e){}
        const remote={wi:id,wl:d.wl||(getWkForNum(user,n)||{}).label||id,n:d.n||iN(),h:d.h||iH(),sr:d.sr||{},sk:d.sk||{},skUsed:d.skUsed||{},e:d.e||[],rutina:d.rutina||null,hiit:d.hiit||iHiit()};
        // Completar huecos locales con el Draft remoto. Nunca sobreescribir un dato local existente.
        const merged=mergeMissingTree(local,remote);
        localStorage.setItem(SK(id,user),JSON.stringify(merged));
        let hl=[];try{hl=JSON.parse(localStorage.getItem(HK(user))||'[]');}catch(e){}
        if(!hl.includes(id)){hl.push(id);localStorage.setItem(HK(user),JSON.stringify(hl));}
        changed=true;
      });
      if(changed)loadH();
    }).catch(()=>{});
  }

  function validateSave(){
    const errors=[];
    // VALIDACIONES DURAS: solo datos que realmente deben estar respondidos para reportar.
    // Entrenamiento se controla aparte como advertencia confirmable: no entrenar también es un dato válido.
    const meds=hab.meds||[];
    const hasPeso=meds.some(m=>parseFloat(m.p)>0);
    const hasCintura=meds.some(m=>parseFloat(m.c)>0);
    const sens=hab.sens||{};
    const hasSens=['energia','hambre','digestion','estres'].every(k=>sens[k]);
    if(!hasPeso&&!hab.noMediPeso)errors.push('Peso corporal: cargá una medición o marcá "No me medí"');
    if(!hasCintura&&!hab.noMediCintura)errors.push('Cintura: cargá una medición o marcá "No me medí"');
    if(!hasSens)errors.push('Sensaciones: completá Energía, Hambre, Digestión y Estrés');
    if(!Number.isInteger(hab.aguaDias7))errors.push('Agua: indicá cuántos días alcanzaste tu pauta');
    if(!Number.isInteger(hab.sleepDias7))errors.push('Sueño: indicá cuántos días dormiste mínimo 7 hs');
    if(!Number.isInteger(hab.neatDias7))errors.push('NEAT: indicá cuántos días hubo actividad física fuera del gym');
    if(!Number.isInteger(hab.toxicosDias7))errors.push('Tóxicos: indicá cuántos días hubo exposición');
    if(!hab.entrenoEstado)errors.push('Entreno: indicá si la semana fue normal o tuvo modificaciones');
    if(hab.entrenoEstado&&hab.entrenoEstado!=='normal'&&!String(hab.entrenoNota||'').trim())errors.push('Entreno: contanos brevemente qué pasó');
    if(!sens.contextoVida)errors.push('Contexto: indicá cómo fue la semana');
    if(sens.contextoVida&&sens.contextoVida!=='normal'&&!String(sens.contextoNota||'').trim())errors.push('Contexto: contanos brevemente qué cambió');
    if(!sens.dolor)errors.push('Dolor: indicá Sí o No');
    if(sens.dolor==='si'&&!sens.dolorZona)errors.push('Dolor: indicá la zona');
    if(sens.dolor==='si'&&(sens.dolorIntensidad===''||parseFloat(sens.dolorIntensidad)<0||parseFloat(sens.dolorIntensidad)>10))errors.push('Dolor: indicá intensidad entre 0 y 10');
    const nutriEstado=String(nutriConfirmado||localStorage.getItem(`ase_${user}_nutriConfirmado`)||'').toLowerCase();
    const nsem=hab.nutriSem||{};
    if(['deficitario','adecuado','deportivo'].includes(nutriEstado)&&!Number.isInteger(nsem.dias))errors.push('Nutrición: indicá cuántos días describen tu semana');
    if(nutriEstado==='deficitario'&&Number.isInteger(nsem.dias)&&nsem.dias<=4&&!nsem.causa)errors.push('Nutrición: indicá la causa principal');
    if(nutriEstado==='deportivo'&&Number.isInteger(nsem.dias)&&nsem.dias<5&&!nsem.causa)errors.push('Nutrición: indicá la causa principal');
    if(nutriEstado==='adecuado'&&!nsem.cantidad)errors.push('Nutrición: indicá cómo fueron tus cantidades');
    return errors;
  }

    const sesionesReq=['A','B','C','D','E'].slice(0,parseInt(cfg?.num)||0).filter(s=>(cfg.assign?.[s]||[]).flat(Infinity).length>0);
    const faltan=[];

    // BASE: no se esperan reps. La evidencia de entrenamiento son las respuestas del protocolo.
    if(bloqueActual==='base'){
      sesionesReq.forEach(s=>{
        let bp={};

        if(!respondio)faltan.push(s);
      });
      if(!faltan.length)return '';
      return 'Faltan respuestas de entrenamiento en '+(faltan.length===1?'la sesión ':'las sesiones ')+faltan.join(', ')+'.\n\nEn bloque Base NO tenés que cargar repeticiones: el registro es “Cumplí / No cumplí”.\n\nSi no entrenaste '+(faltan.length===1?'esa sesión':'esas sesiones')+', está bien dejarlo vacío. Si entrenaste y te olvidaste de registrarlo, elegí Cancelar y completalo antes de enviar.\n\n¿Confirmás que está bien enviar el reporte con esos datos de entrenamiento vacíos?';
    }

    // OTROS BLOQUES: revisar la semana mostrada, no solamente el estado de la sesión actual.
    let snap={};
    try{snap=JSON.parse(localStorage.getItem(SK(wk.id,user))||'{}')||{};}catch(e){}
    const srSnap=snap.sr||{};
    const skSnap=snap.skUsed||snap.sk||{};
    sesionesReq.forEach(s=>{
      const ids=(cfg.assign?.[s]||[]).flat(Infinity).map(String);
      // Fuerza: el primer ejercicio es principal/protocolo; para esta advertencia buscamos accesorios registrables.
      const idsRegistrables=(bloqueActual==='fuerza'&&ids.length>1)?ids.slice(1):ids;
      const candidatos=idsRegistrables.length?idsRegistrables:ids;
      const hay=candidatos.some(id=>{
        const repsObj=(sessionReps?.[s]?.[id]||sessionReps?.[s]?.[parseInt(id)]||srSnap?.[s]?.[id]||srSnap?.[s]?.[parseInt(id)]||{});
        const reps=Object.values(repsObj||{}).some(v=>parseInt(v)>0);
        const kgActual=sessionKg?.[s]?.[id]||sessionKg?.[s]?.[parseInt(id)]||0;
        const kgHist=skSnap?.[s]?.[id]||skSnap?.[s]?.[parseInt(id)]||0;
        return reps&&(parseFloat(kgActual)>0||parseFloat(kgHist)>0);
      });
      if(!hay)faltan.push(s);
    });
    if(!faltan.length)return '';
    return 'No encuentro kg + repeticiones registradas en '+(faltan.length===1?'la sesión ':'las sesiones ')+faltan.join(', ')+'.\n\nEsto puede estar bien si no entrenaste '+(faltan.length===1?'esa sesión':'esas sesiones')+'. Si sí entrenaste, quizá te olvidaste de cargar los datos: elegí Cancelar, volvé a Entreno y completalos.\n\n¿Confirmás que está bien enviar el reporte con esos datos de entrenamiento vacíos?';
  }
  async function doSave(completeWeek){

  async function reportExistsOnSheet(){

    try{
      const rows=await fetch(SCRIPT_URL+'?action=reportes&_t='+Date.now()).then(r=>r.json());
      return (rows||[]).some(function(r){
        const sameWeek=String(r.SemanID||'').trim()===String(wk.id||'').trim();

        const rowName=String(r.Asesorado||'').trim().toLowerCase();
        const userName=String(user||'').trim().toLowerCase();
        const samePerson=expectedId?(rowId===expectedId||(!rowId&&rowName===userName)):rowName===userName;
        return sameWeek&&samePerson;
      });
    }catch(e){return false;}

      });

    if(isViewingFuture&&!window.confirm('Estás por modificar y enviar datos de una semana que todavía no ocurrió. Estos datos no contarán como ejecución ni dispararán progresiones. ¿Continuar?'))return;
    // Toda semana que se reporte debe pasar las validaciones duras.
    const errs=validateSave();
    if(errs.length>0){setSaveErrors(errs);return;}
    setSaveErrors([]);
    // REGLA FINAL DE REPORTE: solo Mi Semana valida si el reporte puede enviarse.
    // Entreno, Dieta, Inicio, Devolución, videos, e1RM, kg/reps y Guardar progreso
    // nunca bloquean ni exigen confirmación para reportar. Sus vacíos viajan como información real.
    // Verificar si ya se mandó reporte esta sem
    const sentKey=`ase_${user}_reporteSent_${wk.id}`;
    if(localStorage.getItem(sentKey)){
      if(!confirm('Ya enviaste el reporte de esta semana.\n\n¿Querés sobreescribirlo con los datos actuales?\n\nEn el sheet quedará solo un reporte por semana.'))return;
    }
    const dispatched=await doSave(true);
    if(!dispatched){
      localStorage.removeItem(sentKey);
      setSaved(false);
      setSaveErrors(['No se pudo completar el envío del reporte. Tu progreso quedó guardado en Drafts. Intentá nuevamente.']);
      return;
    }
    const confirmed=await confirmReportSaved();
    if(!confirmed){
      localStorage.removeItem(sentKey);
      setSaved(false);
      setSaveErrors(['El reporte no quedó confirmado en Reportes. No se marcará como enviado. Intentá nuevamente.']);
      return;

    localStorage.setItem(sentKey,'1');
    setSaved(true);

  function applyBaseProgressionToWeek(targetNum){
    // ÚNICA transición automática de Base: al entrar por primera vez en la semana REAL nueva.
    // No copia respuestas ni reps; sólo define la carga de la nueva exposición desde la semana anterior.
    // El marcador vuelve esta operación idempotente: navegar atrás/adelante no re-progresa.
    targetNum=parseInt(targetNum)||1;
    if(targetNum!==getRealWkNum(user)||targetNum<=1)return;
    const marker=`ase_${user}_baseProgressApplied_sem_${targetNum}`;
    if(localStorage.getItem(marker))return;
    let cfgNow=null;try{cfgNow=JSON.parse(localStorage.getItem(CFG_KEY(user))||'null');}catch(e){}
    if(!cfgNow||String(cfgNow.bloque||'').toLowerCase()!=='base')return;
    const targetId=`sem_${targetNum}`;
    // Si la semana destino ya tiene ejecución propia, no tocar su carga.
    if(localStorage.getItem(SK(targetId,user))||localStorage.getItem(`ase_${user}_draft_${targetId}`)){localStorage.setItem(marker,'1');return;}
    let prev=null;try{prev=JSON.parse(localStorage.getItem(SK(`sem_${targetNum-1}`,user))||'null');}catch(e){}
    if(!prev)return;
    let nextKg={};try{nextKg=JSON.parse(localStorage.getItem(`ase_${user}_sessKg`)||'{}')||{};}catch(e){nextKg={};}
    let changed=false;
    ['A','B','C','D','E'].slice(0,parseInt(cfgNow.num)||0).forEach(function(sess){
      let bp={};try{bp=JSON.parse(localStorage.getItem(`ase_${user}_baseProto_sem_${targetNum-1}_${sess}`)||'{}');}catch(e){}
      const ids=(cfgNow.assign?.[sess]||[]).flat(Infinity);
      ids.forEach(function(rawId){
        const id=String(rawId);
        const estado=bp[id]||bp[parseInt(id)]||'';
        if(estado!=='si'&&estado!=='no')return;
        const prevMap=(prev.skUsed&&prev.skUsed[sess])||(prev.sk&&prev.sk[sess])||{};
        const kg=parseFloat(prevMap[id]||prevMap[parseInt(id)]||0);
        if(!(kg>0))return;
        if(!nextKg[sess])nextKg[sess]={};
        nextKg[sess][parseInt(id)]=estado==='si'?rKg(kg*1.05):kg;
        changed=true;
      });
    });
    if(changed){localStorage.setItem(`ase_${user}_sessKg`,JSON.stringify(nextKg));setSessionKg(nextKg);}
    localStorage.setItem(marker,'1');
  }

  function applyPerformanceProgressionToCurrentWeek(targetNum){
    targetNum=parseInt(targetNum)||1;
    if(targetNum!==getRealWkNum(user)||targetNum<=1)return;
    let cfgNow=null;try{cfgNow=JSON.parse(localStorage.getItem(CFG_KEY(user))||'null');}catch(e){}
    if(!cfgNow)return;
    const b=String(cfgNow.bloque||'').toLowerCase();
    if(b!=='volumen'&&b!=='fuerza')return;
    const marker=`ase_${user}_performanceProgressApplied_${b}_sem_${targetNum}`;
    if(localStorage.getItem(marker))return;
    const targetId=`sem_${targetNum}`;
    if(localStorage.getItem(SK(targetId,user))||localStorage.getItem(`ase_${user}_draft_${targetId}`)){localStorage.setItem(marker,'1');return;}
    let nextKg={};try{nextKg=JSON.parse(localStorage.getItem(`ase_${user}_sessKg`)||'{}')||{};}catch(e){nextKg={};}
    let histIds=[];try{histIds=JSON.parse(localStorage.getItem(HK(user))||'[]');}catch(e){}
    const prevIds=histIds.filter(x=>(parseInt(String(x).replace('sem_',''))||0)<targetNum).sort((a,b)=>(parseInt(String(b).replace('sem_',''))||0)-(parseInt(String(a).replace('sem_',''))||0));
    let changed=false;
    ['A','B','C','D','E'].slice(0,parseInt(cfgNow.num)||0).forEach(function(sess){
      const flat=(cfgNow.assign?.[sess]||[]).flat(Infinity).map(String);
      flat.forEach(function(id,idx){
        if(b==='fuerza'&&idx===0)return; // principal por protocolo e1RM
        let prev=null;
        for(const pid of prevIds){
          try{
            const w=JSON.parse(localStorage.getItem(SK(pid,user))||'null');
            const reps=w?.sr?.[sess]?.[id]||w?.sr?.[sess]?.[parseInt(id)];
            const kg=(w?.skUsed?.[sess]?.[id]||w?.skUsed?.[sess]?.[parseInt(id)]||w?.sk?.[sess]?.[id]||w?.sk?.[sess]?.[parseInt(id)]);
            if(reps&&parseInt(reps.r1)>0&&parseFloat(kg)>0){prev={reps:parseInt(reps.r1),kg:parseFloat(kg)};break;}
          }catch(e){}
        }
        if(!prev)return;
        const ex=exesRef.current.find(e=>String(e.id)===id);
        if(!ex)return;
        if(!nextKg[sess])nextKg[sess]={};
        nextKg[sess][parseInt(id)]=prev.reps>=ex.hi?rKg(prev.kg*1.05):prev.kg;
        changed=true;
      });
    });
    if(changed){localStorage.setItem(`ase_${user}_sessKg`,JSON.stringify(nextKg));setSessionKg(nextKg);}
    localStorage.setItem(marker,'1');
  }

    Object.entries(cfg.assign||{}).forEach(([s,ids])=>(ids||[]).forEach(id=>{
      const ex=exes.find(e=>e.id===id);
      if(ex)opts.push({exId:id,sessId:s,label:nameCount[ex.n]>1?`${ex.n} (Ses. ${s})`:ex.n});
    }));
    return opts;
  },[cfg,exes]);

  const e1rmHistory=useMemo(()=>{
    const opt=exOptions[selExOpt];if(!opt)return[];
    return hist.map(function(w){
      const exData=w.e?w.e.find(function(e){return e.id===opt.exId;}):null;
      const reps=w.sr&&w.sr[opt.sessId]?(w.sr[opt.sessId][opt.exId]||w.sr[opt.sessId][String(opt.exId)]):null;
      // Try both string and number keys for skUsed and sk
      var skSess=w.skUsed&&w.skUsed[opt.sessId];
      var skKg=skSess?(skSess[opt.exId]||skSess[String(opt.exId)]||skSess[parseInt(opt.exId)]):null;
      if(!skKg){var sk2=w.sk&&w.sk[opt.sessId];skKg=sk2?(sk2[opt.exId]||sk2[String(opt.exId)]||sk2[parseInt(opt.exId)]):null;}
      const kg=skKg||(exData?exData.kg:null);
      if(!kg||!reps)return null;
      const r1=parseInt(reps.r1)||0;
      if(r1===0)return null;
      return{e1rm:calcE1RM(kg,r1),r1,kg,label:w.wi?w.wi.replace('sem_','S'):''};
    }).filter(function(v){return v!==null;});
  },[hist,exOptions,selExOpt]);

  // Last 3 weeks for charts
  const hist3=hist.slice(-3);

  // Sleep vs Energía data (last 3 weeks)
  const ENERGIA_VAL={alta:3,buena:2.5,normal:2,baja:1,muy_baja:0.5};
  const svtData=hist3.map(w=>({
    label:w.wi?.slice(5)||'',
    sleep:(w.h?.sleep||[]).filter(Boolean).length,
    energia:ENERGIA_VAL[String(w.h?.sens?.energia||'').toLowerCase().replace(/\s/g,'_')]||0
  }));

  const hiitSess=cfg?.hiit||[];
  const hasHiit=hiitSess.length>0;
  const TABS=[{id:'d',l:'Inicio',ic:'🏠'},{id:'t',l:'Entreno',ic:'🏋️'},{id:'die',l:'Dieta',ic:'🍽️'},{id:'ms',l:'Mi semana',ic:'📋'},{id:'dev',l:'Devolución',ic:'💬'},...(hasHiit?[{id:'hiit',l:'HIIT',ic:'🏃'}]:[])].filter(Boolean);


  function Dashboard(){
    const _blockMap={'rehabilitacion':'rehab','rehab':'rehab','progresion base':'base','progresionbase':'base','base':'base','intensidad':'intensidad','volumen':'volumen','fuerza':'fuerza'};
    const _rawBlock=String(cfg?.bloque||'base').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const bloque=_blockMap[_rawBlock]||'base';
    const info=BLOQUE_INFO[bloque]||BLOQUE_INFO.base;
    const inicio=parseInt(cfg?.bloqueInicio)||1;
    const semBloque=Math.max(1,(wk.num||1)-inicio+1);
    const dur=bloque==='fuerza'?8:6;
    let weeks=[];
    try{
      const ids=JSON.parse(localStorage.getItem(HK(user))||'[]');
      weeks=ids.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,user))||'null');}catch(e){return null;}})
        .filter(Boolean).sort((a,b)=>(parseInt(String(a.wi).replace('sem_',''))||0)-(parseInt(String(b.wi).replace('sem_',''))||0));
    }catch(e){}
    function avg(vals){const a=vals.map(normNum).filter(v=>v!==null&&v>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
    const trend=weeks.map(w=>{
      const meds=w.h?.meds||[];
      const p=avg(meds.map(m=>m.p));
      const c=avg(meds.map(m=>m.c));
      return {wi:w.wi,wl:w.wl,p:p,c:c};
    }).filter(x=>x.p!==null||x.c!==null).slice(-4);
    const pData=trend.filter(x=>x.p!==null), cData=trend.filter(x=>x.c!==null);
    const tutorialItems=FT_TUTORIALES.filter(t=>!(String(cfg?.modalidad||'').toLowerCase()==='presencial'&&t.k==='videos'));
    return h('div',null,
      h('div',{style:{background:'#111',borderRadius:'12px',padding:'16px',marginBottom:'12px',color:'#fff'}},
        h('div',{style:{fontSize:'10px',fontWeight:'800',color:'rgba(255,255,255,.45)',letterSpacing:'.1em',textTransform:'uppercase'}},'Foco actual'),
        h('div',{style:{fontSize:'18px',fontWeight:'900',marginTop:'4px'}},info.titulo+' · Semana '+semBloque+'/'+dur),
        h('div',{style:{fontSize:'12px',lineHeight:'1.55',color:'rgba(255,255,255,.78)',marginTop:'7px'}},semBloque>dur?'Bloque finalizado, esperando planificación.':info.texto),
        h('div',{style:{marginTop:'10px',paddingTop:'9px',borderTop:'1px solid rgba(255,255,255,.12)',fontSize:'11px',color:'rgba(255,255,255,.55)'}},
          bloque==='fuerza'?'No es foco: llevar el ejercicio principal al fallo ni improvisar cargas fuera del protocolo.':
          bloque==='base'?'No es foco: perseguir e1RM, fallo o sumar volumen por tu cuenta.':
          bloque==='rehab'?'No es foco: progresar carga automáticamente.':
          bloque==='volumen'?'No es foco: sumar series fuera de la progresión 2-2-3-3-4-4.':
          'No es foco: convertir la técnica de intensidad en una medición de e1RM.'
        )
      ),
      h('div',{style:card},
        h('div',{style:{fontSize:'14px',fontWeight:'900',marginBottom:'8px'}},'Tendencia de mediciones'),
        trend.length===0
          ?h('div',{style:{fontSize:'12px',color:'#999'}},'Todavía no hay promedios semanales disponibles.')
          :h('div',null,
            h('div',{style:{fontSize:'10px',color:'#999',marginBottom:'8px'}},'Últimos '+trend.length+' promedios semanales disponibles. Las semanas sin medición no se inventan.'),
            pData.length>=2&&h('div',{style:{marginBottom:'10px'}},h('div',{style:{fontSize:'11px',fontWeight:'700'}},'Peso'),h(LineChart,{data:pData.map(x=>x.p),h:85,labels:pData.map(x=>String(x.wi||'').replace('sem_','S'))})),
            cData.length>=2&&h('div',null,h('div',{style:{fontSize:'11px',fontWeight:'700'}},'Cintura'),h(LineChart,{data:cData.map(x=>x.c),h:85,labels:cData.map(x=>String(x.wi||'').replace('sem_','S'))})),
            trend.map((x,i)=>h('div',{key:i,style:{fontSize:'11px',color:'#666',padding:'4px 0'}},String(x.wi||'').replace('sem_','S')+' · '+(x.p!==null?('Peso '+x.p.toFixed(1)+' kg'):'')+(x.p!==null&&x.c!==null?' · ':'')+(x.c!==null?('Cintura '+x.c.toFixed(1)+' cm'):'')))
          )
      ),
      h('div',{style:card},
        h('div',{style:{fontSize:'14px',fontWeight:'900',marginBottom:'4px'}},'Cómo funciona mi asesoría'),
        h('div',{style:{fontSize:'11px',color:'#777',lineHeight:'1.5',marginBottom:'10px'}},'Su parte — Mi parte: registrá lo que realmente pasó. Con esos datos puedo interpretar y ajustar.'),
        tutorialItems.map(t=>h('div',{key:t.k,id:'tutorial-'+t.k,style:{padding:'9px 0',borderTop:'1px solid #eee'}},
          h('div',{style:{fontSize:'12px',fontWeight:'800'}},t.t),
          h('div',{style:{fontSize:'10px',color:'#888',marginTop:'2px'}},t.sub),
          h('div',{style:{fontSize:'10px',color:'#aaa',marginTop:'4px'}},'Video pendiente de cargar')
        ))
      )
    );
  }

  const [showInstall,setShowInstall]=useState(()=>!window.navigator.standalone&&!window.matchMedia('(display-mode: standalone)').matches&&!localStorage.getItem('ft_install_shown'));
  function dismissInstall(){localStorage.setItem('ft_install_shown','1');setShowInstall(false);}

  const showAjustar=new URLSearchParams(window.location.search).get('ajustar')==='true';
  if(showAjustar)return h(AjustarSemana,{onClose:()=>window.location.href=window.location.pathname});
  if(!user)return h(Login,{onLogin:login});
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F0EFED',minHeight:'100vh'}},
    showInstall&&h('div',{style:{background:GRAD,padding:'12px 16px',display:'flex',alignItems:'flex-start',gap:'10px',zIndex:20,position:'sticky',top:0}},
      h('span',{style:{fontSize:'20px',flexShrink:0}},'📱'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontSize:'13px',fontWeight:'800',color:'#fff',marginBottom:'3px'}},'Agregá esta app a tu pantalla de inicio'),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.85)',lineHeight:'1.4'}},
          isIOS?"Safari: icono compartir > Agregar a pantalla de inicio":"Chrome: menu > Agregar a pantalla de inicio"
        )
      ),
      h('button',{onClick:dismissInstall,style:{background:'none',border:'none',color:'rgba(255,255,255,0.7)',fontSize:'18px',cursor:'pointer',padding:'0',flexShrink:0}},'×')
    ),
    h('div',{style:{background:'#0A0A0A',padding:'14px 18px',position:'sticky',top:0,zIndex:10,display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',null,
        h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',fontWeight:'700',letterSpacing:'0.12em',textTransform:'uppercase'}},'Fuerza T'),
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('div',{style:{fontSize:'18px',fontWeight:'900',color:'#fff'}},user),
          h('button',{onClick:logout,style:{background:'none',border:'none',cursor:'pointer',fontSize:'10px',color:'rgba(255,255,255,0.25)',padding:0}},'cambiar')
        ),
        h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.4)',marginTop:'1px'}},
          'Sem '+Math.max(1,(wk.num||1)-(parseInt(cfg?.bloqueInicio)||1)+1)+' de '+String(cfg?.bloque||'Bloque').charAt(0).toUpperCase()+String(cfg?.bloque||'bloque').slice(1)+' · Sem '+(wk.num||1)+' total · '+String(wk.label||'').replace(/^Sem\s+\d+\s*·\s*/,'')
        )
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px',alignItems:'flex-end',minWidth:'160px'}},
        saveErrors.length>0&&h('div',{style:{background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:'10px',padding:'8px 10px',marginBottom:'2px',width:'100%'}},
          h('div',{style:{fontSize:'11px',fontWeight:'700',color:'#DC2626',marginBottom:'4px'}},'⚠️ Completá antes de guardar:'),
          saveErrors.map((e,i)=>h('div',{key:i,style:{fontSize:'10px',color:'#DC2626',lineHeight:'1.4'}},e))
        ),
        h('button',{onClick:saveProgress,disabled:saving||weekLocked,style:{width:'100%',borderRadius:'8px',padding:'7px 10px',fontSize:'11px',fontWeight:'600',cursor:saving||weekLocked?'default':'pointer',border:'1.5px solid rgba(255,255,255,0.15)',background:saved==='progreso'?'rgba(55,138,221,0.15)':weekLocked?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.08)',color:saved==='progreso'?B:weekLocked?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},saving?'...':(saved==='progreso'?'✓ Progreso guardado':weekLocked?'🔒 Solo lectura':'💾 Guardar progreso')),
        !weekLocked&&saved!==true&&h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',lineHeight:'1.4',paddingTop:'4px',borderTop:'1px solid rgba(255,255,255,0.06)',marginTop:'2px'}},
          '💾 Anotá tus datos y usá Guardar progreso para no perderlos'
        ),
        h('div',{style:{display:'flex',gap:'4px',width:'100%',marginTop:'2px'}},
          h('button',{onClick:prevWeek,disabled:(wk.num||1)<=1,style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',cursor:(wk.num||1)<=1?'default':'pointer',border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',color:(wk.num||1)<=1?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},'← Anterior'),
          h('button',{onClick:newWeek,
              disabled:(wk.num||1)>=52,
              style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',
                cursor:(wk.num||1)<52?'pointer':'default',
                border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',
                color:(wk.num||1)<52?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.2)'}},'Siguiente →'),
        )
      )
    ),
    h('div',{style:{padding:'14px',paddingBottom:'80px'}},
      isViewingPast&&h('div',{style:{background:'#0A0A0A',borderRadius:'12px',padding:'12px 14px',marginBottom:'10px',display:'flex',gap:'10px',alignItems:'center'}},
        h('span',{style:{fontSize:'18px'}},'✏️'),
        h('div',null,
          h('div',{style:{fontSize:'12px',fontWeight:'800',color:'#fff',marginBottom:'2px'}},'Semana pasada — editable'),
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.5)'}},'Podés completar o corregir esta semana y enviar el reporte con su SemanID correspondiente.')
        )
      ),
      tab==='d'&&h(Dashboard,null),
      tab==='t'&&h(Training,{key:'training',exes,setExes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes,isViewingPast,isViewingFuture,realWkNum,onReloadHist:loadH}),
      tab==='die'&&h(Diet,{key:'diet',hab,user,menusVer,metaAgua,metaSal,nutriConfirmado}),
      tab==='ms'&&h(MiSemana,{key:'misemana',nut,setNut,hab,setHab,setSaved,pp,pc,cfg,nutriConfirmado,onEnviarReporte:save,saving,canSaveWeek:true,isViewingPast,reporteYaEnviado,wkSat}),
        tab==='dev'&&h(Devolucion,null),
      tab==='hiit'&&h(Hiit,{key:'hiit',cfg,hiitData,setHiitData,setSaved})
    ),
    h('div',{style:{background:'#0A0A0A',borderTop:'1px solid rgba(255,255,255,0.06)',display:'flex',position:'sticky',bottom:0,zIndex:10}},
      TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:'0 0 68px',padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:tab===t.id?`2px solid ${AC}`:'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',color:tab===t.id?AC:'rgba(255,255,255,0.35)',fontWeight:tab===t.id?'800':'400',transition:'color 0.2s'}},h('span',{style:{fontSize:'18px'}},t.ic),t.l))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
