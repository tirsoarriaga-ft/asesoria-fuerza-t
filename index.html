function toFrac(n){if(n<=0)return'0';const w=Math.floor(n),d=n-w;const fs=[[0,''],[0.25,'¼'],[0.333,'⅓'],[0.5,'½'],[0.667,'⅔'],[0.75,'¾']];let best=fs[0];fs.forEach(f=>{if(Math.abs(d-f[0])<Math.abs(d-best[0]))best=f;});if(Math.abs(d-1)<Math.abs(d-best[0]))return String(w+1);return(w>0?String(w):'')+best[1]||'0';}
function calcP(item,tmpl){const sh=(item.share!=null?item.share:1);if(item.fx)return{v:toFrac(item.vB*sh)+' '+item.vU,g:null};const f=(tmpl/BASE_T)*sh;return{v:toFrac(item.vB*f)+' '+item.vU,g:Math.round(item.gB*f)+'g'};}

// Construye la base de alimentos desde la hoja Menus
function buildFoodDB(rows){
  const db={};
  (rows||[]).forEach(row=>{
    const clave=String(row.Clave||row.clave||'').trim().toLowerCase();
    if(!clave)return;
    db[clave]={
      cat:String(row.Categoria||row.categoria||'P').toUpperCase().trim(),
      n:String(row.Nombre||row.nombre||clave),
      gB:parseFloat(row.Gramos2000||row.gramos2000)||0,
      vU:String(row.UnidadVisual||row.unidadvisual||'').trim(),
      vB:parseFloat(row.CantVisual||row.cantvisual)||1,
    };
  });
  return db;
}

// Construye el array de comidas desde la fila de Dietas + food DB
function parseDietas(row,foodDB){
  // PostEntreno eliminado (spec nutrición). Estructura base: 4 comidas.
  const MEALS=[
    {id:'desayuno',nom:'Desayuno',ic:'☀️',cols:['DesayunoA','DesayunoB','DesayunoC']},
    {id:'almuerzo',nom:'Almuerzo',ic:'🌞',cols:['AlmuerzoA','AlmuerzoB','AlmuerzoC']},
    {id:'merienda',nom:'Merienda',ic:'☕',cols:['MeriendaA','MeriendaB','MeriendaC']},
    {id:'cena',nom:'Cena',ic:'🌙',cols:['CenaA','CenaB','CenaC']},
  ];
  const OPT=['A','B','C'];
  const OPT_NOM={A:'Óptima',B:'Práctica',C:'Flexible'};
  // Calcula shares: si hay 2 alimentos de la misma categoría -> 0.5 c/u; 1 -> share 1.
  // Máximo 2 por categoría (los extras se descartan para no romper la lógica de porción).
  function withShares(items){
    const byCat={};
    items.forEach(it=>{(byCat[it.cat]=byCat[it.cat]||[]).push(it);});
    const out=[];
    Object.keys(byCat).forEach(cat=>{
      const arr=byCat[cat].slice(0,2); // máx 2 por categoría
      const share=arr.length===2?0.5:1;
      arr.forEach(it=>out.push(Object.assign({},it,{share,
        // cantidad final = individual × share
        gB:it.gB, vB:it.vB
      })));
    });
    return out;
  }
  return MEALS.map(meal=>{
    const ops=meal.cols.map((col,i)=>{
      const val=String(row[col]||'').trim();if(!val)return null;
      const raw=val.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).map(k=>{
        const food=foodDB[k];if(!food)return null;
        return{...food,key:k};
      }).filter(Boolean);
      if(!raw.length)return null;
      // Nombre de la preparación (columna {Col}Nombre, ej. DesayunoANombre). Opcional.
      const nombrePrep=String(row[col+'Nombre']||'').trim();
      return{id:OPT[i],nom:'Opción '+OPT[i]+' · '+OPT_NOM[OPT[i]],nombrePrep:nombrePrep,items:withShares(raw)};
    }).filter(Boolean);
    if(!ops.length)return null;
    return{...meal,ops};
  }).filter(Boolean);
}

// Semana secuencial basada en contador localStorage — Lun a Dom
function getWkForNum(user,num){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  const diffToMon=day===0?-6:1-day;
  startMon.setDate(startMon.getDate()+diffToMon);
  const wkMon=new Date(startMon);wkMon.setDate(startMon.getDate()+(num-1)*7);
  const wkSun=new Date(wkMon);wkSun.setDate(wkMon.getDate()+6);
  const fmtDay=d=>d.toLocaleDateString('es-AR',{day:'numeric'});
  const fmtMes=d=>d.toLocaleDateString('es-AR',{month:'short'}).replace('.','');
  const label=`Sem ${num} · ${fmtDay(wkMon)}-${fmtDay(wkSun)} ${fmtMes(wkSun).charAt(0).toUpperCase()+fmtMes(wkSun).slice(1)}`;
  return{id:`sem_${num}`,num,label,mon:wkMon,sun:wkSun};
}
// Calcula la semana real según el calendario hoy
function getRealWkNum(user){
  const startId=localStorage.getItem(`ase_${user}_startdate`)||new Date().toISOString().split('T')[0];
  let startMon=new Date(startId+'T12:00:00');
  if(isNaN(startMon.getTime())){const t=new Date();t.setHours(12,0,0,0);startMon=t;}
  const day=startMon.getDay();
  startMon.setDate(startMon.getDate()+(day===0?-6:1-day));
  const today=new Date();today.setHours(12,0,0,0);
  const diffMs=today-startMon;
  if(diffMs<0)return 1;
  return Math.floor(diffMs/(7*24*60*60*1000))+1;
}
// Devuelve el sábado (fin de semana) de una semana dada
function getWkSat(user,num){
  const wk=getWkForNum(user,num);
  const sat=new Date(wk.mon);sat.setDate(wk.mon.getDate()+5);sat.setHours(23,59,59,999);
  return sat;
}

// ── CHARTS ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=140,labels,pointLabels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:pointLabels?22:10,b:24,l:pointLabels?10:32,r:10};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block',overflow:'visible'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    pointLabels&&pointLabels.map((pl,i)=>(i%step===0||i===data.length-1)?h('text',{key:'pl'+i,x:x(i),y:y(data[i])-8,textAnchor:'middle',fontSize:'9',fontWeight:'700',fill:color},pl):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-6,textAnchor:'middle',fontSize:'9',fill:'#999'},l):null),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mn.toFixed(1)),
    !pointLabels&&h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'9',fill:'#999'},mx.toFixed(1))
  );
}
function DualBarChart({data,key2='toxics',color2=R}){
  if(!data||data.length<1)return null;
  const W=300,H=100,pad={t:8,b:22,l:20,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const bW=Math.min(10,iW/data.length/2-2);
  const gap=iW/data.length;
  const max2=Math.max(...data.map(d=>d[key2]||0),1);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('line',{x1:pad.l,y1:pad.t+iH,x2:W-pad.r,y2:pad.t+iH,stroke:'rgba(0,0,0,0.08)',strokeWidth:'1'}),
    data.map((d,i)=>{
      const cx=pad.l+i*gap+gap/2;
      const sH=(d.sleep/7)*iH;
      const v2=d[key2]||0;
      const tH=(v2/max2)*iH;
      return h('g',{key:i},
        h('rect',{x:cx-bW-1,y:pad.t+iH-sH,width:bW,height:Math.max(sH,1),fill:'#111',rx:'2'}),
        h('rect',{x:cx+1,y:pad.t+iH-tH,width:bW,height:Math.max(tH,1),fill:color2,rx:'2'}),
        h('text',{x:cx,y:H-6,textAnchor:'middle',fontSize:'8',fill:'#999'},d.label)
      );
    })
  );
}

function getNivel(score){
  if(score>=90)return{l:'⭐ MÁXIMO',sub:'Ejecución optimizada. Tu coach tiene todo para trabajar.',c:G};
  if(score>=70)return{l:'✅ MÍNIMO',sub:'Ejecución eficiente. Alcanza para generar adaptación.',c:B};
  return{l:'⚠️ INSUFICIENTE',sub:'Por debajo del piso necesario. Hay que ajustar antes de progresar.',c:R};
}

function getFoco(lastSem,bloqueKey,numSessPaut){
  if(!lastSem)return null;
  var sr=lastSem.sr||{};
  var scd=Object.values(sr).filter(function(s){return Object.values(s).some(function(ex){return parseInt((Object.values(ex||{})[0])||0)>0;});}).length;
  var pctE=scd/Math.max(numSessPaut,1);
  var nutr=lastSem.n||[];
  var tc=Math.min(24,nutr.slice(0,6).reduce(function(a,d){return a+Object.values(d.m||{}).filter(Boolean).length;},0));
  var pctN=tc/24;
  var h2=lastSem.h||{};
  var suenoOk=(h2.sleep||[]).filter(Boolean).length;
  var pctH=suenoOk/6;
  var mn=Math.min(pctE,pctN,pctH);
  var focoKey=mn===pctE?'entreno':mn===pctN?'nutricion':'habitos';
  var bk=bloqueKey; // bloques viejos ya normalizados a los 5 válidos; fallback visual abajo
  var msg=(FOCO_MSGS[focoKey]||{})[bk]||(FOCO_MSGS[focoKey]||{})['volumen']||'Seguí igual. La consistencia es la variable más importante.';
  if(mn>=0.8)return{msg:'Seguí igual. La consistencia es la variable más importante.',pilar:null};
  return{msg:msg,pilar:focoKey};
}

function calcLastScore(sem){
  if(!sem)return null;
  var sr=sem.sr||{};
  var nsp=3;
  var scd=Object.values(sr).filter(function(s){return Object.values(s).some(function(ex){return parseInt((Object.values(ex||{})[0])||0)>0;});}).length;
  var se=(scd/Math.max(nsp,1))*33;
  var nutr=sem.n||[];
  var tc=Math.min(24,nutr.slice(0,6).reduce(function(a,d){return a+Object.values(d.m||{}).filter(Boolean).length;},0));
  var sn=(tc/24)*25+((nutr.filter(function(d){return d.ak;}).length)/6)*8;
  var h2=sem.h||{};
  var sk=['energia','hambre','digestion','estres'];
  var sc=sk.filter(function(k){return (h2.sens||{})[k];}).length;
  var hp=(h2.meds||[]).some(function(m){return parseFloat(m.p)>0;})||(parseFloat(sem.pp||0)>0);
  var hc=(h2.meds||[]).some(function(m){return parseFloat(m.c)>0;})||(parseFloat(sem.pc||0)>0);
  return Math.round(se+sn+(sc/4)*18+(hp?8:0)+(hc?7:0));
}

  );
}

// ── TRAINING ──────────────────────────────────────────────────────────
function Training({exes,setExes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes,isViewingPast,realWkNum}){
  // SNAPSHOT DE RUTINA POR SEMANA: si se está viendo una semana pasada que guardó su propia
  // rutina, usar ESA para armar la vista (ejercicios, bloque, series) en vez de la rutina actual.
  // Semanas viejas sin snapshot -> se usa la rutina actual (fallback, comportamiento previo).
  if(isViewingPast&&hist&&wk){
    var _wSnap=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;});
    if(_wSnap&&_wSnap.rutina&&_wSnap.rutina.assign){
      cfg=Object.assign({},cfg,{
        num:_wSnap.rutina.num||cfg.num,
        assign:_wSnap.rutina.assign,
        bloque:_wSnap.rutina.bloque||cfg.bloque,
        series:_wSnap.rutina.series||cfg.series,
        bloqueInicio:_wSnap.rutina.bloqueInicio||cfg.bloqueInicio
      });
    }
  }
  const BLOQUES={
    volumen:    {label:'Volumen',        color:'#1D9E75',emoji:'📈',hint:'Vos intentá mejorar las reps entreno tras entreno con el peso indicado. Cuando llegues al techo del rango, los kg se ajustan solos para la siguiente sesión. Cada 2 semanas la app te agregará una serie efectiva extra.'},
    intensidad: {label:'Intensidad',     color:'#378ADD',emoji:'🏋️',hint:'Vos intentá mejorar las reps entreno tras entreno con el peso indicado. Cuando llegues al techo del rango, los kg se ajustan solos para la siguiente sesión. En la última serie de cada ejercicio, aplicá una técnica de intensidad.'},
    fuerza:     {label:'Fuerza',         color:'#DC2626',emoji:'💪',hint:'La primera sesion cargás un test de RM y la app fija tu referencia. El ejercicio principal sigue un protocolo por porcentaje (80/85/90% según la semana). Los accesorios y finalizadores progresan por reps.'},
    man:        {label:'Mantenimiento',  color:'#6B7280',emoji:'🔄',hint:'Vos intentá mejorar las reps entreno tras entreno con el peso indicado. Cuando llegues al techo del rango, los kg se ajustan solos para la siguiente sesión.'},
    base:       {label:'Progresión Base',color:'#F59E0B',emoji:'🌱',hint:'Las series y reps son fijas. Los kg los elegís vos: el peso no debe generarte dolor, pérdida de técnica ni desconfianza. Solo cuando lo sentís fácil, agregás peso — pero no series ni reps.'},
    rehabilitacion:{label:'Rehabilitación',color:'#0EA5E9',emoji:'🩹',hint:'La semana 1 del bloque anotás reps y kg de cada ejercicio; eso fija la pauta. Las semanas siguientes las reps quedan fijas y solo cargás el kg, confirmando si completaste con buena técnica y sin dolor.'},
    deporte:    {label:'Deporte',        color:'#8B5CF6',emoji:'🏀',hint:'El protocolo series-reps-kg ya está pautado. El objetivo es respetar lo indicado por la app y ejecutar cada rep a máxima velocidad. Si perdés velocidad, frenás la serie. Si te quedan series, podés sacar peso.'},
  };
  const bloque=(cfg?.bloque||'volumen').toLowerCase();
  const bloqueInfo=BLOQUES[bloque]||BLOQUES.volumen;
  const bloqueInicio=cfg?.bloqueInicio||1;
  const wkNum=wk?.num||1;
  const weeksInBlock=Math.max(0,wkNum-bloqueInicio);
  const hasProgression=bloque==='volumen'||bloque==='intensidad'||bloque==='fuerza';
  const hasAutoSeries=bloque==='volumen';
  const seriesBase=Math.min(4,Math.max(2,cfg?.series||2));
  const defCfg={num:3,assign:{A:[],B:[],C:[],D:[]}};
  if(!cfg)cfg=defCfg;
  const [configuring,setConfiguring]=useState(false);
  const [activeSess,setActiveSess]=useState('A');
  const [tut,setTut]=useState(null);
  const [showHistorial,setShowHistorial]=useState(null); // exId
  const [editKg,setEditKg]=useState(null);
  const [kgVal,setKgVal]=useState('');
  const [exEquiv,setExEquiv]=useState(null); // exercise to show equivalents for
  const [swapVerEx,setSwapVerEx]=useState(0);
  const [correcting,setCorrecting]=useState(false); // modo corrección de datos en semana pasada
  const [corrMsg,setCorrMsg]=useState('');
  const [videos,setVideos]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_videos`)||'{}')}catch(e){return{};}});
  const [uploading,setUploading]=useState({});
  const [showCamera,setShowCamera]=useState(null); // {sessId,exId}
  const fileRef=useRef(null);
  const uploadTarget=useRef(null);

  function getVideoKey(sessId,exId){return sessId+'_'+exId;}
  // ── FEEDBACK del coach (Entrega 6) ──
  // Se carga de la hoja Videos (columna Feedback). Se muestra en el ejercicio hasta que el asesorado
  // toca "Entendido" (se guarda en localStorage por fecha, así reaparece si el coach deja uno nuevo).
  const [feedbacks,setFeedbacks]=useState({}); // {sess_exId:{texto,fecha}}
  useEffect(function(){
    fetch(SCRIPT_URL+'?action=videos').then(function(r){return r.json();}).then(function(rows){
      var norm=function(x){return String(x||'').trim().toLowerCase();};
      var map={};
      (rows||[]).forEach(function(v){
        if(norm(v.Asesorado)!==norm(user))return;
        if(!v.Feedback||!String(v.Feedback).trim())return;
        // La columna Ejercicio puede tener el NOMBRE o el ID. Guardamos la clave por ambos,
        // normalizados, para que el matcheo funcione sin importar cómo se subió el video.
        var sess=String(v.Sesion||'').trim();
        var ejerc=norm(v.Ejercicio);
        var fbObj={texto:String(v.Feedback).trim(),fecha:String(v.FechaRevision||v.Fecha||'')};
        map[sess+'_'+ejerc]=fbObj; // clave por lo que venga en la hoja (nombre o id), normalizado
      });
      setFeedbacks(map);
    }).catch(function(){});
  },[user]);
  const fbVistoKey=(sess,exId,fecha)=>`ase_${user}_fbvisto_${sess}_${exId}_${fecha}`;
  const getFeedback=(sess,ex)=>{
    // ex puede ser el objeto ejercicio o un id. Intentamos matchear por ID y por NOMBRE (normalizados).
    var norm=function(x){return String(x||'').trim().toLowerCase();};
    var exId=(ex&&ex.id!==undefined)?ex.id:ex;
    var exNom=(ex&&ex.n!==undefined)?ex.n:'';
    var fb=feedbacks[sess+'_'+norm(exId)]||feedbacks[sess+'_'+norm(exNom)]||null;
    if(!fb)return null;
    try{ if(localStorage.getItem(fbVistoKey(sess,exId,fb.fecha)))return null; }catch(e){}
    return fb;
  };
  const [fbHidden,setFbHidden]=useState({});
  const marcarFbVisto=(sess,exId,fecha)=>{
    try{localStorage.setItem(fbVistoKey(sess,exId,fecha),'1');}catch(e){}
    setFbHidden(h=>({...h,[sess+'_'+exId]:true}));
  };
  function getVideo(sessId,exId){return videos[getVideoKey(sessId,exId)];}
  function saveVideoUrl(sessId,exId,url){
    const nv={...videos,[getVideoKey(sessId,exId)]:url};
    setVideos(nv);localStorage.setItem(`ase_${user}_videos`,JSON.stringify(nv));
    // Notificar al panel del coach via Apps Script
    const exName=exes.find(e=>e.id===parseInt(exId))?.n||exId;
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'video',user,asesoradoId:(localStorage.getItem('ase_'+user+'_aseid')||''),sessId,exId,exName,url,fecha:new Date().toISOString()})
    }).catch(()=>{});
  }
  async function uploadBlob(blob,sessId,exId){
    const key=getVideoKey(sessId,exId);
    setUploading(p=>({...p,[key]:true}));
    try{
      const fd=new FormData();
      fd.append('file',blob);
      fd.append('upload_preset',UPLOAD_PRESET);
      fd.append('public_id',`${user}_${key}_${Date.now()}`);
      const res=await fetch(CLOUD_URL,{method:'POST',body:fd});
      const data=await res.json();
      if(data.secure_url)saveVideoUrl(sessId,exId,data.secure_url);
    }catch(e){}
    setUploading(p=>({...p,[key]:false}));
  }
  function triggerGallery(sessId,exId){
    uploadTarget.current={sessId,exId};fileRef.current.click();
  }
  function onFileChange(e){
    const file=e.target.files[0];if(!file||!uploadTarget.current)return;
    const{sessId,exId}=uploadTarget.current;
    const mb=Math.round(file.size/1024/1024);
    if(file.size>80*1024*1024){
      if(!window.confirm(`El video pesa ${mb}MB y puede fallar al subir.\n¿Intentar igual? Si falla, usá "Grabar" desde la app.`)){e.target.value='';return;}
    }
    uploadBlob(file,sessId,exId);e.target.value='';
  }
  const [cfgSess,setCfgSess]=useState('A');
  const [openTec,setOpenTec]=useState(null);
  const SESS=['A','B','C','D','E'].slice(0,cfg.num);

  const saveCfg=nc=>{setCfg(nc);localStorage.setItem(CFG_KEY(user),JSON.stringify(nc));};
  const toggleEx=(s,id)=>{const cur=cfg.assign[s]||[];const na=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];saveCfg({...cfg,assign:{...cfg.assign,[s]:na}});};
  const setNum=n=>{const na={};['A','B','C','D','E'].slice(0,n).forEach(s=>{na[s]=cfg.assign[s]||[];});saveCfg({...cfg,num:n,assign:na});};

  const getKg=function(ex){
    if(isViewingPast){
      const thisWkData=hist.find(function(w){return w.wi===wk.id||w.id===wk.id;});
      if(thisWkData){
        var skU=thisWkData.skUsed||thisWkData.sk||{};
        var skSess=skU[activeSess];
        if(skSess){
          var kg=skSess[ex.id]||skSess[String(ex.id)];
          if(kg)return kg;
        }
      }
      return undefined; // en sem pasada NO caer al sessKg de hoy
    }
    return sessionKg&&sessionKg[activeSess]?(sessionKg[activeSess][ex.id]||sessionKg[activeSess][String(ex.id)]||undefined):undefined;
  };
  const getRep=(sess,exId,k)=>{
    // Buscar con la clave tal cual, como string y como int (post-migración ex.id es int del sheet,
    // pero el draft cargado del JSON trae claves string). Mismo criterio que getKg.
    const ss=sessionReps?.[sess]||{};
    const cell=ss[exId]||ss[String(exId)]||ss[parseInt(exId)]||null;
    const stored=cell?(cell[k]||''):'';
    if(stored)return stored;
    if(bloque==='base'){const ex=exes.find(e=>e.id==exId);if(ex)return String(Math.round((ex.low+ex.hi)/2));}
    return '';
  };

  const numSeries=(()=>{
    if(bloque==='base')return 3; // base: 3 series efectivas fijas siempre (no depende del sheet)
    if(bloque==='rehabilitacion')return 3; // rehab: 3 series fijas (pauta se fija en sem 1)
    if(hasAutoSeries)return Math.min(4,seriesBase+Math.floor(weeksInBlock/2));
    return seriesBase;
  })();
  const semanasParaSiguienteSerie=(hasAutoSeries&&numSeries<4)?(2-(weeksInBlock%2)||2):null;
  const SERIES_KEYS=['r1','r2','r3','r4'].slice(0,numSeries);
  // Series por ejercicio. En fuerza dependen del rol: principal=protocolo, accesorio=2, finalizador=1.
  const seriesKeysEx=(ex)=>{
    if(bloque!=='fuerza')return SERIES_KEYS;
    const rol=rolFuerza(ex);
    let n;
    if(rol==='principal')n=protoActual().series;      // 4, 4, 5 según semana
    else if(rol==='accesorio')n=2;
    else n=1;                                          // finalizador
    return ['r1','r2','r3','r4','r5'].slice(0,n);
  };

  const prevBestSet=(ex)=>{
    if(!hist||hist.length===0)return null;
    const prevs=hist
      .map(function(w){return{w:w,num:parseInt(String(w.wi||'').replace('sem_',''))||0};})
      .filter(function(x){return x.num>0&&x.num<(wk.num||1);})
      .sort(function(a,b){return b.num-a.num;});
    for(const x of prevs){
      const w=x.w;
      const reps=w.sr?.[activeSess]?.[ex.id]||w.sr?.[activeSess]?.[String(ex.id)];
      if(!reps)continue;
      const r1=parseInt(reps.r1)||0;
      if(r1===0)continue;
      const kg=(w.skUsed?.[activeSess]?.[ex.id])||(w.skUsed?.[activeSess]?.[String(ex.id)])||
               (w.sk?.[activeSess]?.[ex.id])||(w.sk?.[activeSess]?.[String(ex.id)])||
               w.e?.find(e=>e.id===ex.id)?.kg||ex.kg;
      return{reps:r1,kg};
    }
    return null;
  };
  const setRep=(sess,exId,k,v)=>{
    setSessionReps(prev=>{
      const next={...prev};
      if(!next[sess])next[sess]={};
      // Reusar la clave existente (string o int) para no duplicar; si no existe, usar int.
      let key=exId;
      if(next[sess][exId]===undefined&&next[sess][String(exId)]!==undefined)key=String(exId);
      else if(next[sess][exId]===undefined&&next[sess][parseInt(exId)]!==undefined)key=parseInt(exId);
      if(!next[sess][key])next[sess][key]={};
      next[sess][key]={...next[sess][key],[k]:v};
      return next;
    });
    setSaved(false);
  };
  const canIncreaseKg=ex=>{
    if(!hasProgression)return false;
    if(bloque==='fuerza'){
      // fuerza: sube c/2 semanas sin importar reps
      const lastUp=parseInt(localStorage.getItem(`ase_${user}_lastKgUp_${activeSess}_${ex.id}`))||0;
      return wkNum>=lastUp+2;
    }
    return true; // volumen, intensidad, man: sube al alcanzar techo
  };
  // ── PROTOCOLO DE FUERZA (Entrega 3) ──────────────────────────────────
  // Protocolo fijo por par de semanas del bloque. Editable acá si hace falta cambiarlo.
  const FUERZA_PROTOCOLO=[
    {sems:[1,2],series:4,reps:3,pct:80},
    {sems:[3,4],series:4,reps:2,pct:85},
    {sems:[5,6],series:5,reps:1,pct:90}
  ];
  // Semana dentro del bloque (1-based). weeksInBlock=0 -> semana 1 del bloque.
  const semEnBloque=weeksInBlock+1;
  // Rol del ejercicio por POSICIÓN en la sesión: 0=principal, 1-2=accesorio, 3+=finalizador.
  const rolFuerza=(ex)=>{
    const lista=(cfg.assign[activeSess]||[]);
    // posición del ejercicio en la sesión (aplanando biseries)
    let pos=-1, count=0;
    for(const item of lista){
      const ids=Array.isArray(item)?item:[item];
      for(const id of ids){ if(String(id)===String(ex.id)){pos=count;} count++; }
    }
    if(pos===0)return 'principal';
    if(pos===1||pos===2)return 'accesorio';
    return 'finalizador';
  };
  // ¿Es el día 1 del bloque de fuerza? (test de RM)
  const esDia1Fuerza=bloque==='fuerza'&&semEnBloque===1;
  // ── REHABILITACIÓN (Entrega ajuste) ──
  // Semana 1 del bloque: se anotan reps + kg (fija la pauta). Semanas siguientes: reps fijas, solo kg.
  const esDia1Rehab=bloque==='rehabilitacion'&&semEnBloque===1;
  const rehabRepsKey=(ex)=>`ase_${user}_rehabReps_${activeSess}_${ex.id}`;
  const getRehabReps=(ex)=>{const v=localStorage.getItem(rehabRepsKey(ex));return v?String(v):'';};
  const setRehabReps=(ex,val)=>{try{localStorage.setItem(rehabRepsKey(ex),String(val));}catch(e){}};
  // Clave localStorage del e1RM de referencia (por sesión+ejercicio). NO va al sheet.
  const rmRefKey=(ex)=>`ase_${user}_rmRef_${activeSess}_${ex.id}`;
  const getRmRef=(ex)=>{const v=parseFloat(localStorage.getItem(rmRefKey(ex)));return isNaN(v)?0:v;};
  const setRmRef=(ex,val)=>{try{localStorage.setItem(rmRefKey(ex),String(val));}catch(e){}};
  // Epley: e1RM = kg × (1 + reps/30)
  const epley=(kg,reps)=>Math.round(kg*(1+reps/30));
  // Esquema del protocolo para la semana actual del bloque
  const protoActual=()=>FUERZA_PROTOCOLO.find(p=>p.sems.includes(semEnBloque))||FUERZA_PROTOCOLO[FUERZA_PROTOCOLO.length-1];
  // kg objetivo del principal esta semana = e1RM_ref × %
  const kgPrincipal=(ex)=>{const rm=getRmRef(ex);if(!rm)return 0;const p=protoActual();return Math.round(rm*p.pct/100/2.5)*2.5;};
  const nKg=ex=>{
    const curKg=getKg(ex);if(!curKg)return null;
    if(bloque==='rehabilitacion'){
      // rehab: sugerir subir solo en semanas 2+ y si confirmó el protocolo (Sí). En sem1 no sugiere.
      if(esDia1Rehab)return null;
      return baseProto[ex.id]==='si'?rKg(curKg*1.05):null;
    }
    if(bloque==='base'){
      // base: sugerir subir SOLO si el asesorado confirmó el protocolo (Sí). No depende de reps (son fijas).
      return baseProto[ex.id]==='si'?rKg(curKg*1.05):null;
    }
    if(bloque==='fuerza'){
      // El principal sigue el protocolo (kg = %RM), no se sugiere subir por reps.
      // Accesorios y finalizadores: doble progresión normal (subir al llegar al techo).
      if(rolFuerza(ex)==='principal')return null;
      const r1f=parseInt(sessionReps?.[activeSess]?.[ex.id]?.r1)||0;
      return r1f>=ex.hi?rKg(curKg*1.05):null;
    }
    if(!canIncreaseKg(ex))return null;
    const r1=parseInt(sessionReps?.[activeSess]?.[ex.id]?.r1)||0;
    return r1>=ex.hi?rKg(curKg*1.05):null;
  };
  // Para base: reps pre-cargadas con la mitad del rango
  // Sugerencia intraserie: si serie anterior ≤ mitad del rango → bajar 10%
  const suggestedKg=(ex,serieIdx)=>{
    if(serieIdx===0)return null;
    const prevKey='r'+serieIdx;
    const prevReps=parseInt(sessionReps?.[activeSess]?.[ex.id]?.[prevKey])||0;
    if(!prevReps)return null;
    const mitad=(ex.low+ex.hi)/2;
    if(prevReps>mitad)return null;
    const curKg=getKg(ex);if(!curKg)return null;
    return Math.floor(curKg*0.9/2.5)*2.5;
  };
  // ── APROXIMACIONES (filas de lectura, calculadas del kg efectivo cargado) ──
  // volumen: 50% y 75% sin rep. intensidad: 50%x15 y 75%x8 (reps fijas). base: 50% sin rep.
  // rehabilitacion/fuerza: sin aproximaciones.
  const APROX_REPS={intensidad:[15,8]}; // reps fijas de aproximación por bloque (si aplica)
  const getAproximaciones=(ex)=>{
    // Fuerza principal: aproximaciones del kg OBJETIVO del protocolo (no del kg cargado).
    if(bloque==='fuerza'&&rolFuerza(ex)==='principal'&&!esDia1Fuerza){
      const kgObj=kgPrincipal(ex);
      if(!kgObj||kgObj<=0)return [];
      return [{pct:50,kg:rKg(kgObj*0.5)},{pct:75,kg:rKg(kgObj*0.75)}];
    }
    const curKg=getKg(ex);
    if(!curKg||curKg<=0)return [];
    if(bloque==='volumen')return [{pct:50,kg:rKg(curKg*0.5)},{pct:75,kg:rKg(curKg*0.75)}];
    if(bloque==='intensidad')return [{pct:50,kg:rKg(curKg*0.5),reps:15},{pct:75,kg:rKg(curKg*0.75),reps:8}];
    if(bloque==='base')return [{pct:50,kg:rKg(curKg*0.5)}];
    // Fuerza accesorios/finalizadores: aproximaciones 50%/75% del kg cargado, sin reps.
    if(bloque==='fuerza')return [{pct:50,kg:rKg(curKg*0.5)},{pct:75,kg:rKg(curKg*0.75)}];
    return []; // rehabilitacion: sin aproximaciones
  };
  // Estado: confirmación de protocolo en base (por ejercicio) — modula la sugerencia, NO se guarda.
  // base/rehab: confirmación de protocolo por ejercicio. Persiste en localStorage (por sesión+semana).
  const baseProtoKey=`ase_${user}_baseProto_${wk.id}_${activeSess}`;
  const [baseProto,setBaseProto]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_baseProto_${wk.id}_${activeSess}`)||'{}');}catch(e){return{};}});
  useEffect(()=>{try{setBaseProto(JSON.parse(localStorage.getItem(`ase_${user}_baseProto_${wk.id}_${activeSess}`)||'{}'));}catch(e){setBaseProto({});}},[activeSess,wk.id,user]);
  useEffect(()=>{try{localStorage.setItem(baseProtoKey,JSON.stringify(baseProto));}catch(e){}},[baseProto,baseProtoKey]);
  // fuerza día1: {exId:{kg,reps}} test de RM. Se persiste en localStorage para no perderse al salir.
  const rmTestLSKey=`ase_${user}_rmTest_${activeSess}`;
  const [rmTest,setRmTest]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_rmTest_${activeSess}`)||'{}');}catch(e){return{};}});
  // Recargar rmTest cuando cambia la sesión activa (cada sesión tiene su propio test)
  useEffect(()=>{try{setRmTest(JSON.parse(localStorage.getItem(`ase_${user}_rmTest_${activeSess}`)||'{}'));}catch(e){setRmTest({});}},[activeSess,user]);
  // Guardar rmTest en localStorage cada vez que cambia
  useEffect(()=>{try{localStorage.setItem(rmTestLSKey,JSON.stringify(rmTest));}catch(e){}},[rmTest,rmTestLSKey]);
  // Estado: técnica cargada por el asesorado en intensidad (texto libre, por ejercicio) — local.
  // intensidad: técnica cargada por el asesorado. Persiste en localStorage (por sesión+semana).
  const tecInputKey=`ase_${user}_tecInput_${wk.id}_${activeSess}`;
  const [tecInput,setTecInput]=useState(()=>{try{return JSON.parse(localStorage.getItem(`ase_${user}_tecInput_${wk.id}_${activeSess}`)||'{}');}catch(e){return{};}});
  useEffect(()=>{try{setTecInput(JSON.parse(localStorage.getItem(`ase_${user}_tecInput_${wk.id}_${activeSess}`)||'{}'));}catch(e){setTecInput({});}},[activeSess,wk.id,user]);
  useEffect(()=>{try{localStorage.setItem(tecInputKey,JSON.stringify(tecInput));}catch(e){}},[tecInput,tecInputKey]);
  const doSaveKg=(ex,val)=>{
    const kg=parseFloat(val);if(isNaN(kg)||kg<=0)return setEditKg(null);

// ── DIET ──────────────────────────────────────────────────────────────
const NIVEL_BANNER={
  1:'Foco en la calidad y el orden de las comidas. Cuatro comidas al dia, alimentos reales, pocas ultraprocesados.',
  2:'Foco en las porciones ademas de la calidad. Comer lo correcto en la cantidad correcta para tu objetivo.',
  3:'Foco en la precision. Macros ajustados a tu plan, porciones exactas, timing nutricional optimizado.',
};
function Diet({hab,user,menusVer,metaAgua,metaSal,nivel}){
  const tKey=`ase_${user}_tmpl`;const oKey=`ase_${user}_opts`;
  // hayTemplate: true solo si el coach cargó un Template real. Si no, no se muestran cantidades.
  const tmplRaw=localStorage.getItem(tKey);
  const hayTemplate=tmplRaw!==null&&tmplRaw!==''&&!isNaN(parseInt(tmplRaw))&&parseInt(tmplRaw)>0;
  const [tmpl,setTmplState]=useState(()=>parseInt(localStorage.getItem(tKey))||2000);
  const [opts,setOpts]=useState(()=>{try{return JSON.parse(localStorage.getItem(oKey))||{};}catch(e){return{};}});
  const cKey=`ase_${user}_diet_collapsed`;
  const [collapsed,setCollapsed]=useState(()=>{try{return JSON.parse(localStorage.getItem(cKey))||{};}catch(e){return{};}});
  const toggle=id=>setCollapsed(c=>{const n={...c,[id]:c[id]===undefined?true:!c[id]};localStorage.setItem(cKey,JSON.stringify(n));return n;});
  const [swapVersion,setSwapVersion]=useState(0);
  const comidas=useMemo(()=>{
    try{
      const s=localStorage.getItem(`ase_${user}_menus`);
      if(s){
        const p=JSON.parse(s);
        if(p&&p.length>0){
          // Aplicar swaps permanentes
          const permKey='ase_'+user+'_food_perm';
          var perms={};
          try{perms=JSON.parse(localStorage.getItem(permKey)||'{}');}catch(e2){}
          // Splits (dividir/unir): {origKey: segundoAlimento}. Perm en localStorage, hoy en sessionStorage.
          var splitsPerm={};
          try{splitsPerm=JSON.parse(localStorage.getItem('ase_'+user+'_food_split')||'{}');}catch(e4){}
          function getSplit(origKey){
            // solo hoy tiene prioridad sobre permanente
            try{var h=sessionStorage.getItem('ase_'+user+'_food_split_hoy_'+origKey);if(h)return JSON.parse(h);}catch(e5){}
            return splitsPerm[origKey]||null;
          }
          return p.map(function(comida){
            return Object.assign({},comida,{
              ops:comida.ops.map(function(op){
                var nuevosItems=[];
                op.items.forEach(function(item){
                  var origKey=item.origKey||item.key;
                  var resuelto=item;
                  // 1) swap permanente
                  if(perms[origKey]){
                    resuelto=Object.assign({},perms[origKey],{key:origKey,origKey:origKey,curKey:(perms[origKey].key||perms[origKey].curKey),share:item.share,_swapped:true});
                  }else{
                    // 2) swap solo hoy
                    try{
                      var hoyStr=sessionStorage.getItem('ase_'+user+'_food_hoy_'+origKey);
                      if(hoyStr){
                        var hoyItem=JSON.parse(hoyStr);
                        resuelto=Object.assign({},hoyItem,{key:origKey,origKey:origKey,curKey:(hoyItem.key||hoyItem.curKey),share:item.share,_swappedHoy:true});
                      }
                    }catch(e3){}
                  }
                  // 3) split: si este slot está dividido, mostrar 2 items (0.5 c/u)
                  var sp=getSplit(origKey);
                  if(sp&&(item.share===1||item.share==null)){
                    nuevosItems.push(Object.assign({},resuelto,{share:0.5,_splitPrimario:true,origKey:origKey}));
                    nuevosItems.push(Object.assign({},sp,{share:0.5,_splitSecundario:true,origKey:origKey,curKey:sp.key}));
                  }else{
                    nuevosItems.push(resuelto);
                  }
                });
                return Object.assign({},op,{items:nuevosItems});
              })
            });
          });
        }
      }
    }catch(e){}
    return [];
  },[user,menusVer,swapVersion]);
  useEffect(()=>{const t=parseInt(localStorage.getItem(tKey));if(!isNaN(t)&&TEMPLATES.includes(t))setTmplState(t);},[menusVer]);
  const setO=(m,o)=>{const n={...opts,[m]:o};setOpts(n);localStorage.setItem(oKey,JSON.stringify(n));};
  const pesoVal=normNum(hab.meds.find(m=>m.p&&normNum(m.p)>0)?.p)||70;
  const wML=Math.round(pesoVal*40/4);const sSalt=(pesoVal*40/4/1000).toFixed(1);

  const [swapItem,setSwapItem]=useState(null); // {n, cat, key} of tapped item
  const [verGramos,setVerGramos]=useState({}); // {comidaId: bool} mostrar cantidad exacta (gramos)
  const [confMenus,setConfMenus]=useState(false); // confirmando menús
  const [menusConfirmados,setMenusConfirmados]=useState(()=>localStorage.getItem(`ase_${user}_menusConfirmados`)==='1');
  const [modalPaso,setModalPaso]=useState('menu'); // 'menu' | 'dividir' | 'reemplazar' | 'unir' | 'cuando'
  const [accionPend,setAccionPend]=useState(null); // {tipo:'dividir'|'reemplazar'|'unir', item?} guardado hasta elegir hoy/siempre
  // Al abrir/cerrar un alimento, resetear el paso
  const abrirModal=(item)=>{setSwapItem(item);setModalPaso('menu');setAccionPend(null);};
  const cerrarModal=()=>{setSwapItem(null);setModalPaso('menu');setAccionPend(null);};
  // Ejecuta la acción elegida (dividir/unir/reemplazar) con alcance hoy(false)/siempre(true)
  const aplicarAccion=(accion,siempre)=>{
    if(!swapItem)return;
    var slotKey=swapItem.origKey||swapItem.key;
    try{
      if(accion.tipo==='reemplazar'){
        var item=accion.item;
        if(siempre){
          var perms=JSON.parse(localStorage.getItem('ase_'+user+'_food_perm')||'{}');
          if(item.key===slotKey)delete perms[slotKey];else perms[slotKey]=item;
          localStorage.setItem('ase_'+user+'_food_perm',JSON.stringify(perms));
        }else{
          if(item.key===slotKey)sessionStorage.removeItem('ase_'+user+'_food_hoy_'+slotKey);
          else sessionStorage.setItem('ase_'+user+'_food_hoy_'+slotKey,JSON.stringify(item));
        }
      }else if(accion.tipo==='dividir'){
        if(siempre){
          var sp=JSON.parse(localStorage.getItem('ase_'+user+'_food_split')||'{}');
          sp[slotKey]=accion.item;localStorage.setItem('ase_'+user+'_food_split',JSON.stringify(sp));
        }else{
          sessionStorage.setItem('ase_'+user+'_food_split_hoy_'+slotKey,JSON.stringify(accion.item));
        }
      }else if(accion.tipo==='unir'){
        if(siempre){
          var sp2=JSON.parse(localStorage.getItem('ase_'+user+'_food_split')||'{}');
          delete sp2[slotKey];localStorage.setItem('ase_'+user+'_food_split',JSON.stringify(sp2));
          sessionStorage.removeItem('ase_'+user+'_food_split_hoy_'+slotKey);
        }else{
          sessionStorage.removeItem('ase_'+user+'_food_split_hoy_'+slotKey);
        }
      }
    }catch(err){}
    cerrarModal();
    setSwapVersion(function(v){return v+1;});
  };

  // Todos los alimentos de la misma categoría del foodDB completo
  const equivalents=useMemo(()=>{
    if(!swapItem)return[];
    const foodDBStr=localStorage.getItem(`ase_${user}_foodDB`);
    let allFoods=[];
    try{
      const db=foodDBStr?JSON.parse(foodDBStr):{};
      allFoods=Object.entries(db).map(([key,food])=>({...food,key}));
    }catch(e){
      // fallback: buscar en comidas del plan
      const seen=new Set();
      comidas.forEach(c=>c.ops.forEach(op=>op.items.forEach(item=>{
        if(!seen.has(item.key)){seen.add(item.key);allFoods.push(item);}
      })));
    }
    // Excluir el alimento ACTUALMENTE mostrado (curKey si el item fue reemplazado, sino key),
    // para que el original siempre aparezca como opción para volver.
    const excluir=swapItem.curKey||swapItem.key;
    return allFoods.filter(item=>item.cat===swapItem.cat&&item.key!==excluir);
  },[swapItem,comidas,user]);

  // SVG plato para nivel 1

    var newN=nut.map(function(d,i){
      if(i!==di)return d;
      var nm=Object.assign({},d.m,{[meal]:val});

    var newN=nut.map(function(d,i){return i===di?Object.assign({},d,{m:Object.assign({},d.m,{[meal+'_txt']:txt})}):d;});
    setNut(newN);setSaved(false);

    var cur=(nut[di].agua)||'';

function Hiit({cfg,hiitData,setHiitData,setSaved}){

  const curS=sess.find(s=>s.id===activeS)||sess[0];
  // Valores editables guardados en hiitData.hiitKg
  const getSessVal=(sessId,field)=>hiitData?.hiitKg?.[sessId]?.[field]||'';
  const setSessVal=(sessId,field,val)=>{
    setHiitData(prev=>{const n={...prev,hiitKg:{...prev.hiitKg,[sessId]:{...(prev.hiitKg?.[sessId]||{}),[field]:val}}};return n;});

    setHiitData(prev=>{const n={...prev,regs:{...prev.regs,[sessId]:{...(prev.regs?.[sessId]||{}),[field]:val}}};return n;});
    setSaved(false);
  };
  const sensEsp=HIIT_SENS[curS.nom]||'—';
  const detalle=getSessVal(curS.id,'detalle')||curS.detalle;
  const ritmo=getSessVal(curS.id,'ritmo')||curS.ritmo;
  return h('div',null,
    // Selector de sesión
    h('div',{style:card},
      h('div',{style:{...lbl,marginBottom:'8px'}},'Sesión HIIT'),
      h('div',{style:{display:'flex',gap:'6px'}},sess.map(s=>h('button',{key:s.id,onClick:()=>setActiveS(s.id),style:{flex:1,padding:'10px 4px',fontSize:'13px',cursor:'pointer',border:'2px solid',borderRadius:'8px',fontWeight:activeS===s.id?'800':'400',color:activeS===s.id?'#111':'#999',background:activeS===s.id?'#F0F0F0':'#fff',borderColor:activeS===s.id?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.08)'}},s.id,' ',h('span',{style:{fontSize:'10px',display:'block',marginTop:'2px',color:'#999'}},s.nom))))
    ),
    // Plan
    h('div',{style:card},
      h('div',{style:{fontSize:'15px',fontWeight:'800',marginBottom:'4px'}},curS.nom),
      h('div',{style:{fontSize:'12px',color:'#999',marginBottom:'12px'}},'Sensación esperada: ',h('span',{style:{color:B,fontWeight:'600'}},sensEsp)),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}},
        [{f:'detalle',l:'📍 Protocolo',v:detalle},{f:'ritmo',l:'⏱ Ritmo / Intensidad',v:ritmo}].map(({f,l,v})=>{
          const editing=editField?.sessId===curS.id&&editField?.field===f;
          return h('div',{key:f},
            h('div',{style:lbl},l),

function CameraModal({onCapture,onClose}){
  const [recording,setRecording]=useState(false);
  const [countdown,setCountdown]=useState(120);
  const [mrState,setMrState]=useState(null);
  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const mrRef=useRef(null);
  const chunksRef=useRef([]);
  const timerRef=useRef(null);
  useEffect(()=>{
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:720}},audio:true})
      .then(stream=>{streamRef.current=stream;if(videoRef.current)videoRef.current.srcObject=stream;})
      .catch(()=>onClose());
    return()=>{
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
      if(timerRef.current)clearInterval(timerRef.current);
    };
  },[]);
  function startRec(){
    chunksRef.current=[];
    const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm';
    const mr=new MediaRecorder(streamRef.current,{mimeType:mime,videoBitsPerSecond:500000});
    mr.ondataavailable=e=>e.data.size>0&&chunksRef.current.push(e.data);
    mr.onstop=()=>{const blob=new Blob(chunksRef.current,{type:'video/webm'});onCapture(blob);};
    mrRef.current=mr;mr.start(1000);setRecording(true);setMrState('recording');
    let secs=0;setCountdown(120);
    timerRef.current=setInterval(()=>{secs++;setCountdown(120-secs);if(secs>=120)stopRec();},1000);
  }
  function stopRec(){
    if(mrRef.current&&mrRef.current.state!=='inactive')mrRef.current.stop();
    clearInterval(timerRef.current);setRecording(false);setMrState('done');
  }
  return h('div',{style:{position:'fixed',inset:0,background:'#000',zIndex:200,display:'flex',flexDirection:'column'}},
    h('video',{ref:videoRef,autoPlay:true,muted:true,playsInline:true,style:{flex:1,width:'100%',objectFit:'cover'}}),
    h('div',{style:{padding:'20px 24px',background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',gap:'24px',position:'relative'}},
      h('button',{onClick:onClose,style:{position:'absolute',top:'16px',left:'16px',background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',borderRadius:'8px',padding:'8px 12px',cursor:'pointer',fontSize:'13px'}},'✕ Cancelar'),
      !recording
        ?h('button',{onClick:startRec,style:{background:R,color:'#fff',border:'4px solid rgba(255,255,255,0.3)',borderRadius:'50%',width:'70px',height:'70px',fontSize:'28px',cursor:'pointer'}}, '⏺')
        :h('div',{style:{display:'flex',alignItems:'center',gap:'16px'}},
            h('div',{style:{color:'#fff',fontSize:'22px',fontWeight:'800',minWidth:'60px',textAlign:'center'}},countdown+'s'),
            h('button',{onClick:stopRec,style:{background:'#fff',color:'#111',border:'none',borderRadius:'50%',width:'70px',height:'70px',fontSize:'22px',cursor:'pointer',fontWeight:'800'}},'⏹')
          ),
      recording&&h('div',{style:{position:'absolute',top:'16px',right:'16px',display:'flex',alignItems:'center',gap:'6px'}},
        h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:R,animation:'pulse 1s infinite'}}),
        h('span',{style:{color:'#fff',fontSize:'12px',fontWeight:'700'}})
      )
    )
  );
}

// ── HELPERS DE BACKUP / MIGRACIÓN ─────────────────────────────────────
function _ftNorm(s){return String(s||'').trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');}
function _ftGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _ftSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// Devuelve el contenido del backup pre-migración más ANTIGUO (el original limpio), como objeto {clave:valor}.
function _ftBackupOriginal(user){
  var p='ase_'+user+'_';
  var keys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p+'migbackup_')===0)keys.push(k);}}catch(e){}
  if(!keys.length)return null;
  // el más antiguo = timestamp menor = estado más limpio (pre primera migración)
  keys.sort(function(a,b){var ta=parseInt(a.split('migbackup_')[1])||0;var tb=parseInt(b.split('migbackup_')[1])||0;return ta-tb;});
  try{return {key:keys[0],data:JSON.parse(_ftGet(keys[0])||'{}')};}catch(e){return null;}
}
// Guarda un backup del estado ACTUAL antes de cualquier operación (por si acaso).
function _ftSnapshot(user,tagPrefix){
  var p='ase_'+user+'_';var snap={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p)===0&&k.indexOf(p+'migbackup_')!==0)snap[k]=localStorage.getItem(k);}}catch(e){}
  _ftSet(p+(tagPrefix||'migbackup')+'_'+Date.now(),JSON.stringify(snap));
}

// ── RESTAURAR desde el backup original (pre-migración) ────────────────
// Repone TODAS las claves del usuario tal como estaban antes de migrar.
function restaurarBackupOriginal(user){
  var p='ase_'+user+'_';
  var bk=_ftBackupOriginal(user);
  if(!bk||!bk.data||Object.keys(bk.data).length===0)return {error:'no hay backup para restaurar'};
  // Snapshot del estado actual antes de pisarlo (por seguridad)
  _ftSnapshot(user,'prerestore');
  var count=0;
  Object.keys(bk.data).forEach(function(k){
    // No reponer los propios backups dentro del backup (no debería haberlos, pero por si acaso)
    if(k.indexOf(p+'migbackup_')===0)return;
    _ftSet(k,bk.data[k]);count++;
  });
  // Al restaurar, quitamos la marca de migrado para poder re-migrar limpio
  try{localStorage.removeItem(p+'migrated_v1');}catch(e){}
  return {ok:true,claves:count,backup:bk.key};
}

// ── MIGRACIÓN A IDs ESTABLES DEL SHEET (v2 — por semana, desde backup) ─
// Traduce sr/skUsed/sk de cada semana usando el snapshot `e` de ESA MISMA
// semana (cada semana tiene su propio orden), tomando SIEMPRE como fuente
// el backup original (nunca datos ya migrados). Idempotente.
function migrarIDsEstables(user,rows,force){
  var p='ase_'+user+'_';
  if(!force&&_ftGet(p+'migrated_v2'))return {skipped:true};
  var nameToId={};
  (rows||[]).forEach(function(r){var id=parseInt(r.ID!==undefined?r.ID:r.id);var nm=_ftNorm(r.Nombre||r.NOMBRE||r.nombre);if(!isNaN(id)&&nm)nameToId[nm]=id;});
  if(Object.keys(nameToId).length===0)return {error:'sin ejercicios del sheet'};
  // FUENTE: backup original si existe (datos limpios); si no, estado actual (solo si no migrado v2).
  var bk=_ftBackupOriginal(user);
  var source=bk?bk.data:null;
  var getRaw=function(k){return source?source[k]:_ftGet(k);};
  // Snapshot del estado actual antes de sobrescribir (por seguridad)
  _ftSnapshot(user,'premig2');
  var histIds=[];try{histIds=JSON.parse(getRaw(p+'hist')||'[]');}catch(e){}
  var unmapped=0, mapped=0;
  histIds.forEach(function(semId){
    var raw=getRaw(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w.e||!w.e.length)return; // sin snapshot no se puede traducir: dejar como está
    // diccionario de ESTA semana: id_viejo -> nombre
    var oldToName={};
    w.e.forEach(function(ex){if(ex&&ex.id!==undefined&&ex.n)oldToName[String(ex.id)]=_ftNorm(ex.n);});
    var remap=function(obj){
      if(!obj)return obj;
      var out={};
      Object.keys(obj).forEach(function(sess){
        out[sess]={};
        Object.keys(obj[sess]||{}).forEach(function(oldId){
          var nm=oldToName[String(oldId)];
          var nid=nm?nameToId[nm]:undefined;
          if(nid!==undefined){out[sess][nid]=obj[sess][oldId];mapped++;}
          else{out[sess][oldId]=obj[sess][oldId];unmapped++;} // preservar huérfano tal cual
        });
      });
      return out;
    };
    w.sr=remap(w.sr);
    w.skUsed=remap(w.skUsed);
    w.sk=remap(w.sk);
    // e nuevo con ids del sheet (para que la app lo lea coherente)
    w.e=w.e.map(function(ex){var nid=ex&&ex.n?nameToId[_ftNorm(ex.n)]:undefined;return Object.assign({},ex,{id:nid!==undefined?nid:ex.id});});
    w._migrated2=true;
    _ftSet(p+semId,JSON.stringify(w));
    // MIGRAR TAMBIÉN EL DRAFT de esta semana: la app lee el draft primero al abrir.
    // El draft no tiene su propio `e`, así que se traduce con el oldToName de ESTA semana.
    var draftKey=p+'draft_'+semId;
    var draftRaw=getRaw(draftKey);
    if(draftRaw){
      try{
        var dr=JSON.parse(draftRaw);
        if(dr&&dr.sr)dr.sr=remap(dr.sr);
        dr._migrated2=true;
        _ftSet(draftKey,JSON.stringify(dr));
      }catch(e){}
    }
  });
  // Asegurar que hist esté repuesto (viene del backup)
  var histRaw=getRaw(p+'hist');if(histRaw)_ftSet(p+'hist',histRaw);
  // Reconstruir sessKg vivo desde las semanas ya migradas (más nueva -> más vieja)
  var newSessKg={};
  histIds.slice().reverse().forEach(function(semId){
    var raw=_ftGet(p+semId);if(!raw)return;
    var w;try{w=JSON.parse(raw);}catch(e){return;}
    if(!w._migrated2)return;
    var src=w.skUsed||w.sk||{};
    Object.keys(src).forEach(function(sess){
      if(!newSessKg[sess])newSessKg[sess]={};
      Object.keys(src[sess]||{}).forEach(function(exId){
        if(newSessKg[sess][exId]===undefined){var v=src[sess][exId];if(v&&parseFloat(v)>0)newSessKg[sess][exId]=v;}
      });
    });
  });
  _ftSet(p+'sessKg',JSON.stringify(newSessKg));
  _ftSet(p+'migrated_v2','1');
  return {ok:true,semanas:histIds.length,mapped:mapped,unmapped:unmapped,fuente:bk?'backup':'actual'};
}

  // Efecto 2: cargar rutinas y menús después de ejercicios
  useEffect(()=>{

    Promise.all([

    ])

        const ficha=(asesorados||[]).find(a=>String(a.Asesorado||'').trim().toLowerCase()===user.trim().toLowerCase())||null;
        // FASE 4.3: el AsesoradoID resuelto (de la maestra). Se usa para buscar por ID con fallback a nombre.
        const aseId=ficha&&ficha.AsesoradoID?String(ficha.AsesoradoID).trim().toLowerCase():'';
        // Buscar la fila en Rutinas: PRIMERO por AsesoradoID, si no hay match, por nombre (fallback).

        // Helper: toma el dato de la ficha maestra Asesorados (fuente única de identidad).
        // FASE 4.5: se retiró el fallback a Rutinas (esas columnas ya no existen).
        const ident=(campoFicha)=>{
          if(ficha&&ficha[campoFicha]!==undefined&&String(ficha[campoFicha]).trim()!=='')return ficha[campoFicha];
          return undefined;
        };
        if(fila){
          const num=parseInt(fila.NumSesiones)||3;
          const assign={};
          const norm2=n=>n.trim().toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
          ['A','B','C','D','E'].slice(0,num).forEach(s=>{
            const nombres=String(fila['Sesion'+s]||'').split(',').map(n=>n.trim()).filter(Boolean);
            assign[s]=nombres.map(nombre=>{
              if(nombre.includes('+')){
                // biserie o serie gigante: 2+ ejercicios separados por +
                return nombre.split('+').map(n=>{const ex=exesRef.current.find(e=>norm2(e.n)===norm2(n.trim()));return ex?ex.id:null;}).filter(Boolean);
              }
              const ex=exesRef.current.find(e=>norm2(e.n)===norm2(nombre.trim()));
              return ex?ex.id:null;
            }).filter(v=>v!==null);
          });
          const hiitSess=['A','B','C','D','E'].map(s=>{
            const nom=String(fila['HIIT'+s]||'').trim();
            if(!nom)return null;
            return{id:s,nom,detalle:String(fila['HIIT'+s+'Detalle']||'').trim(),ritmo:String(fila['HIIT'+s+'Ritmo']||'').trim()};
          }).filter(Boolean);
          const normBloque=s=>{
            const n=String(s||'').toLowerCase().trim().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');
            const VALIDOS={'volumen':1,'fuerza':1,'intensidad':1,'base':1,'rehabilitacion':1};
            const SINON={'rehab':'rehabilitacion','rehabilitación':'rehabilitacion','progresion base':'base','progresionbase':'base'};
            var m=SINON[n]||n;
            return VALIDOS[m]?m:'base';
          };
          // PesoRef: desde la ficha maestra, con fallback a Rutinas
          const pesoRefVal=parseFloat(ident('PesoRef'))||0;
          const newCfg={num,assign,series:Math.min(4,Math.max(2,parseInt(fila.Series)||2)),bloque:normBloque(String(fila.Bloque||'volumen')),bloqueInicio:parseInt(fila.BloqueInicio)||1,hiit:hiitSess,pesoRef:pesoRefVal};setCfg(newCfg);localStorage.setItem(CFG_KEY(user),JSON.stringify(newCfg));
          // FechaInicio: desde ficha maestra, con fallback a Rutinas
          const fechaInicio=String(ident('FechaInicio')||'').trim();

          // Datos de identidad (Sexo/Edad/Altura/Objetivo/Plan) desde ficha maestra → localStorage para diagnóstico
          try{
            const idData={sexo:ident('Sexo'),edad:ident('Edad'),altura:ident('Altura'),objetivo:ident('Objetivo'),plan:ident('Plan')};
            localStorage.setItem(`ase_${user}_ident`,JSON.stringify(idData));
          }catch(e){}
          // FASE 4.1: resolver y guardar el AsesoradoID (por nombre → ID de la maestra).
          // El asesorado sigue entrando con su nombre (Camino A); el ID queda disponible
          // para los pasos siguientes (escrituras/lecturas por ID). No cambia nada más aún.
          try{
            const aseId=(ficha&&ficha.AsesoradoID)?String(ficha.AsesoradoID).trim():'';
            if(aseId)localStorage.setItem(`ase_${user}_aseid`,aseId);
          }catch(e){}
          // Template: la fuente ahora es Dietas, pero mantenemos fallback a Rutinas si aún existe
          const tmpl=parseInt(fila.Template);
          if(!isNaN(tmpl)&&TEMPLATES.includes(tmpl))localStorage.setItem(`ase_${user}_tmpl`,String(tmpl));
        }
      }).catch(()=>{});
    // Alimentos (hoja Menus) + Dietas en paralelo → construye la dieta del asesorado
    Promise.all([
      fetch(SCRIPT_URL+'?action=menus').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=dietas').then(r=>r.json()).catch(()=>[])
    ]).then(([menusRows,dietasRows])=>{
      const foodDB=buildFoodDB(menusRows||[]);
      localStorage.setItem(`ase_${user}_foodDB`,JSON.stringify(foodDB)); // guardar para equivalencias
      // FASE 4.3: buscar la fila en Dietas PRIMERO por AsesoradoID (de localStorage, guardado en 4.1),
      // con fallback a nombre. Así se migra la lectura sin romper si el ID no está.
      const normD=x=>String(x||'').trim().toLowerCase();
      const aseIdD=normD(localStorage.getItem(`ase_${user}_aseid`)||'');
      let dietaFila=null;
      if(aseIdD){ dietaFila=(dietasRows||[]).find(r=>normD(r.AsesoradoID)===aseIdD)||null; }
      if(!dietaFila){ dietaFila=(dietasRows||[]).find(r=>normD(r.Asesorado)===user.trim().toLowerCase())||null; }
      if(dietaFila){
        const tmpl=parseInt(dietaFila.Template);
        // El SHEET es la fuente de verdad del Template: si hay uno válido, se guarda;
        // si el sheet NO tiene Template, se BORRA el cacheado (así un cambio a deficit/volumen
        // o quitar el Template se refleja en las porciones de la app).
        if(!isNaN(tmpl)&&TEMPLATES.includes(tmpl)){localStorage.setItem(`ase_${user}_tmpl`,String(tmpl));}
        else{localStorage.removeItem(`ase_${user}_tmpl`);}
        const pi=parseFloat(String(dietaFila.PesoInicial||'').replace(',','.'));
        if(!isNaN(pi)&&pi>0)localStorage.setItem(`ase_${user}_pesoinicial`,String(pi));
        const niv=parseInt(dietaFila.Nivel||'1');
        if(niv>=1&&niv<=3)localStorage.setItem(`ase_${user}_nivel`,String(niv));
        const comidas=parseDietas(dietaFila,foodDB);
        if(comidas.length>0){
          localStorage.setItem(`ase_${user}_menus`,JSON.stringify(comidas));
          setMenusVer(v=>v+1);
        }
      } else {
        // No hay fila de dieta en el sheet para este asesorado: sin Template (sheet manda).
        localStorage.removeItem(`ase_${user}_tmpl`);
      }
    }).catch(()=>{});
  },[user,exesReady]);

  const login=name=>{localStorage.setItem(USER_KEY,name);setUser(name);};

  function loadH(){
    try{const list=JSON.parse(localStorage.getItem(HK(user))||'[]');const w=list.map(id=>{try{return JSON.parse(localStorage.getItem(SK(id,user)));}catch(e){return null;}}).filter(Boolean).sort((a,b)=>(a.wi||'').localeCompare(b.wi||''));setHist(w);}catch(e){setHist([]);}

  const [saveErrors,setSaveErrors]=useState([]);
  function validateSave(){
    const errors=[];
    // MEDICIONES: peso, cintura y al menos una sensación
    const meds=hab.meds||[];
    const hasPeso=meds.some(m=>parseFloat(m.p)>0);
    const hasCintura=meds.some(m=>parseFloat(m.c)>0);
    const sens=hab.sens||{};
    const hasSens=['energia','hambre','digestion','estres'].every(k=>sens[k]);
    if(!hasPeso)errors.push('Peso corporal (Mediciones): registrá al menos un día');
    if(!hasCintura)errors.push('Cintura (Mediciones): registrá al menos un día');
    if(!hasSens)errors.push('Sensaciones (Mediciones): completá Energía, Hambre, Digestión y Estrés');
    // ENTRENO: al menos un ejercicio registrado.
    // En volumen/fuerza/intensidad se exige kg + reps. En base/rehabilitación NO se exige kg
    // (suelen ser ejercicios técnicos o de peso corporal, sin carga), basta con reps.
    const bloqueVal=String(cfg.bloque||'volumen').toLowerCase();
    const exigeKg=(bloqueVal!=='base'&&bloqueVal!=='rehabilitacion');
    const allExes=Object.values(cfg.assign||{}).flat();
    const hasAnyExData=allExes.some(exId=>{
      const sesId=Object.entries(cfg.assign||{}).find(([s,ids])=>ids.includes(exId))?.[0];
      const r1=parseInt(sessionReps?.[sesId]?.[exId]?.r1)||0;
      const kg=sessionKg?.[sesId]?.[exId]||exes.find(e=>e.id===exId)?.kg||0;
      return exigeKg?(r1>0&&kg>0):(r1>0);
    });
    if(!hasAnyExData)errors.push(exigeKg?'Entrenamiento: registrá kg y reps de al menos un ejercicio':'Entrenamiento: registrá las reps de al menos un ejercicio');
    return errors;
  }
  function doSave(completeWeek){
    if(completeWeek){
      const errs=validateSave();
      if(errs.length>0){setSaveErrors(errs);return;}
    }
    setSaveErrors([]);
    setSaving(true);
    try{
      const curSR=sessionRepsRef.current;
      // La PROGRESIÓN ya NO se aplica al guardar. Solo al avanzar de semana (newWeek).
      // skUsed = sk = kg realmente usado esta semana. El kg en pantalla es siempre el que usaste.
      const skUsed=JSON.parse(JSON.stringify(sessionKg));
      const usedSK=JSON.parse(JSON.stringify(sessionKg));
      const normSK={};
      Object.entries(sessionKg).forEach(([sess,exMap])=>{normSK[sess]={};Object.entries(exMap||{}).forEach(([exId,kg])=>{normSK[sess][parseInt(exId)]=kg;});});
      localStorage.setItem(`ase_${user}_sessKg`,JSON.stringify(normSK));
      // Snapshot de rutina de ESTA semana (para que al verla en el futuro muestre su rutina, no la actual).
      // Se guarda con IDs del sheet (ya estables). Incluye bloque/series para reflejar la semana tal cual era.
      const rutinaSnap={num:cfg.num,assign:cfg.assign,bloque:cfg.bloque,series:cfg.series,bloqueInicio:cfg.bloqueInicio};
      const d={wi:wk.id,wl:wk.label,n:nut,h:hab,sr:curSR,skUsed,sk:usedSK,e:exes,rutina:rutinaSnap,pp,pc,pC,pS,actExtra:actExtraC,toxics:toxC,sens:hab.sens||{},aguaDias,aguaPromedio,hiit:hiitData};
      localStorage.setItem(SK(wk.id,user),JSON.stringify(d));
      const list=JSON.parse(localStorage.getItem(HK(user))||'[]');
      if(!list.includes(wk.id)){list.push(wk.id);localStorage.setItem(HK(user),JSON.stringify(list));}
      setSaved(completeWeek?true:'progreso');loadH();
      const e1rmSnap={};
      try{
        const savedD=JSON.parse(localStorage.getItem(SK(wk.id,user))||'{}');
        const sr=savedD.sr||{};const sk=savedD.sk||{};const exArr=savedD.e||exes;
        Object.entries(sr).forEach(([sessId,sessData])=>{
          Object.entries(sessData).forEach(([exId,reps])=>{
            const ex=exArr.find(e=>String(e.id)===String(exId)||e.id===parseInt(exId));if(!ex)return;
            const curKg=(sk[sessId]?.[exId])||(sk[sessId]?.[parseInt(exId)])||ex.kg;
            const r1=parseInt(reps.r1)||0;
            if(r1>0)e1rmSnap[ex.n+'_'+sessId]=calcE1RM(curKg,r1);
          });
        });
      }catch(err){}
      // Solo enviar al sheet al guardar semana completa (no en Guardar progreso)
      if(completeWeek){
        // Consolidar datos de HIIT de todas las sesiones (A, B...) en un resumen por campo.
        var hiitRegs=(hiitData&&hiitData.regs)||{};
        var hiitSessIds=Object.keys(hiitRegs);
        var joinHiit=function(field){
          return hiitSessIds.map(function(sid){var v=hiitRegs[sid]&&hiitRegs[sid][field];return v?(sid+': '+v):'';}).filter(Boolean).join(' · ');
        };
        // FASE 3E: armar el detalle de "comí algo diferente" (qué comió) por día/comida
        var comidasDif=[];
        var MDIAS=['Lun','Mar','Mie','Jue','Vie','Sab'];
        nut.slice(0,6).forEach(function(d,di){
          ['desayuno','almuerzo','merienda','cena'].forEach(function(m){
            if((d.m||{})[m]==='no'){
              var txt=(d.m||{})[m+'_txt']||'';
              comidasDif.push(MDIAS[di]+' '+m+(txt?(': '+txt):''));
            }
          });
        });
        fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          user,asesoradoId:(localStorage.getItem('ase_'+user+'_aseid')||''),wl:wk.label,wi:wk.id,pp,pc,pC,pS,sC,
          neat:actExtraC,toxics:toxC,
          // FASE 3E: compliance de comidas
          compliancecomidas:(meal3E.compliance!==null?meal3E.compliance:''),
          comidasok:meal3E.ok, comidaspar:meal3E.par, comidasno:meal3E.no, comidasregistradas:meal3E.registradas,
          comidasdiferente:comidasDif.join(' | '),
          sens:hab.sens||{},
          dolor:(hab.sens||{}).dolor||'',
          dolorZona:(hab.sens||{}).dolorZona||'',
          dolorIntensidad:(hab.sens||{}).dolorIntensidad||'',
          contextoVida:(hab.sens||{}).contextoVida||'',
          e1rm:e1rmSnap,
          hiitCumplio:joinHiit('cumple'),
          hiitExigencia:joinHiit('exig'),
          hiitFatiga:joinHiit('fatiga'),
          hiitDolorMuscular:joinHiit('dolor'),
          hiitNota:joinHiit('nota')
        })}).catch(()=>{});
      }
    }catch(e){}
    setSaving(false);
  }
  const [cumplWarning,setCumplWarning]=useState(false);
  // Semana real según calendario
  const realWkNum=user?getRealWkNum(user):1;
  const maxWkNum=user?(parseInt(localStorage.getItem(`ase_${user}_maxWkNum`))||realWkNum):realWkNum;
  const isViewingPast=wk.num<realWkNum;
  const isViewingFuture=wk.num>realWkNum;
  const wkSat=user?getWkSat(user,wk.num):new Date();
  const now=new Date();
  const wkFinished=now>wkSat||now.getDay()===0;
  const canSaveWeek=wk.num===realWkNum&&wkFinished;
  // Estado REAL de "reporte enviado": se deriva del flag de la semana MOSTRADA en cada render.
  // (Antes se usaba `saved`, que se cacheaba al arranque y podía revivir del backup → botón fantasma.)
  const reporteYaEnviado=user?!!localStorage.getItem(`ase_${user}_reporteSent_${wk.id}`):false;
  const weekLocked=isViewingPast||isViewingFuture;

  function save(){
    if(!canSaveWeek&&!isViewingPast){
      const fmtSat=wkSat.toLocaleDateString('es-AR',{day:'numeric',month:'short'});
      setSaveErrors([`Todavía no terminó la semana. Guardar semana estará disponible el sáb ${fmtSat}.`]);
      return;
    }
    // Validaciones solo para sem actual, no para sem pasadas
    if(!isViewingPast){
      const errs=validateSave();
      if(errs.length>0){setSaveErrors(errs);return;}
    }
    setSaveErrors([]);
    // Verificar si ya se mandó reporte esta sem
    const sentKey=`ase_${user}_reporteSent_${wk.id}`;
    if(localStorage.getItem(sentKey)){
      if(!confirm('Ya enviaste el reporte de esta semana.\n\n¿Querés sobreescribirlo con los datos actuales?\n\nEn el sheet quedará solo un reporte por semana.'))return;
    }
    const anyMeal=nut.some(d=>Object.values(d.m||{}).some(Boolean));
    const anyAguaOk=nut.some(d=>d.ak);
    const anySueno=(hab.sleep||[]).some(Boolean);
    const anyNeat=(hab.actExtra||[]).some(Boolean);
    if(!anyMeal&&!anyAguaOk&&!anySueno&&!anyNeat&&!isViewingPast){setCumplWarning(true);}
    else{setCumplWarning(false);}
    doSave(true);
    localStorage.setItem(sentKey,'1');

  function saveProgress(){
    if(weekLocked)return;
    setCumplWarning(false);setSaveErrors([]);doSave(false);
    // Backup silencioso al sheet
    try{
      var draftBk={sr:sessionReps,n:nut,h:hab,hiit:hiitData};

    setSessionReps({});setNut(iN());setHab(iH());setHiitData(iHiit());setSaved(false);

  function newWeek(){
    const curNum=wk.num||1;
    if(curNum>=realWkNum&&!wkFinished)return;
    if(!saved&&!isViewingPast)save();
    const nextNum=curNum+1;
    if(nextNum>maxWkNum)return;
    // ── PROGRESIÓN DE CARGA: se aplica SOLO acá, al pasar a la semana nueva ──
    const bloqueActual=(cfg?.bloque||'volumen').toLowerCase();
    const hasProg=bloqueActual==='volumen'||bloqueActual==='intensidad'||bloqueActual==='fuerza';
    if(hasProg){
      const newSK=JSON.parse(JSON.stringify(sessionKg));
      Object.entries(sessionReps).forEach(([sessId,sessData])=>{
        Object.entries(sessData||{}).forEach(([exId,reps])=>{
          const exIdInt=parseInt(exId);
          const ex=exes.find(e=>e.id===exIdInt);if(!ex)return;
          const curKg=(sessionKg[sessId]?.[exIdInt])||(sessionKg[sessId]?.[exId])||null;
          if(!curKg||curKg<=0)return;
          if(bloqueActual==='fuerza'){
            const lastUp=parseInt(localStorage.getItem(`ase_${user}_lastKgUp_${sessId}_${exIdInt}`))||0;
            if(curNum<lastUp+2)return;
            if(!newSK[sessId])newSK[sessId]={};
            newSK[sessId][exIdInt]=rKg(curKg*1.05);
            localStorage.setItem(`ase_${user}_lastKgUp_${sessId}_${exIdInt}`,String(curNum));
          }else{
            const r1=parseInt(reps.r1)||0;
            if(r1<ex.hi)return;
            if(!newSK[sessId])newSK[sessId]={};
            newSK[sessId][exIdInt]=rKg(curKg*1.05);
          }
        });
      });
      const normSK={};

          h('div',{style:{fontSize:'10px',color:'#92400E',lineHeight:'1.4'}},'⚠️ No registraste cumplimiento esta semana. Si te olvidaste, completá antes de guardar. Si no pudiste cumplir nada, anotalo en Notas.')
        ),
        h('button',{onClick:saveProgress,disabled:saving||weekLocked,style:{width:'100%',borderRadius:'8px',padding:'7px 10px',fontSize:'11px',fontWeight:'600',cursor:saving||weekLocked?'default':'pointer',border:'1.5px solid rgba(255,255,255,0.15)',background:saved==='progreso'?'rgba(55,138,221,0.15)':weekLocked?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.08)',color:saved==='progreso'?B:weekLocked?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},saving?'...':(saved==='progreso'?'✓ Progreso guardado':weekLocked?'🔒 Solo lectura':'💾 Guardar progreso')),
        !weekLocked&&saved!==true&&h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',lineHeight:'1.4',paddingTop:'4px',borderTop:'1px solid rgba(255,255,255,0.06)',marginTop:'2px'}},
          '💾 Anotá tus datos y usá Guardar progreso para no perderlos'
        ),
        h('div',{style:{display:'flex',gap:'4px',width:'100%',marginTop:'2px'}},
          h('button',{onClick:prevWeek,disabled:(wk.num||1)<=1,style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',cursor:(wk.num||1)<=1?'default':'pointer',border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',color:(wk.num||1)<=1?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)'}},'← Anterior'),
          isViewingPast
            ?h('button',{onClick:()=>{
                dataLoaded.current=false;
                draftReady.current=false;
                localStorage.setItem(`ase_${user}_wknum`,String(realWkNum));
                setWk(getWkForNum(user,realWkNum));
                load(`sem_${realWkNum}`);
              },style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'700',cursor:'pointer',border:`1px solid ${AC}`,background:AC+'22',color:AC}},'Sem actual →')
            :h('button',{onClick:newWeek,
                // Nueva → disponible desde Dom si ya guardó, sino desde el próximo Dom
                disabled:!(saved===true&&wkFinished),
                style:{flex:1,borderRadius:'8px',padding:'6px 4px',fontSize:'10px',fontWeight:'600',
                  cursor:saved===true&&wkFinished?'pointer':'default',
                  border:'1px solid rgba(255,255,255,0.12)',background:'rgba(255,255,255,0.06)',
                  color:saved===true&&wkFinished?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.2)'}},'Nueva →'),
          h('button',{onClick:resetWeek,disabled:weekLocked,title:'Resetear semana',style:{borderRadius:'8px',padding:'6px 8px',fontSize:'10px',fontWeight:'600',cursor:weekLocked?'default':'pointer',border:'1px solid rgba(239,68,68,0.3)',background:weekLocked?'transparent':'rgba(239,68,68,0.1)',color:weekLocked?'rgba(239,68,68,0.3)':'#EF4444'}},'↺')
        )
      )
    ),
    h('div',{style:{padding:'14px',paddingBottom:'80px'}},
      isViewingPast&&h('div',{style:{background:'#0A0A0A',borderRadius:'12px',padding:'12px 14px',marginBottom:'10px',display:'flex',gap:'10px',alignItems:'center'}},
        h('span',{style:{fontSize:'18px'}},'🔒'),
        h('div',null,
          h('div',{style:{fontSize:'12px',fontWeight:'800',color:'#fff',marginBottom:'2px'}},'Semana pasada — solo lectura'),
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.5)'}},'Avanzá a la semana actual para cargar datos')
        )
      ),
      tab==='d'&&h(Dashboard,null),
      tab==='t'&&h(Training,{key:'training',exes,setExes,setSaved,user,cfg,setCfg,sessionReps,setSessionReps,sessionKg,setSessionKg,hist,wk,loadingExes,isViewingPast,realWkNum}),
      tab==='die'&&h(Diet,{key:'diet',hab,user,menusVer,metaAgua,metaSal,nivel}),
      tab==='ms'&&h(MiSemana,{key:'misemana',nut,setNut,hab,setHab,setSaved,pp,pc,cfg,onEnviarReporte:save,saving,canSaveWeek,isViewingPast,reporteYaEnviado,wkSat,onVerMenus:()=>setTab('die')}),
      tab==='hiit'&&h(Hiit,{key:'hiit',cfg,hiitData,setHiitData,setSaved})
    ),
    h('div',{style:{background:'#0A0A0A',borderTop:'1px solid rgba(255,255,255,0.06)',display:'flex',position:'sticky',bottom:0,zIndex:10}},
      TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:tab===t.id?`2px solid ${AC}`:'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',color:tab===t.id?AC:'rgba(255,255,255,0.35)',fontWeight:tab===t.id?'800':'400',transition:'color 0.2s'}},h('span',{style:{fontSize:'18px'}},t.ic),t.l))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
