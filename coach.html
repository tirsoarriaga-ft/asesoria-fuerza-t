// ── CHARTS ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=110,labels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:8,b:22,l:32,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-5,textAnchor:'middle',fontSize:'8',fill:'#aaa'},l):null),
    h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'8',fill:'#bbb'},mn.toFixed(1)),
    h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'8',fill:'#bbb'},mx.toFixed(1))
  );
}
function DualBarChart({data}){
  if(!data||data.length<1)return null;
  const W=300,H=90,pad={t:6,b:20,l:16,r:6};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const bW=Math.min(10,iW/data.length/2-2);
  const gap=iW/data.length;
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('line',{x1:pad.l,y1:pad.t+iH,x2:W-pad.r,y2:pad.t+iH,stroke:'rgba(0,0,0,0.06)',strokeWidth:'1'}),
    data.map((d,i)=>{
      const cx=pad.l+i*gap+gap/2;
      const sH=(d.sleep/7)*iH,tH=(d.toxics/7)*iH;
      return h('g',{key:i},
        h('rect',{x:cx-bW-1,y:pad.t+iH-sH,width:bW,height:Math.max(sH,1),fill:G,rx:'2'}),
        h('rect',{x:cx+1,y:pad.t+iH-tH,width:bW,height:Math.max(tH,1),fill:R,rx:'2'}),
        h('text',{x:cx,y:H-4,textAnchor:'middle',fontSize:'7',fill:'#aaa'},d.label)
      );
    })
  );
}

// ── ALERTAS (framework del coach) ─────────────────────────────────────
function getAlerts(weeks,objetivo){
  const A=[];
  if(!weeks.length)return A;
  const lat=weeks[weeks.length-1];
  const obj=String(objetivo||'mantenimiento').toLowerCase().trim()||'mantenimiento';
  const compPct=parsePct(lat['%Comidas']);
  const estres=String(lat.Estres||lat.Estrés||'');
  const energia=String(lat.Energia||lat.Energía||'');
  const tox=parseInt(lat.Toxicos||lat.Tóxicos||0)||0;

  // Compliance
  if(compPct<60)A.push({lvl:'red',txt:'Adherencia baja — ajustar plan no tiene sentido todavía'});
  else if(compPct<80)A.push({lvl:'yellow',txt:'Adherencia media — revisar barreras antes de cambiar variables'});

  // Sensaciones
  if(estres==='Estrés alto'&&energia==='Baja toda la semana')
    A.push({lvl:'red',txt:'Sensaciones alteradas — semana de descarga, no agregar estímulo'});
  else{
    if(estres==='Estrés alto')A.push({lvl:'yellow',txt:'Estrés alto — monitorear recuperación'});
    if(energia==='Baja toda la semana')A.push({lvl:'yellow',txt:'Energía baja — revisar sueño y adherencia nutricional'});
  }

  // Tóxicos
  if(tox>=4)A.push({lvl:'yellow',txt:'Semana con muchos permitidos — considerar en el análisis'});

  // Dolor articular
  const dolor=String(lat.Dolor||'');
  const dolorInt=String(lat.DolorIntensidad||'');
  if(dolor==='si'&&dolorInt==='Dolor en reposo')A.push({lvl:'red',txt:' Dolor en reposo — revisar antes de cualquier ajuste de carga'});
  else if(dolor==='si'&&dolorInt==='Limita el movimiento')A.push({lvl:'yellow',txt:' Dolor que limita el movimiento — monitorear'});
  else if(dolor==='si')A.push({lvl:'info',txt:' Molestia articular leve — '+(lat.DolorZona||'zona no especificada')});

  // Contexto de vida
  const ctx=String(lat.ContextoVida||'');
  if(ctx==='muy_exigente'&&compPct<60)A.push({lvl:'yellow',txt:'Semana muy difícil + compliance bajo — revisar barreras antes de ajustar'});
  else if(ctx==='muy_exigente')A.push({lvl:'info',txt:'Semana muy difícil — considerar en el análisis'});

  // Tendencias peso y cintura — últimas 2 semanas con datos
  if(weeks.length>=2){
    const objetivo=obj;
    const ps=weeks.slice(-3).map(w=>parseFloat(w.Peso)).filter(v=>!isNaN(v)&&v>0);
    const cs=weeks.slice(-3).map(w=>parseFloat(w.Cintura)).filter(v=>!isNaN(v)&&v>0);
    if(ps.length>=2&&cs.length>=2){
      const diffP=parseFloat((ps[ps.length-1]-ps[0]).toFixed(1));
      const diffC=parseFloat((cs[cs.length-1]-cs[0]).toFixed(1));
      const pesoSubio=diffP>=0.5;
      const pesoBajoRapido=diffP<=-0.5;
      const pesoBajoLento=diffP>-0.5&&diffP<0;
      const pesoEstable=Math.abs(diffP)<0.5;
      const cinturaSubio=diffC>=0.5;
      const cinturaBajoRapido=diffC<=-0.5;
      const cinturaEstable=Math.abs(diffC)<0.5;
      const sfx=' ('+( diffP>0?'+':'')+diffP+'kg / '+(diffC>0?'+':'')+diffC+'cm)';

      if(objetivo==='deficit'){
        if((pesoBajoRapido||pesoBajoLento)&&(cinturaBajoRapido||!cinturaSubio))
          A.push({lvl:'info',txt:'Tendencia esperada — peso y cintura en descenso'+sfx});
        else if(pesoEstable&&cinturaBajoRapido)
          A.push({lvl:'info',txt:'Cintura en descenso, peso estable — posible recomposición'+sfx});
        else if(pesoEstable&&cinturaEstable)
          A.push({lvl:'yellow',txt:'Estancamiento — revisá adherencia y variables'+sfx});
        else if(pesoSubio||cinturaSubio)
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — revisá el plan'+sfx});
        else
          A.push({lvl:'yellow',txt:'Progreso lento — revisá adherencia'+sfx});
      }else if(objetivo==='superavit'){
        if(pesoSubio&&!cinturaSubio)
          A.push({lvl:'info',txt:'Tendencia esperada — peso en suba, cintura controlada'+sfx});
        else if(pesoSubio&&cinturaSubio)
          A.push({lvl:'yellow',txt:'Peso sube pero también cintura — monitorear'+sfx});
        else if(pesoEstable||pesoBajoLento)
          A.push({lvl:'yellow',txt:'Peso sin cambios significativos — revisá el plan'+sfx});
        else if(pesoBajoRapido)
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — peso en baja'+sfx});
        if(cinturaSubio&&diffC>=0.5)
          A.push({lvl:'red',txt:'Cintura en aumento — revisá calidad del superávit'+sfx});
      }else{
        // mantenimiento
        if(pesoEstable&&cinturaEstable)
          A.push({lvl:'info',txt:'Variables estables — mantenimiento en curso'+sfx});
        else if((pesoSubio&&diffP>=0.5)||(cinturaSubio&&diffC>=0.5))
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — revisá el plan'+sfx});
        else
          A.push({lvl:'yellow',txt:'Leve variación — monitorear próximas semanas'+sfx});
      }
    }
  }
  return A;
}
function getStatus(weeks,objetivo){
  const A=getAlerts(weeks,objetivo);
  if(A.some(a=>a.lvl==='red'))return'red';
  if(A.some(a=>a.lvl==='yellow'))return'yellow';
  if(weeks.length>0)return'green';
  return'grey';
}

// ── PIN SCREEN ────────────────────────────────────────────────────────
function PinScreen({onUnlock}){
  const [pin,setPin]=useState('');
  const [shake,setShake]=useState(false);
  const tryPin=p=>{
    if(p===COACH_PIN){onUnlock();}
    else{setShake(true);setPin('');setTimeout(()=>setShake(false),600);}
  };
  const press=d=>{
    const next=pin+d;
    if(next.length<=6)setPin(next);
    if(next.length>=4)tryPin(next);
  };
  const KEYS=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return h('div',{style:{maxWidth:'380px',margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',background:'#fff'}},
    h('div',{style:{fontSize:'36px',marginBottom:'12px'}},''),

    h('div',{style:{fontSize:'13px',color:'#999',marginBottom:'32px'}},'Ingresá tu PIN'),
    h('div',{style:{display:'flex',gap:'12px',marginBottom:'24px',transform:shake?'translateX(-8px)':'none',transition:'transform 0.1s'}},
      [0,1,2,3].map(i=>h('div',{key:i,style:{width:'14px',height:'14px',borderRadius:'50%',background:i<pin.length?'#111':'#E0E0E0',transition:'background 0.15s'}}))

      KEYS.map((k,i)=>k===''?h('div',{key:i}):h('button',{key:i,onClick:()=>k==='⌫'?setPin(p=>p.slice(0,-1)):press(k),

}

// ── CLIENT LIST ───────────────────────────────────────────────────────
function ClientList({data,rutinas,decisiones,videosPend,onSelect,onRefresh}){
  const statusOrder={red:0,yellow:1,green:2,grey:3};
  const [soloSinRevisar,setSoloSinRevisar]=useState(false);
  // ── Alta de nuevo asesorado (Fase 2) ──
  const [showAlta,setShowAlta]=useState(false);
  const [altaForm,setAltaForm]=useState({asesorado:'',plan:'online',fechaInicio:'',sexo:'',edad:'',altura:'',pesoRef:'',objetivo:''});
  const [altaSaving,setAltaSaving]=useState(false);
  const [altaMsg,setAltaMsg]=useState('');
  // Sugerir el lunes de la semana actual como FechaInicio por defecto
  const lunesDeEstaSemana=()=>{const d=new Date();const day=d.getDay();const diff=(day===0?-6:1-day);d.setDate(d.getDate()+diff);return d.toISOString().split('T')[0];};
  const abrirAlta=()=>{setAltaForm({asesorado:'',plan:'online',fechaInicio:lunesDeEstaSemana(),sexo:'',edad:'',altura:'',pesoRef:'',objetivo:''});setAltaMsg('');setShowAlta(true);};
  const guardarAlta=()=>{
    if(!altaForm.asesorado.trim()){setAltaMsg('El nombre es obligatorio.');return;}
    if(!altaForm.plan){setAltaMsg('Elegí un plan.');return;}
    if(!altaForm.fechaInicio){setAltaMsg('Poné la fecha de inicio (lunes).');return;}
    setAltaSaving(true);setAltaMsg('');
    const payload={action:'nuevoAsesorado',asesorado:altaForm.asesorado.trim(),plan:altaForm.plan,estado:'Activo',fechaInicio:altaForm.fechaInicio,sexo:altaForm.sexo,edad:altaForm.edad,altura:altaForm.altura,pesoRef:altaForm.pesoRef,objetivo:altaForm.objetivo};
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .finally(()=>{
        // no-cors no devuelve respuesta legible; asumimos OK y refrescamos tras un momento
        setTimeout(()=>{setAltaSaving(false);setShowAlta(false);if(onRefresh)onRefresh();},1200);
      });
  };
  const getObj=name=>{const r=rutinas.find(rt=>String(rt.Asesorado||'').trim().toLowerCase()===name.toLowerCase());return String(r?.Objetivo||'mantenimiento').toLowerCase().trim()||'mantenimiento';};

  // Calcular los 2 SemanIDs más recientes de todos los reportes
  var semsRecientes=useMemo(function(){
    var allSems={};
    Object.values(data).forEach(function(weeks){
      if(weeks&&weeks.length){
        var lat=weeks[weeks.length-1];
        if(lat&&lat.SemanID)allSems[lat.SemanID]=1;
      }
    });
    var unique=Object.keys(allSems).sort(function(a,b){
      var na=parseInt(String(a).replace('sem_','')||0);
      var nb=parseInt(String(b).replace('sem_','')||0);
      return nb-na;
    });
    return unique.slice(0,2);
  },[data]);

  function hasCPCheck(name,semId){
    var key='coach_cp_'+name.trim().toLowerCase()+'_'+semId;
    try{if(localStorage.getItem(key))return true;}catch(e){}
    // fallback: check decisiones del sheet
    if(!decisiones||!semId)return false;
    return decisiones.some(function(d){
      return String(d.Asesorado||'').trim().toLowerCase()===name.toLowerCase()&&
             (String(d.SemanID||'')).trim()===semId;
    });
  }
  const semNum=(s)=>parseInt(String(s||'').replace('sem_',''))||0;
  // Lista de TODOS los asesorados: los de la maestra (rutinas enriquecidas) + los que tienen reportes.
  // Así aparecen también los nuevos o los que aún no reportaron.
  const nombresSet={};
  (rutinas||[]).forEach(r=>{const n=String(r.Asesorado||'').trim();if(n&&String(r.Estado||'').toLowerCase()!=='baja')nombresSet[n]=1;});
  Object.keys(data).forEach(n=>{if(n&&n.trim())nombresSet[n.trim()]=1;});
  const semNumV=s=>parseInt(String(s||'').replace('sem_',''))||0;
  const clients=Object.keys(nombresSet).sort((a,b)=>{
    // Si el filtro "Sin revisar" está activo, prioriza pendientes; si no, orden alfabético.
    if(soloSinRevisar){
      const wa=data[a]||[],wb=data[b]||[];
      const semA=String((wa[wa.length-1]||{}).SemanID||'sem_0');
      const semB=String((wb[wb.length-1]||{}).SemanID||'sem_0');
      const hasCPA=hasCPCheck(a,semA),hasCPB=hasCPCheck(b,semB);
      if(hasCPA!==hasCPB)return hasCPA?1:-1;
      return semNumV(semA)-semNumV(semB);
    }
    return a.toLowerCase().localeCompare(b.toLowerCase());
  }).filter(name=>{
    if(!soloSinRevisar)return true;
    const weeks=data[name];
    if(!weeks||!weeks.length)return false; // sin reportes no puede estar "sin revisar"
    const lat=weeks[weeks.length-1];
    const semId=lat?.SemanID||'';
    if(!semsRecientes.includes(semId))return false;
    return !hasCPCheck(name,semId);
  });
  const statusBg={red:'#FEF2F2',yellow:'#FFFBEB',green:'#F0FDF4',grey:'#F9F9F9'};
  const counts={red:0,yellow:0,green:0};
  clients.forEach(c=>{const s=getStatus(data[c]||[],getObj(c));if(counts[s]!==undefined)counts[s]++;});

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh'}},
    h('div',{style:{background:'#fff',borderBottom:'1px solid rgba(0,0,0,0.09)',padding:'16px 18px',position:'sticky',top:0,zIndex:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'600',letterSpacing:'0.08em',textTransform:'uppercase'}},'Panel del Coach'),
          h('div',{style:{fontSize:'18px',fontWeight:'800'}},clients.length+' asesorados')
        ),
        h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},
          h('button',{onClick:abrirAlta,style:{background:G,color:'#fff',border:'none',borderRadius:'8px',padding:'8px 12px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'+ Nuevo'),
          h('button',{onClick:()=>setSoloSinRevisar(s=>!s),style:{background:soloSinRevisar?O:'#F0F0F0',color:soloSinRevisar?'#fff':'#666',border:'none',borderRadius:'8px',padding:'6px 12px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}},soloSinRevisar?'Sin revisar ✓':'Sin revisar'),
          h('button',{onClick:onRefresh,style:{background:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 14px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'↻')
        )
      ),
      h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},
        [{c:'red',l:'Atención',color:R},{c:'yellow',l:'Revisar',color:O},{c:'green',l:'OK',color:G}].map(s=>
          h('div',{key:s.c,style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'#666'}},
            h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:s.color}}),
            counts[s.c]+' '+s.l
          )
        )
      )
    ),
    h('div',{style:{padding:'12px'}},
      clients.length===0&&h('div',{style:{textAlign:'center',padding:'60px 20px',color:'#999'}},
        h('div',{style:{fontSize:'40px',marginBottom:'12px'}},''),
        h('div',{style:{fontSize:'14px',fontWeight:'600'}},'No hay datos todavía'),
        h('div',{style:{fontSize:'12px',marginTop:'4px'}},'Los asesorados deben guardar al menos una semana')
      ),
      clients.map(name=>{
        const weeks=data[name]||[];const lat=weeks[weeks.length-1];
        const obj=getObj(name);
        const status=getStatus(weeks,obj);const alerts=getAlerts(weeks,obj);
        const rutina=rutinas.find(r=>String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase());

// ── CALCULADORA DE DIAGNÓSTICO ─────────────────────────────────────────
function calcDiagnostico(rutina, weeks){
  var peso=parseFloat(rutina&&rutina.PesoRef||0);
  var altura=parseFloat(rutina&&rutina.Altura||0);
  var edad=parseFloat(rutina&&rutina.Edad||0);
  var sexo=String(rutina&&rutina.Sexo||'M').toUpperCase();
  var template=parseFloat(rutina&&rutina.Template||2000);
  var objetivo=String(rutina&&rutina.Objetivo||'mantenimiento').toLowerCase();

  // Cintura del último reporte
  var cintura=0;
  for(var i=weeks.length-1;i>=0;i--){
    var c=parseFloat(weeks[i].Cintura||0);
    if(c>0){cintura=c;break;}
  }

  if(!peso||!altura||!edad){return null;}

  // IMC y %grasa (Deurenberg)
  var imc=peso/(altura/100*altura/100);
  var sexNum=sexo==='M'?1:0;
  var pctGrasa=(1.2*imc)+(0.23*edad)-(10.8*sexNum)-5.4;
  pctGrasa=Math.max(3,Math.min(50,pctGrasa));

  // Composicion
  var masaGrasa=peso*(pctGrasa/100);
  var masaMagra=peso-masaGrasa;

  // Criterio cintura/altura
  var cinturaCrit=cintura>0?(cintura/(altura)):null;
  var superaCriterio=cinturaCrit!==null&&cinturaCrit>0.5;
  var cinturObj=altura*0.47;

  // Macros objetivo
  var protDia=Math.round(peso*1.9);
  var grasaDiaMin=Math.max(Math.round(peso*0.5),Math.round(template*0.25/9));
  var hidrDia=Math.round((template-(protDia*4)-(grasaDiaMin*9))/4);

  var resultado={
    peso,altura,edad,sexo,cintura,imc:imc.toFixed(1),
    pctGrasa:pctGrasa.toFixed(1),
    masaGrasa:masaGrasa.toFixed(1),
    masaMagra:masaMagra.toFixed(1),
    cinturaCrit:cinturaCrit?(cinturaCrit).toFixed(3):null,
    superaCriterio,
    cinturObj:cinturObj.toFixed(1),
    protDia,grasaDiaMin,hidrDia,template,objetivo,
    kgGrasaPerder:null,pesoObj:null,semanasEst:null,deficitDia:null,
  };

  // Si supera criterio → calcular cuanto bajar
  if(superaCriterio&&cintura>0){
    var cmABajar=cintura-cinturObj;
    // ~1.5kg grasa por cm de cintura (rango 1-2, usamos conservador)
    var kgGrasaPerder=cmABajar*1.5;
    // %grasa objetivo según sexo
    var pctGrasaObj=sexo==='M'?14:24;
    var pesoObj=masaMagra/(1-pctGrasaObj/100);
    // Ritmo: 0.5% peso corporal/semana
    var ritmo=peso*0.005;
    var semanasEst=Math.round(kgGrasaPerder/ritmo);
    var deficitDia=Math.round(ritmo*7200/7);
    resultado.kgGrasaPerder=kgGrasaPerder.toFixed(1);
    resultado.pesoObj=pesoObj.toFixed(1);
    resultado.semanasEst=semanasEst;
    resultado.deficitDia=deficitDia;
    resultado.ritmo=ritmo.toFixed(2);
  }

  return resultado;
}

// ── PORCIONES: requerimiento → gramos → porción por comida (portable) ──
// Factores por defecto acordados. P y G salen del peso; CHO es la energía restante.
function calcularRequerimientos(pesoKg, templateKcal, factorP, factorG){
  var P=pesoKg*factorP, G=pesoKg*factorG;
  var kcalPyG=P*4+G*9;
  var CHO=(templateKcal-kcalPyG)/4;
  return {P:P,G:G,CHO:Math.max(0,CHO),insuficiente:CHO<0,faltanKcal:kcalPyG-templateKcal};
}
// 4 comidas => 25/40/15/20 (calibrado). Otro nº => uniforme.
function repartoComidas(n){
  if(n===4)return [0.25,0.40,0.15,0.20];
  var w=[];for(var i=0;i<n;i++)w.push(1/n);return w;
}
// Cada comida tiene su propio "1P" calibrado, por eso el asesorado nunca ve decimales.
function porcionesPorComida(req,n){
  return repartoComidas(n).map(function(w){
    return {p:Math.round(req.P*w),h:Math.round(req.CHO*w),g:Math.round(req.G*w),fv:1};
  });
}

function PorcionesBloque(rutina){
  var FACTOR_P=2.0, FACTOR_G=0.8, N_COMIDAS=4; // ajustables; sin columna de comidas aún → 4 por defecto
  var nombres=['Desayuno','Almuerzo','Merienda','Cena'];
  var peso=parseFloat(rutina&&rutina.PesoRef||0);
  var template=parseFloat(rutina&&rutina.Template||0);
  if(!peso||!template)return null;
  var req=calcularRequerimientos(peso,template,FACTOR_P,FACTOR_G);
  var porc=porcionesPorComida(req,N_COMIDAS);
  return h('div',{style:card},
    h('div',{style:{...lbl,marginBottom:'10px'}},'Pauta de porciones · '+FACTOR_P+' g/kg prote · '+FACTOR_G+' g/kg grasa'),
    req.insuficiente
      ? h('div',{style:{background:'#FCEBEB',border:'1px solid #F09595',borderRadius:'8px',padding:'10px',fontSize:'11px',color:'#791F1F',lineHeight:'1.5'}},
          'Template demasiado bajo: no cubre proteína + grasa mínimas (faltan ~'+Math.round(req.faltanKcal)+' kcal). Subí el Template antes de pautar.')
      : h('div',null,
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginBottom:'10px'}},
            [{l:'Proteína',v:Math.round(req.P)+' g'},{l:'Grasa',v:Math.round(req.G)+' g'},{l:'Hidratos',v:Math.round(req.CHO)+' g'}].map(function(m,i){
              return h('div',{key:i,style:{background:'#F8F8F8',borderRadius:'8px',padding:'8px',textAlign:'center'}},
                h('div',{style:{fontSize:'15px',fontWeight:'800',color:'#111'}},m.v),
                h('div',{style:{fontSize:'10px',color:'#999',marginTop:'2px'}},m.l)
              );
            })
          ),
          h('div',{style:{background:'#F8F8F8',borderRadius:'8px',padding:'8px'}},
            h('div',{style:{display:'grid',gridTemplateColumns:'1.4fr 1fr 1fr 1fr',gap:'4px',fontSize:'9px',color:'#999',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:'6px',paddingBottom:'4px',borderBottom:'1px solid rgba(0,0,0,0.08)'}},
              h('div',null,'Comida'),h('div',{style:{textAlign:'center'}},'1P'),h('div',{style:{textAlign:'center'}},'1H'),h('div',{style:{textAlign:'center'}},'1G')
            ),
            porc.map(function(pc,i){
              return h('div',{key:i,style:{display:'grid',gridTemplateColumns:'1.4fr 1fr 1fr 1fr',gap:'4px',padding:'5px 0',fontSize:'12px',borderBottom:i<porc.length-1?'1px solid rgba(0,0,0,0.05)':'none',alignItems:'center'}},
                h('div',{style:{fontWeight:'600',color:'#111'}},nombres[i]),
                h('div',{style:{textAlign:'center',color:'#111'}},pc.p+'g'),
                h('div',{style:{textAlign:'center',color:'#111'}},pc.h+'g'),
                h('div',{style:{textAlign:'center',color:'#111'}},pc.g+'g')
              );
            })
          ),
          h('div',{style:{fontSize:'10px',color:'#999',marginTop:'8px',lineHeight:'1.5'}},
            'Reparto 25/40/15/20 · el asesorado ve 1P/1H/1G/1FV por comida, vos ves el gramaje. Sumá 1FV por comida.')
        )
  );
}

  // Generar mensaje para el asesorado + nota interna según respuestas
  function calcSugerencia(resps){
    var q1=resps.q1||'';
    var q2=resps.q2||'';
    var q3=resps.q3||'';
    var q4=resps.q4||'';
    var objetivo=String(rutina&&rutina.Objetivo||'mantenimiento').toLowerCase();
    var nivelAse=String(rutina&&rutina.Nivel||'online').toLowerCase();

    var notaInterna='';
    var mjeAsesorado='';

    // P1: No reportó — fin del árbol
    if(q1==='no'){
      notaInterna='Sin reporte esta semana. No hay datos para trabajar. Pendiente: reporte del asesorado.';
      mjeAsesorado='Hola! Esta semana no me llego tu reporte y sin esos datos no puedo revisar ni ajustar tu plan.\n\nEl reporte es tu parte: es lo que me permite hacer la mia. Sin eso no puedo saber si el plan esta funcionando, si hay que ajustar algo, ni orientarte para la semana que viene.\n\nEstas a tiempo: pesate, medi tu cintura y complete el registro en la app. Cuanto antes lo mandes, antes puedo trabajar con eso.\n\nPauta de esta semana: registra cada entreno + sube 1 foto o video de un ejercicio.';
      return {mje:mjeAsesorado,nota:notaInterna,tipo:'sin_reporte'};
    }

    // P2: Cumplimiento bajo — fin del árbol
    if(q2==='muy_bajo'){
      notaInterna='Cumplimiento muy bajo (<50%) sin causas externas claras. No ajustar plan. Hablar primero sobre barreras.';
      mjeAsesorado='Hola! Revise tu reporte y el cumplimiento de esta semana estuvo muy por debajo del minimo.\n\nSin un cumplimiento base (≥70% en comidas y descanso) las mediciones no me dicen nada util para ajustar tu plan. El plan puede estar bien, pero si no se ejecuta no hay forma de saberlo.\n\nMi parte es ajustar cuando los datos lo indican. Tu parte es registrar y cumplir para que esos datos existan.\n\nEsta semana el foco es uno solo: '+( pctComp<50?'llegar a 3 de 4 comidas por dia, todos los dias':'dormir 7hs al menos 4 noches')+'. El resto lo vemos cuando eso este resuelto.';
      return {mje:mjeAsesorado,nota:notaInterna,tipo:'cumplimiento_bajo'};
    }

    if(q2==='bajo_ctx'){
      notaInterna='Cumplimiento bajo con factores externos. El contexto explica parte del resultado. Plan sin cambios esta semana.';
      mjeAsesorado='Hola! Vi tu reporte. El cumplimiento estuvo un poco bajo pero entiendo que la semana tuvo sus complicaciones.\n\nLos factores externos no son excusa pero si contexto: complican el cumplimiento y eso impacta en los resultados. Esta semana volvemos a la rutina normal.\n\nFoco: '+( pctComp<70?'comidas — apunta a 3 de 4 todos los dias':'descanso — prioriza 7hs al menos 4 noches')+'. El resto mantenerlo.';
      return {mje:mjeAsesorado,nota:notaInterna,tipo:'cumplimiento_bajo_contexto'};
    }

    // P3: Mediciones
    var medMsg='';
    if(q3==='contrario'){
      notaInterna='Mediciones en direccion contraria al objetivo con cumplimiento OK. Revisar calorico — posible ajuste de plan necesario.';
      medMsg='Las mediciones estan yendo en la direccion contraria al objetivo ('+objetivo+'). Con buen cumplimiento esto indica que el plan necesita un ajuste. Esta semana reviso el calorico y te cuento los cambios.';
    }else if(q3==='estancado'){
      notaInterna='Mediciones estancadas sin factores externos. Evaluar ajuste calorico en proximo checkpoint.';
      medMsg='Peso y cintura sin cambios en 2+ semanas con buen cumplimiento. Esto puede indicar que el calorico necesita un ajuste. Lo evaluo esta semana.';
    }else if(q3==='estancado_ctx'){
      notaInterna='Mediciones estancadas pero con factores externos presentes. No ajustar plan aun. Esperar semana normal.';
      medMsg='El estancamiento de esta semana tiene explicacion: el contexto complica tanto el cumplimiento como las mediciones. En una semana normal esperamos ver el movimiento esperado.';
    }else{
      notaInterna='Mediciones en direccion correcta. Plan funcionando.';
      medMsg='Las mediciones van en la direccion correcta. Seguimos igual.';
    }

    // P4: Videos y progresion
    var entMsg='';var notaEnt='';
    if(q4==='ok_video'){
      notaEnt='Progresion + video enviado. Todo OK.';
      entMsg='El entreno va bien y el video me llego. Reviso la tecnica y te mando feedback.';
    }else if(q4==='ok_sin_video'){
      notaEnt='Progresion OK pero sin video. Pedir video esta semana.';
      entMsg=(nivelAse==='presencial'?'El entreno va bien. La proxima sesion presencial revisamos tecnica juntos.':'El entreno va bien. Esta semana grabate 1-2 series de cualquier ejercicio y subilo a la app. Me ayuda a ver la tecnica y darte un feedback mas preciso.');
    }else if(q4==='sin_progresion_video'){
      notaEnt='Sin progresion pero mando video. Revisar tecnica antes de ajustar carga.';
      entMsg='El video me llego, gracias. Esta semana lo reviso en detalle porque antes de ajustar carga quiero ver como esta la tecnica. Te mando devolucion.';
    }else{
      notaEnt='Sin progresion y sin video. Pedir video urgente.';
      entMsg=(nivelAse==='presencial'?'Esta semana nos vemos y revisamos tecnica en sesion.':'Esta semana necesito que me mandes 1-2 videos de algun ejercicio. Subilo a la app o mandamelo por aca. Sin verlo no puedo saber si el estancamiento es de carga, de tecnica o de recuperacion.');
    }

    notaInterna=notaInterna+' | Entreno: '+notaEnt;

          const pesoActual=pesos.length>0?pesos[pesos.length-1]:null;
          const cinActual=cinturas.length>0?cinturas[cinturas.length-1]:null;
          const pesoColor=pesoActual&&pesoBase?(pesoActual<pesoBase?G:pesoActual>pesoBase?R:'#111'):'#111';
          const cinColor=cinActual&&cinBase?(cinActual<cinBase?G:cinActual>cinBase?R:'#111'):'#111';
          const pesoDelta=pesoActual&&pesoBase?(' ('+(pesoActual-pesoBase>0?'+':'')+(pesoActual-pesoBase).toFixed(1)+'kg)'):'';
          const cinDelta=cinActual&&cinBase?(' ('+(cinActual-cinBase>0?'+':'')+(cinActual-cinBase).toFixed(1)+'cm)'):'';
          return h('div',null,
            hb&&h('div',{style:{...card,background:'#F8F8F8',marginBottom:'10px'}},

                h('div',null,h('div',{style:{fontSize:'11px',color:'#999'}},'Peso base'),h('div',{style:{fontSize:'16px',fontWeight:'800'}},hb.p+' kg')),
                h('div',null,h('div',{style:{fontSize:'11px',color:'#999'}},'Cintura base'),h('div',{style:{fontSize:'16px',fontWeight:'800'}},hb.c+' cm'))
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Peso'),
              pesos.length>=1?h(LineChart,{data:pesos,color:G,h:110,labels:pesoLabels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'20px'}},'Sin registros aún'),
              pesoActual&&h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'6px',fontSize:'12px'}},
                h('span',{style:{color:'#666'}},'Base: '+(pesoBase||'—')+' kg'),
                h('span',{style:{fontWeight:'700',color:pesoColor}},pesoActual+' kg'+pesoDelta)
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Cintura'),
              cinturas.length>=1?h(LineChart,{data:cinturas,color:B,h:110,labels:cinLabels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'20px'}},'Sin registros aún'),
              cinActual&&h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'6px',fontSize:'12px'}},
                h('span',{style:{color:'#666'}},'Base: '+(cinBase||'—')+' cm'),
                h('span',{style:{fontWeight:'700',color:cinColor}},cinActual+' cm'+cinDelta)
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Compliance comidas'),
              comps.length>=2?h(LineChart,{data:comps,color:O,h:90,labels:labels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'16px'}},'Faltan más semanas')
            )
          );
        })()
      ),

      // TAB: ENTRENAMIENTO
      tab==='ent'&&h('div',null,
        exNames.length===0
          ?h('div',{style:{...card,textAlign:'center',padding:'30px',color:'#999'}},
              h('div',{style:{fontSize:'30px',marginBottom:'8px'}},''),
              h('div',null,'Sin datos de entrenamiento todavía'),
              h('div',{style:{fontSize:'12px',marginTop:'4px'}},'El asesorado debe guardar semanas con reps cargadas')
            )
          :h('div',null,
              h('div',{style:card},
                h('div',{style:lbl},'e1RM estimado — ejercicios de su rutina'),
                h('select',{value:selEx,onChange:e=>setSelEx(parseInt(e.target.value)),style:{width:'100%',padding:'10px',border:'1px solid rgba(0,0,0,0.1)',borderRadius:'8px',fontSize:'13px',marginBottom:'10px',background:'#fff'}},
                  exNames.map((n,i)=>h('option',{key:i,value:i},(sinProgresion[n]?'🔴 ':'')+n))
                ),
                sinProgresion[exNames[selEx]]&&h('div',{style:{marginBottom:'8px',padding:'8px 10px',background:R+'12',borderRadius:'8px',border:'1px solid '+R+'30',fontSize:'11px',color:R,fontWeight:'600'}},'Sin progresion en 2+ semanas — revisar en checkpoint'),
                e1rmHistory.data.length>=2
                  ?h('div',null,
                      h(LineChart,{data:e1rmHistory.data,color:G,h:110,labels:e1rmHistory.labels}),
                      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'8px'}},
                        h('span',{style:{fontSize:'12px',color:'#666'}},'Inicio: '+e1rmHistory.data[0]+' kg'),
                        h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
                          (function(){
                            var last=e1rmHistory.data[e1rmHistory.data.length-1];
                            var prev=e1rmHistory.data[e1rmHistory.data.length-2];
                            var diff=parseFloat((last-prev).toFixed(1));
                            var ind=diff>0?'↑':diff<0?'↓':'→';
                            var col=diff>0?G:diff<0?R:O;
                            return h('span',{style:{fontWeight:'800',fontSize:'14px',color:col}},ind+' '+last+' kg '+(diff!==0?'('+( diff>0?'+':'')+diff+')':''));
                          })()
                        )
                      ),
                      // Indicador vs checkpoint anterior
                      (function(){
                        var cpFreqE=checkpointFreq||2;
                        var idxCP=e1rmHistory.data.length-cpFreqE-1;
                        if(idxCP<0)return null;
                        var lastE=e1rmHistory.data[e1rmHistory.data.length-1];
                        var cpE=e1rmHistory.data[idxCP];
                        var diffCP=parseFloat((lastE-cpE).toFixed(1));
                        var col=diffCP>0?G:diffCP<0?R:O;
                        var label=diffCP>0?'Sube vs checkpoint anterior':'Sin progresion vs checkpoint anterior';
                        return h('div',{style:{marginTop:'6px',padding:'8px 10px',background:col+'12',borderRadius:'8px',border:'1px solid '+col+'30',fontSize:'11px',color:col,fontWeight:'600'}},
                          label+' ('+(diffCP>0?'+':'')+diffCP+' kg)'
                        );
                      })()
                    )
                  :h('div',{style:{textAlign:'center',color:'#bbb',padding:'20px',fontSize:'12px'}},'Guardá al menos 2 semanas con reps cargadas')
              )
            )
      ),

      // TAB: SENSACIONES
      tab==='diag'&&h(DiagnosticoPanel,{rutina,weeks}),
      tab==='cp'&&h('div',null,
        h('div',{style:{...card,background:'#0A0A0A',border:'none',marginBottom:'10px'}},
          h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.4)',fontWeight:'700',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}},'Checkpoint · '+bloqueActual),
          h('div',{style:{fontSize:'13px',color:'rgba(255,255,255,0.7)',marginBottom:'4px'}},
            esCheckpoint
              ?'✅ Semana '+semanasEnBloque+' — es momento de checkpoint'
              :'Próximo: sem '+(Math.ceil(semanasEnBloque/checkpointFreq)*checkpointFreq)+' del bloque (cada '+checkpointFreq+' sem)'
          )
        ),
        h(ArbolCheckpoint,null)
      )
    )
  );
}

function VideoPanel({name}){
  const [videos,setVideos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [fb,setFb]=useState({});      // feedback en edición por índice
  const [saving,setSaving]=useState(null);
  const [savedIdx,setSavedIdx]=useState({});
  useEffect(()=>{
    fetch(SCRIPT_URL+'?action=videos')
      .then(r=>r.json())
      .then(rows=>{
        const vids=rows.filter(r=>String(r.Asesorado||'').trim().toLowerCase()===name.trim().toLowerCase());
        setVideos(vids);
        // precargar feedback existente en los campos (por clave estable)
        const init={};
        vids.forEach(v=>{ if(v.Feedback){const k=String(v.Sesion||'')+'|'+String(v.Ejercicio||'')+'|'+String(v.URL||'');init[k]=v.Feedback;} });
        setFb(init);
      }).catch(()=>{}).finally(()=>setLoading(false));
  },[name]);
  function guardarFeedback(v,vk){
    const texto=(fb[vk]||'').trim();
    if(!texto)return;
    setSaving(vk);
    // Identificamos el video por Asesorado + Sesion + Ejercicio + URL (clave estable)
    const payload={action:'videofeedback',asesorado:name,sesion:v.Sesion||'',ejercicio:v.Ejercicio||'',url:v.URL||'',feedback:texto,fecha:v.Fecha||''};
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .finally(()=>{ setSaving(null); setSavedIdx(s=>({...s,[vk]:true})); });
  }
  if(loading)return h('div',{style:{...card,textAlign:'center',color:'#bbb',padding:'24px',fontSize:'12px'}},'Cargando videos…');
  if(!videos.length)return h('div',{style:{...card,textAlign:'center',color:'#999',padding:'24px',fontSize:'13px'}},'Este asesorado todavía no subió videos.');
  // 1) Deduplicar por ejercicio: quedarse con el MÁS RECIENTE (última fila del sheet = último append).
  //    Guardamos el índice original para saber cuál es más nuevo.
  const conIdx=videos.map((v,idx)=>({...v,_ord:idx}));
  const porEjercicio={};
  conIdx.forEach(v=>{
    const key=String(v.Sesion||'').trim()+'|'+String(v.Ejercicio||'').trim();
    // el de mayor _ord (más abajo en el sheet) es el más reciente
    if(!porEjercicio[key]||v._ord>porEjercicio[key]._ord)porEjercicio[key]=v;
  });
  let unicos=Object.values(porEjercicio);
  // 2) Marcar corregido y ordenar: pendientes primero (más antiguo arriba), luego corregidos.
  const estaCorregido=v=>String(v.Revisado||'').toLowerCase()==='si'||(v.Feedback&&String(v.Feedback).trim());
  unicos.sort((a,b)=>{
    const ca=estaCorregido(a),cb=estaCorregido(b);
    if(ca!==cb)return ca?1:-1;           // sin corregir primero
    if(!ca)return a._ord-b._ord;          // pendientes: más antiguo (menor _ord) arriba
    return b._ord-a._ord;                 // corregidos: más reciente arriba
  });
  const pendientes=unicos.filter(v=>!estaCorregido(v)).length;
  const revList=unicos;
  return h('div',{style:card},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
      h('div',{style:lbl},'Videos — revisá y dejá tu corrección'),
      pendientes>0
        ?h('span',{style:{background:'#FEF3F2',color:'#B42318',borderRadius:'20px',padding:'3px 10px',fontSize:'11px',fontWeight:'800'}},pendientes+' sin corregir')
        :h('span',{style:{background:'#EAF7F2',color:G,borderRadius:'20px',padding:'3px 10px',fontSize:'11px',fontWeight:'800'}},'todo al día')
    ),
    revList.map((v,i)=>{
      const vk=String(v.Sesion||'')+'|'+String(v.Ejercicio||'')+'|'+String(v.URL||'');
      const yaRevisado=String(v.Revisado||'').toLowerCase()==='si'||savedIdx[vk];
      return h('div',{key:vk,style:{padding:'12px',marginBottom:'8px',borderRadius:'10px',border:'1px solid '+(yaRevisado?'rgba(0,0,0,0.08)':'#FED7AA'),background:yaRevisado?'#fff':'#FFFBEB'}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},
          h('div',null,
            h('div',{style:{fontWeight:'600',fontSize:'13px'}},'Ses. '+(v.Sesion||''),' — ',v.Ejercicio||''),
            h('div',{style:{fontSize:'10px',color:'#999'}},(v.Fecha||''),yaRevisado?h('span',{style:{marginLeft:'6px',color:G,fontWeight:'700'}},'✓ corregido'):h('span',{style:{marginLeft:'6px',color:'#B45309',fontWeight:'700'}},'pendiente'))
          ),
          h('a',{href:v.URL,target:'_blank',rel:'noreferrer',style:{background:'#EAF7F2',color:G,borderRadius:'8px',padding:'6px 12px',fontSize:'12px',fontWeight:'700',textDecoration:'none',flexShrink:0}},'▶ Ver')
        ),
        h('textarea',{value:fb[vk]||'',onChange:e=>{const val=e.target.value;setFb(s=>({...s,[vk]:val}));},placeholder:'Corrección técnica para el asesorado…',rows:2,style:{width:'100%',boxSizing:'border-box',border:'1px solid rgba(0,0,0,0.15)',borderRadius:'8px',padding:'8px',fontSize:'13px',resize:'vertical',fontFamily:'inherit'}}),
        h('button',{onClick:()=>guardarFeedback(v,vk),disabled:saving===vk||!((fb[vk]||'').trim()),style:{marginTop:'6px',background:saving===vk?'#ccc':AC,color:'#fff',border:'none',borderRadius:'8px',padding:'7px 14px',fontSize:'12px',fontWeight:'700',cursor:saving===vk?'default':'pointer'}},saving===vk?'Guardando…':savedIdx[vk]?'✓ Enviado — reenviar':'Enviar corrección')
      );
    })
  );
}
function SemanaPanel({data,rutinas}){
  const [copied,setCopied]=useState(null);
  const [view,setView]=useState('lun');
  const TIPS={
    nutricion:{
      volumen:'Sumá una comida más esta semana, aunque sea simple: la construcción muscular necesita ese aporte extra de energía.',
      fuerza:'Asegurá comer antes de cada sesión de fuerza. Sin energía disponible el sistema nervioso no rinde y el peso se siente más pesado.',
      intensidad:'Llegá a las sesiones bien alimentado: las técnicas de intensidad exigen más y sin energía no vas a sostenerlas.',
      base:'Fijá las 4 comidas en horarios estables esta semana. El objetivo del bloque es que el hábito quede firme.',
      rehabilitacion:'Comé completo y regular: la reparación de tejidos empieza en la comida, no en el ejercicio.'
    },
    sueno:{
      volumen:'Apuntá a 7hs mínimo esta semana. El músculo se construye durmiendo; con menos, el estímulo del entreno se desperdicia.',
      fuerza:'Cuidá el descanso como si fuera una serie más: la fuerza se consolida durmiendo, no entrenando.',
      intensidad:'Dormí bien las noches previas a las sesiones duras. Sin descanso, la intensidad se vuelve contraproducente.',
      base:'Ordená el horario de sueño esta semana. Es la base sobre la que se apoya todo lo demás.',
      rehabilitacion:'Priorizá el sueño: los tejidos se reparan mientras dormís. Es parte del tratamiento, no un extra.'
    },
    entreno:{
      volumen:'Completá las sesiones pautadas esta semana, aunque alguna sea corta. Sin volumen no hay estímulo para crecer.',
      fuerza:'No salteés ninguna sesión: el protocolo de carga necesita continuidad para que la progresión funcione.',
      intensidad:'Hacé todas las sesiones y cargá la técnica que te indiqué. El registro me deja ver cómo venís.',
      base:'Enfocate en que cada rep salga controlada. En este bloque la técnica vale más que el peso.',
      rehabilitacion:'Hacé los ejercicios con control y sin dolor. Registrá cómo te sentís para poder ajustar.'
    },
  };
  function getBloqueKey(rutina){var b=String((rutina&&rutina.Bloque)||'volumen').toLowerCase();if(b.includes('fuerza'))return 'fuerza';if(b.includes('intensidad'))return 'intensidad';if(b.includes('rehab'))return 'rehabilitacion';if(b.includes('base'))return 'base';if(b.includes('volumen'))return 'volumen';return 'base';}
  function getPilarScores(weeks,rutina){
    if(!weeks||!weeks.length)return null;
    var lat=weeks[weeks.length-1];
    var compPct2=parsePct((lat||{})['%Comidas']||0);
    var suenoOk=parseInt((lat&&lat.DiasSueno)||0);
    var e1rmOk=false;try{e1rmOk=Object.keys(JSON.parse((lat&&lat.E1RM)||'{}')).length>0;}catch(e){}
    var nivel=String(rutina&&rutina.Nivel||'online').toLowerCase();
    // Para presenciales sin registro de entreno, no penalizar ese pilar
    if(nivel==='presencial')e1rmOk=true;
    return{nutricion:compPct2/100,sueno:suenoOk/6,entreno:e1rmOk?1:0,compPct2,suenoOk,e1rmOk};
  }
  function getPilarDebil(weeks,rutina){
    var s=getPilarScores(weeks,rutina);if(!s)return null;
    var scores={nutricion:s.nutricion,sueno:s.sueno,entreno:s.entreno};
    var min=Math.min.apply(null,Object.values(scores));
    // Si el minimo es >=0.8, todos andan bien
    if(min>=0.8)return null;
    return Object.keys(scores).find(function(k){return scores[k]===min;})||'nutricion';
  }
  function genMensaje(name,weeks,rutina){
    if(!weeks||!weeks.length)return 'Hola '+name+'!\n\nArrancamos semana y no tengo tu reporte de la semana pasada. Contame rapido:\n\n- Como estuvo el entrenamiento?\n- Como llegaste con las comidas?\n- Peso y cintura de esta semana?\n- Algo diferente en tu contexto?\n\nCon eso puedo orientarte para esta semana.';
    var s=getPilarScores(weeks,rutina);
    var pilar=getPilarDebil(weeks,rutina);
    var bloqueKey=getBloqueKey(rutina);
    var lat=weeks[weeks.length-1];

    // Construir mensaje con pilares bien y pilares mal
    var bienPilares=[];var malPilares=[];
    if(s.nutricion>=0.8)bienPilares.push('comidas ('+s.compPct2+'%)');else malPilares.push({k:'nutricion',label:'Comidas',dato:s.compPct2+'% de cumplimiento'});
    if(s.sueno>=0.8)bienPilares.push('descanso ('+s.suenoOk+'/6 noches)');else malPilares.push({k:'sueno',label:'Sueno',dato:s.suenoOk+'/6 noches con 7hs o mas'});
    if(s.entreno>=0.8)bienPilares.push('entreno');else if(String(rutina&&rutina.Nivel||'').toLowerCase()!=='presencial')malPilares.push({k:'entreno',label:'Registro de entreno',dato:'Registro incompleto en la app'});

    var msg='Hola '+name+'! Arrancamos semana.\n\n';
    if(malPilares.length===0){
      msg+='La semana pasada estuvo muy bien en todo. Segui igual, eso es lo que genera resultados.\n\nCualquier duda en el momento me avisas.';
    }else{
      // Lo mas urgente a corregir
      var urgente=malPilares[0];
      var tip=((TIPS[urgente.k]||{})[bloqueKey])||((TIPS[urgente.k]||{}).volumen)||'Prioriza esto esta semana.';
      msg+='Para mejorar esta semana, foco en '+urgente.label+':\n- '+urgente.dato+'\n- '+tip;
      if(malPilares.length>1){
        msg+='\n\nTambien para mejorar (sin perder el foco principal):\n';
        malPilares.slice(1).forEach(function(p){msg+='- '+p.label+': '+p.dato+'\n';});
      }
      if(bienPilares.length>0){
        msg+='\n'+bienPilares.join(' y ')+': mantenerlo, venis bien.';
      }
      msg+='\n\nCualquier duda en el momento me avisas, no esperes al sabado.';
    }
    return msg;
  }
  function genMidWeek(name,weeks,rutina){
    if(!weeks||!weeks.length)return 'Sin datos de semanas anteriores para '+name+'.';
    var pilar=getPilarDebil(weeks,rutina);
    var bloqueKey=getBloqueKey(rutina);
    var tip=((TIPS[pilar]||{})[bloqueKey])||((TIPS[pilar]||{}).volumen)||'Segui igual.';
    var pilarLabel=pilar==='nutricion'?'las comidas':pilar==='sueno'?'el sueno':'el entreno';
    return 'Hola '+name+'! Mitad de semana.\n\nRecordatorio: la sem pasada tuviste dificultades con '+pilarLabel+'.\nEsta semana: '+tip+'\n\nEstas a tiempo de terminar fuerte. Cualquier duda me avisas.';
  }
  function copy(text,id){navigator.clipboard.writeText(text).then(function(){setCopied(id);setTimeout(function(){setCopied(null);},2000);});}
  var clients=Object.keys(data).sort();
  var MsgViernes='Ya arrancamos el fin de semana!\n\nRecordatorio: el sabado es el ultimo dia para registrar todo en la app antes de cerrar la semana.\n\nComidas, peso, cintura, sensaciones: todo lo que anotes le da herramientas a tu coach para ajustar el plan la semana que viene.\n\nCualquier duda del reporte me avisan.';
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh'}},
    h('div',{style:{background:'#fff',borderBottom:'1px solid rgba(0,0,0,0.09)',padding:'14px 18px',position:'sticky',top:0,zIndex:10}},
      h('div',{style:{fontSize:'18px',fontWeight:'800',marginBottom:'10px'}},'Mensajes semanales'),
      h('div',{style:{display:'flex',gap:'6px'}},
        [{v:'lun',l:'Lun/Dom'},{v:'mie',l:'Mie'},{v:'vie',l:'Vie'}].map(function(t){return h('button',{key:t.v,onClick:function(){setView(t.v);},style:{flex:1,padding:'8px',fontSize:'11px',fontWeight:view===t.v?'700':'400',cursor:'pointer',borderRadius:'8px',border:'none',background:view===t.v?'#111':'#F0F0F0',color:view===t.v?'#fff':'#666'}},t.l);})
      )
    ),
    h('div',{style:{padding:'12px'}},
      view==='vie'&&h('div',{style:{background:'#fff',borderRadius:'12px',padding:'16px',border:'1px solid rgba(0,0,0,0.08)'}},
        h('div',{style:{fontSize:'11px',fontWeight:'700',color:'#999',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:'8px'}},'Mensaje comunidad Viernes'),
        h('div',{style:{fontSize:'12px',color:'#555',lineHeight:'1.6',whiteSpace:'pre-line',background:'#F8F8F8',borderRadius:'8px',padding:'10px',marginBottom:'12px'}},MsgViernes),
        h('button',{onClick:function(){copy(MsgViernes,'vie');},style:{width:'100%',background:copied==='vie'?G:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'10px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},copied==='vie'?'Copiado!':'Copiar')
      ),
      (view==='lun'||view==='mie')&&clients.map(function(name){
        var weeks=data[name]||[];
        var rutina=rutinas.find(function(r){return String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase();});
        var msg=view==='lun'?genMensaje(name,weeks,rutina):genMidWeek(name,weeks,rutina);
        var pilar=getPilarDebil(weeks,rutina);
        var pilarColor=pilar==='nutricion'?O:pilar==='sueno'?B:G;
        var hasData=weeks&&weeks.length>0;
        return h('div',{key:name,style:{background:'#fff',borderRadius:'12px',padding:'14px',marginBottom:'10px',border:'1px solid rgba(0,0,0,0.08)'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},
            h('div',null,
              h('div',{style:{fontWeight:'800',fontSize:'14px'}},name),
              h('div',{style:{fontSize:'11px',marginTop:'2px',color:hasData?pilarColor:R,fontWeight:'600'}},hasData?('Punto debil: '+(pilar==='nutricion'?'Comidas':pilar==='sueno'?'Sueno':'Entreno')):'Sin reporte')
            ),
            h('button',{onClick:function(){copy(msg,name+view);},style:{background:copied===name+view?G:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 14px',fontSize:'11px',fontWeight:'700',cursor:'pointer',flexShrink:0}},copied===name+view?'Copiado!':'Copiar')
          ),
          h('div',{style:{fontSize:'12px',color:'#555',lineHeight:'1.6',whiteSpace:'pre-line',background:'#F8F8F8',borderRadius:'8px',padding:'10px',maxHeight:'120px',overflowY:'auto'}},msg)
        );
      })
    )
  );
}

function AuditoriaPanel({data,rutinas,decisiones}){
  const [selected,setSelected]=useState(null);
  const [manualToggles,setManualToggles]=useState({});
  const [saving,setSaving]=useState(null);
  const [saved,setSaved]=useState({});

  // Calcular ventana: ultimas 4 semanas con datos
  function getUltimas4(weeks){
    return weeks.slice(-4);
  }

  // Score de cumplimiento (igual que asesoria.html)
  function calcScore(w){
    if(!w)return 0;
    var pC=parseFloat(String(w['%Comidas']||'0').replace('%',''))||0;
    var pS=parseFloat(String(w['%Sueno']||'0').replace('%',''))||0;
    var hasPeso=parseFloat(w.Peso||0)>0;
    var hasCin=parseFloat(w.Cintura||0)>0;
    var e1rmOk=false;try{e1rmOk=Object.keys(JSON.parse(w.E1RM||'{}')).length>0;}catch(e){}
    var scoreEntreno=e1rmOk?33:0;
    var scoreNut=Math.round((pC/100)*20+(pS/100)*13);
    var scoreMed=Math.round((hasPeso?8:0)+(hasCin?7:0)+18*0.5); // approx
    return Math.min(100,scoreEntreno+scoreNut+scoreMed);
  }

  // Checkpoints esperados en ventana segun bloque
  function getCPEsperados(bloque,semanas){
    var freq={'health phase':1,'mantenimiento':4,'deporte':4}[bloque.toLowerCase()]||2;
    return Math.max(1,Math.floor(semanas/freq));
  }

  // Calcular auditoria de un asesorado
  function calcAuditoria(name,weeks,rutina){
    var nivel=String(rutina&&rutina.Nivel||'online').toLowerCase();
    var bloque=String(rutina&&rutina.Bloque||'volumen').toLowerCase();
    var w4=getUltimas4(weeks);
    var nSems=w4.length;

    // SU PARTE
    var reporto=nSems; // filas = semanas reportadas
    var noReporto=4-reporto;
    var semsScore70=w4.filter(function(w){return calcScore(w)>=70;}).length;
    var fallasEl=0;
    var noNegEl=false;
    if(reporto<3){fallasEl+=1;noNegEl=true;} // NO NEGOCIABLE
    if(semsScore70<3)fallasEl+=1;
    var sfEl=noNegEl?'red':fallasEl>=3?'red':fallasEl===2?'yellow':'green';

    // MI PARTE — checkpoints en Decisiones
    var decsMias=(decisiones||[]).filter(function(d){
      return String(d.Asesorado||'').trim().toLowerCase()===name.toLowerCase();
    });
    var decsVentana=decsMias.slice(-4);
    var cpEsperados=getCPEsperados(bloque,nSems||4);
    var cpRealizados=decsVentana.length;
    var fallaCoach=0;
    var noNegCoach=false;
    if(cpRealizados<cpEsperados){fallaCoach+=(cpEsperados-cpRealizados);if(cpEsperados-cpRealizados>0)noNegCoach=true;}

    // Toggles manuales presenciales
    var tog=manualToggles[name]||{};
    if(nivel==='presencial'){
      if(!tog.asistencia)fallaCoach+=1;
      if(!tog.tecnica)fallaCoach+=1;
      if(!tog.integracion)fallaCoach+=1;
    }
    var sfCoach=noNegCoach?'red':fallaCoach>=3?'red':fallaCoach===2?'yellow':'green';

    // Cuadrante
    var cuadrante,accion;
    var elOk=sfEl==='green'||sfEl==='yellow';
    var coachOk=sfCoach==='green'||sfCoach==='yellow';
    if(coachOk&&elOk){cuadrante='Servicio real';accion='Validar precio / pedir testimonio';}
    else if(coachOk&&!elOk){cuadrante='Techado por ellos';accion='Exigir reporte como condicion o bajar de nivel';}
    else if(!coachOk&&elOk){cuadrante='El cuello soy yo';accion='Cerrar mi parte antes de tocar el precio';}
    else{cuadrante='Ficcion con cobro';accion='Resetear el vinculo';}

    // Si no reporto, coach no se penaliza
    if(noNegEl&&sfCoach==='red'&&cpRealizados===0){sfCoach='yellow';}

    return{nivel,bloque,sfEl,sfCoach,cuadrante,accion,reporto,noReporto,semsScore70,cpEsperados,cpRealizados,fallaCoach,fallasEl,w4,tog,noNegEl,noNegCoach};
  }

  function semaforo(sf){
    var c=sf==='green'?G:sf==='yellow'?O:R;
    var ic=sf==='green'?'🟢':sf==='yellow'?'🟡':'🔴';
    return h('span',{style:{fontSize:'16px'}},ic);
  }

  function cuadColor(c){
    if(c==='Servicio real')return G;
    if(c==='Techado por ellos')return O;
    if(c==='El cuello soy yo')return B;
    return R;
  }

  function saveAuditoria(name,aud){
    setSaving(name);
    var row={
      action:'auditoria',
      fecha:new Date().toLocaleDateString('es-AR'),
      asesorado:name,
      semaforoEl:aud.sfEl,
      semaforoCoach:aud.sfCoach,
      cuadrante:aud.cuadrante,
      notas:aud.accion
    };
    fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(row)})
      .then(function(){setSaved(function(prev){return Object.assign({},prev,{[name]:true});});})
      .catch(function(){})
      .finally(function(){setSaving(null);});
  }

  // Orden: falla de ellos primero (rojo su parte), luego falla compartida, luego falla mia sola
  function getAudOrder(name){
    var weeks=data[name]||[];
    var rutina2=rutinas.find(function(r){return String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase();});
    var a=calcAuditoria(name,weeks,rutina2);
    if(a.sfEl==='red'&&a.sfCoach!=='red')return 0; // falla de ellos
    if(a.sfEl==='red'&&a.sfCoach==='red')return 1; // falla compartida
    if(a.sfEl!=='red'&&a.sfCoach==='red')return 2; // falla mia
    return 3; // todo ok
  }
  var clients=Object.keys(data).filter(function(name){
    var r=rutinas.find(function(r){return String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase();});
    var nivel=String(r&&r.Nivel||'').toLowerCase();
    return nivel==='online'||nivel==='presencial';
  }).sort();

  // Vista detalle
  if(selected){
    var weeks=data[selected]||[];
    var rutina=rutinas.find(function(r){return String(r.Asesorado||'').trim().toLowerCase()===selected.toLowerCase();});
    var aud=calcAuditoria(selected,weeks,rutina);
    var esPresencial=aud.nivel==='presencial';
    var tog=manualToggles[selected]||{};
    function setTog(k,v){setManualToggles(function(prev){var n=Object.assign({},prev);n[selected]=Object.assign({},n[selected]||{},{[k]:v});return n;});}

    return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh',paddingBottom:'20px'}},
      h('div',{style:{background:'#fff',padding:'14px 18px',borderBottom:'1px solid rgba(0,0,0,0.08)',display:'flex',alignItems:'center',gap:'12px',position:'sticky',top:0,zIndex:10}},
        h('button',{onClick:function(){setSelected(null);},style:{background:'none',border:'none',fontSize:'20px',cursor:'pointer'}},'←'),
        h('div',null,
          h('div',{style:{fontWeight:'800',fontSize:'16px'}},selected),
          h('div',{style:{fontSize:'11px',color:'#999'}},aud.nivel+' · '+aud.bloque)
        )
      ),
      h('div',{style:{padding:'12px'}},
        // Semaforos
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}},
          h('div',{style:{...card,marginBottom:0,textAlign:'center'}},
            h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'700',marginBottom:'6px',letterSpacing:'0.06em'}},'SU PARTE'),
            h('div',{style:{fontSize:'28px',marginBottom:'4px'}},semaforo(aud.sfEl)),
            h('div',{style:{fontSize:'11px',color:'#666'}},aud.sfEl==='green'?'Cumple':aud.sfEl==='yellow'?'Atencion':'Falla')
          ),
          h('div',{style:{...card,marginBottom:0,textAlign:'center'}},
            h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'700',marginBottom:'6px',letterSpacing:'0.06em'}},'MI PARTE'),
            h('div',{style:{fontSize:'28px',marginBottom:'4px'}},semaforo(aud.sfCoach)),
            h('div',{style:{fontSize:'11px',color:'#666'}},aud.sfCoach==='green'?'Cumple':aud.sfCoach==='yellow'?'Atencion':'Falla')
          )
        ),
        // Cuadrante
        h('div',{style:{...card,background:cuadColor(aud.cuadrante)+'15',border:'1px solid '+cuadColor(aud.cuadrante)+'30',marginBottom:'10px'}},
          h('div',{style:{fontSize:'14px',fontWeight:'800',color:cuadColor(aud.cuadrante),marginBottom:'4px'}},aud.cuadrante),
          h('div',{style:{fontSize:'12px',color:'#444',lineHeight:'1.5'}},aud.accion)
        ),
        // Su parte - detalle
        h('div',{style:card},
          h('div',{style:{...lbl,marginBottom:'10px'}},'Su parte — ultimas 4 semanas'),

            )
          ),
          h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',fontSize:'13px'}},
            h('span',{style:{color:'#555'}},'Semanas con score ≥70'),

          ),
          esPresencial&&h('div',null,
            h('div',{style:{fontSize:'11px',color:'#999',fontWeight:'700',marginTop:'10px',marginBottom:'6px',letterSpacing:'0.06em'}},'PRESENCIAL — MANUAL'),
            ['asistencia_el'].map(function(k){
              var label='Asistencia ≥80% a sesiones';
              var val=tog[k]||false;
              return h('div',{key:k,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderTop:'1px solid rgba(0,0,0,0.06)',fontSize:'13px'}},
                h('span',{style:{color:'#555'}},label),
                h('button',{onClick:function(){setTog(k,!val);},style:{padding:'4px 14px',borderRadius:'20px',border:'none',fontWeight:'700',fontSize:'11px',cursor:'pointer',background:val?G:R,color:'#fff'}},val?'Si':'No')
              );
            })
          )
        ),
        // Mi parte - detalle
        h('div',{style:card},
          h('div',{style:{...lbl,marginBottom:'10px'}},'Mi parte — checkpoints'),
          h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid rgba(0,0,0,0.06)',fontSize:'13px'}},
            h('span',{style:{color:'#555'}},'Checkpoints esperados'),

            [{k:'tecnica',l:'Correcciones de tecnica/carga en sesion'},{k:'integracion',l:'Integracion gym + reporte en un ajuste'}].map(function(item){

// ── PESTAÑA MADRE: Videos sin corregir de TODOS los asesorados, agrupados ──
function VideosGlobal({onSelect}){
  const [videos,setVideos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [fb,setFb]=useState({});
  const [saving,setSaving]=useState(null);
  const [savedVk,setSavedVk]=useState({});
  const [verRevisados,setVerRevisados]=useState(false);
  const [abierto,setAbierto]=useState(null); // asesorado abierto (lista -> entrar)
  useEffect(()=>{
    fetch(SCRIPT_URL+'?action=videos').then(r=>r.json()).then(rows=>{setVideos(rows||[]);}).catch(()=>{}).finally(()=>setLoading(false));
  },[]);
  function guardar(v,vk){
    const texto=(fb[vk]||'').trim();
    if(!texto)return;
    setSaving(vk);
    const payload={action:'videofeedback',asesorado:v.Asesorado||'',sesion:v.Sesion||'',ejercicio:v.Ejercicio||'',url:v.URL||'',feedback:texto,fecha:v.Fecha||''};
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .finally(()=>{ setSaving(null); setSavedVk(s=>({...s,[vk]:true})); });
  }
  if(loading)return h('div',{style:{maxWidth:'480px',margin:'0 auto',padding:'40px',textAlign:'center',color:'#999',fontSize:'13px'}},'Cargando videos…');
  const norm=x=>String(x||'').trim().toLowerCase();
  // Dedup por asesorado+ejercicio: queda el más reciente (última fila)
  const conIdx=videos.map((v,i)=>({...v,_ord:i}));
  const porClave={};
  conIdx.forEach(v=>{const k=norm(v.Asesorado)+'|'+norm(v.Sesion)+'|'+norm(v.Ejercicio);if(!porClave[k]||v._ord>porClave[k]._ord)porClave[k]=v;});
  const corregido=v=>String(v.Revisado||'').toLowerCase()==='si'||(v.Feedback&&String(v.Feedback).trim());
  const yaGuardado=v=>savedVk[norm(v.Asesorado)+'|'+String(v.Sesion||'')+'|'+String(v.Ejercicio||'')+'|'+String(v.URL||'')];
  const unicos=Object.values(porClave);
  // Agrupar por asesorado, con conteo de pendientes
  const porAsesorado={};
  unicos.forEach(v=>{const a=String(v.Asesorado||'').trim();if(!a)return;if(!porAsesorado[a])porAsesorado[a]={pend:[],rev:[]};if(corregido(v)||yaGuardado(v))porAsesorado[a].rev.push(v);else porAsesorado[a].pend.push(v);});

  // ── VISTA 2: dentro de un asesorado (sus videos) ──
  if(abierto){
    const grupo=porAsesorado[abierto]||{pend:[],rev:[]};
    const lista=verRevisados?grupo.rev:grupo.pend;
    return h('div',{style:{maxWidth:'480px',margin:'0 auto',padding:'16px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}},
        h('button',{onClick:()=>{setAbierto(null);setVerRevisados(false);},style:{background:'none',border:'none',fontSize:'22px',cursor:'pointer',color:'#666',padding:0}},'‹'),
        h('div',{style:{fontSize:'18px',fontWeight:'800'}},abierto)
      ),
      h('div',{style:{display:'flex',gap:'8px',marginBottom:'14px'}},
        h('button',{onClick:()=>setVerRevisados(false),style:{flex:1,padding:'8px',borderRadius:'8px',border:'none',background:!verRevisados?AC:'#F0F0F0',color:!verRevisados?'#fff':'#666',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'Sin corregir ('+grupo.pend.length+')'),
        h('button',{onClick:()=>setVerRevisados(true),style:{flex:1,padding:'8px',borderRadius:'8px',border:'none',background:verRevisados?AC:'#F0F0F0',color:verRevisados?'#fff':'#666',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'Corregidos ('+grupo.rev.length+')')
      ),
      lista.length===0
        ?h('div',{style:{textAlign:'center',color:'#bbb',padding:'40px 0',fontSize:'14px'}},verRevisados?'Sin videos corregidos':'No hay videos pendientes 🎉')
        :lista.map(v=>{
            const vk=norm(v.Asesorado)+'|'+String(v.Sesion||'')+'|'+String(v.Ejercicio||'')+'|'+String(v.URL||'');
            const corr=verRevisados;
            return h('div',{key:vk,style:{padding:'12px',marginBottom:'8px',borderRadius:'10px',border:'1px solid '+(corr?'rgba(0,0,0,0.08)':'#FED7AA'),background:corr?'#fff':'#FFFBEB'}},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},
                h('div',null,
                  h('div',{style:{fontWeight:'600',fontSize:'13px'}},'Ses. '+(v.Sesion||''),' — ',v.Ejercicio||''),
                  h('div',{style:{fontSize:'10px',color:'#999'}},v.Fecha||'')
                ),
                h('a',{href:v.URL,target:'_blank',rel:'noreferrer',style:{background:'#EAF7F2',color:G,borderRadius:'8px',padding:'6px 12px',fontSize:'12px',fontWeight:'700',textDecoration:'none',flexShrink:0}},'▶ Ver')
              ),
              h('textarea',{value:fb[vk]!==undefined?fb[vk]:(v.Feedback||''),onChange:e=>{const val=e.target.value;setFb(s=>({...s,[vk]:val}));},placeholder:'Corrección técnica…',rows:2,style:{width:'100%',boxSizing:'border-box',border:'1px solid rgba(0,0,0,0.15)',borderRadius:'8px',padding:'8px',fontSize:'13px',resize:'vertical',fontFamily:'inherit'}}),
              h('button',{onClick:()=>guardar(v,vk),disabled:saving===vk||!((fb[vk]!==undefined?fb[vk]:(v.Feedback||'')).trim()),style:{marginTop:'6px',background:saving===vk?'#ccc':AC,color:'#fff',border:'none',borderRadius:'8px',padding:'7px 14px',fontSize:'12px',fontWeight:'700',cursor:saving===vk?'default':'pointer'}},saving===vk?'Guardando…':corr?'Actualizar corrección':'Enviar corrección')
            );
          })
    );
  }

  // ── VISTA 1: lista de asesorados con videos pendientes ──
  const conPend=Object.keys(porAsesorado).filter(a=>porAsesorado[a].pend.length>0).sort();
  const soloRev=Object.keys(porAsesorado).filter(a=>porAsesorado[a].pend.length===0&&porAsesorado[a].rev.length>0).sort();
  const totalPend=conPend.reduce((s,a)=>s+porAsesorado[a].pend.length,0);
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',padding:'16px'}},
    h('div',{style:{fontSize:'18px',fontWeight:'800',marginBottom:'4px'}},'Videos'),
    h('div',{style:{fontSize:'12px',color:'#999',marginBottom:'16px'}},totalPend===0?'Todo al día ✓':totalPend+' sin corregir · '+conPend.length+' asesorado'+(conPend.length>1?'s':'')),
    conPend.length===0&&soloRev.length===0
      ?h('div',{style:{textAlign:'center',color:'#bbb',padding:'40px 0',fontSize:'14px'}},'No hay videos cargados')
      :null,
    conPend.map(a=>h('div',{key:a,onClick:()=>{setAbierto(a);setVerRevisados(false);},style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#FFFBEB',border:'1px solid #FED7AA',borderRadius:'10px',padding:'14px',marginBottom:'8px',cursor:'pointer'}},
