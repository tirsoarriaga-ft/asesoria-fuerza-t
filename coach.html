// ── CHARTS ────────────────────────────────────────────────────────────
function LineChart({data,color,h:ht=110,labels}){
  if(!data||data.length<2)return null;
  const W=300,H=ht,pad={t:8,b:22,l:32,r:8};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const mn=Math.min(...data)*0.97,mx=Math.max(...data)*1.03;
  const x=i=>pad.l+i/(data.length-1)*iW;
  const y=v=>pad.t+(1-(v-mn)/(mx-mn))*iH;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const poly=pts+` ${x(data.length-1)},${H-pad.b} ${x(0)},${H-pad.b}`;
  const step=Math.ceil(data.length/5);
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('polygon',{points:poly,fill:color,opacity:'0.08'}),
    h('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round'}),
    data.map((v,i)=>(i%step===0||i===data.length-1)?h('circle',{key:i,cx:x(i),cy:y(v),r:'3',fill:color}):null),
    labels&&labels.map((l,i)=>(i%step===0||i===labels.length-1)?h('text',{key:i,x:x(i),y:H-5,textAnchor:'middle',fontSize:'8',fill:'#aaa'},l):null),
    h('text',{x:pad.l-2,y:y(mn)+4,textAnchor:'end',fontSize:'8',fill:'#bbb'},mn.toFixed(1)),
    h('text',{x:pad.l-2,y:y(mx)+4,textAnchor:'end',fontSize:'8',fill:'#bbb'},mx.toFixed(1))
  );
}
function DualBarChart({data}){
  if(!data||data.length<1)return null;
  const W=300,H=90,pad={t:6,b:20,l:16,r:6};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const bW=Math.min(10,iW/data.length/2-2);
  const gap=iW/data.length;
  return h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    h('line',{x1:pad.l,y1:pad.t+iH,x2:W-pad.r,y2:pad.t+iH,stroke:'rgba(0,0,0,0.06)',strokeWidth:'1'}),
    data.map((d,i)=>{
      const cx=pad.l+i*gap+gap/2;
      const sH=(d.sleep/7)*iH,tH=(d.toxics/7)*iH;
      return h('g',{key:i},
        h('rect',{x:cx-bW-1,y:pad.t+iH-sH,width:bW,height:Math.max(sH,1),fill:G,rx:'2'}),
        h('rect',{x:cx+1,y:pad.t+iH-tH,width:bW,height:Math.max(tH,1),fill:R,rx:'2'}),
        h('text',{x:cx,y:H-4,textAnchor:'middle',fontSize:'7',fill:'#aaa'},d.label)
      );
    })
  );
}

// ── ALERTAS (framework del coach) ─────────────────────────────────────
function getAlerts(weeks,objetivo){
  const A=[];
  if(!weeks.length)return A;
  const lat=weeks[weeks.length-1];
  const obj=String(objetivo||'mantenimiento').toLowerCase().trim()||'mantenimiento';
  const compPct=parsePct(lat['%Comidas']);
  const estres=String(lat.Estres||lat.Estrés||'');
  const energia=String(lat.Energia||lat.Energía||'');
  const tox=parseInt(lat.Toxicos||lat.Tóxicos||0)||0;

  // Compliance
  if(compPct<60)A.push({lvl:'red',txt:'Adherencia baja — ajustar plan no tiene sentido todavía'});
  else if(compPct<80)A.push({lvl:'yellow',txt:'Adherencia media — revisar barreras antes de cambiar variables'});

  // Sensaciones
  if(estres==='Estrés alto'&&energia==='Baja toda la semana')
    A.push({lvl:'red',txt:'Sensaciones alteradas — semana de descarga, no agregar estímulo'});
  else{
    if(estres==='Estrés alto')A.push({lvl:'yellow',txt:'Estrés alto — monitorear recuperación'});
    if(energia==='Baja toda la semana')A.push({lvl:'yellow',txt:'Energía baja — revisar sueño y adherencia nutricional'});
  }

  // Tóxicos
  if(tox>=4)A.push({lvl:'yellow',txt:'Semana con muchos permitidos — considerar en el análisis'});

  // Dolor articular
  const dolor=String(lat.Dolor||'');
  const dolorInt=String(lat.DolorIntensidad||'');
  if(dolor==='si'&&dolorInt==='Dolor en reposo')A.push({lvl:'red',txt:' Dolor en reposo — revisar antes de cualquier ajuste de carga'});
  else if(dolor==='si'&&dolorInt==='Limita el movimiento')A.push({lvl:'yellow',txt:' Dolor que limita el movimiento — monitorear'});
  else if(dolor==='si')A.push({lvl:'info',txt:' Molestia articular leve — '+(lat.DolorZona||'zona no especificada')});

  // Contexto de vida
  const ctx=String(lat.ContextoVida||'');
  if(ctx==='muy_exigente'&&compPct<60)A.push({lvl:'yellow',txt:'Semana muy difícil + compliance bajo — revisar barreras antes de ajustar'});
  else if(ctx==='muy_exigente')A.push({lvl:'info',txt:'Semana muy difícil — considerar en el análisis'});

  // Tendencias peso y cintura — últimas 2 semanas con datos
  if(weeks.length>=2){
    const objetivo=obj;
    const ps=weeks.slice(-3).map(w=>parseFloat(w.Peso)).filter(v=>!isNaN(v)&&v>0);
    const cs=weeks.slice(-3).map(w=>parseFloat(w.Cintura)).filter(v=>!isNaN(v)&&v>0);
    if(ps.length>=2&&cs.length>=2){
      const diffP=parseFloat((ps[ps.length-1]-ps[0]).toFixed(1));
      const diffC=parseFloat((cs[cs.length-1]-cs[0]).toFixed(1));
      const pesoSubio=diffP>=0.5;
      const pesoBajoRapido=diffP<=-0.5;
      const pesoBajoLento=diffP>-0.5&&diffP<0;
      const pesoEstable=Math.abs(diffP)<0.5;
      const cinturaSubio=diffC>=0.5;
      const cinturaBajoRapido=diffC<=-0.5;
      const cinturaEstable=Math.abs(diffC)<0.5;
      const sfx=' ('+( diffP>0?'+':'')+diffP+'kg / '+(diffC>0?'+':'')+diffC+'cm)';

      if(objetivo==='deficit'){
        if((pesoBajoRapido||pesoBajoLento)&&(cinturaBajoRapido||!cinturaSubio))
          A.push({lvl:'info',txt:'Tendencia esperada — peso y cintura en descenso'+sfx});
        else if(pesoEstable&&cinturaBajoRapido)
          A.push({lvl:'info',txt:'Cintura en descenso, peso estable — posible recomposición'+sfx});
        else if(pesoEstable&&cinturaEstable)
          A.push({lvl:'yellow',txt:'Estancamiento — revisá adherencia y variables'+sfx});
        else if(pesoSubio||cinturaSubio)
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — revisá el plan'+sfx});
        else
          A.push({lvl:'yellow',txt:'Progreso lento — revisá adherencia'+sfx});
      }else if(objetivo==='superavit'){
        if(pesoSubio&&!cinturaSubio)
          A.push({lvl:'info',txt:'Tendencia esperada — peso en suba, cintura controlada'+sfx});
        else if(pesoSubio&&cinturaSubio)
          A.push({lvl:'yellow',txt:'Peso sube pero también cintura — monitorear'+sfx});
        else if(pesoEstable||pesoBajoLento)
          A.push({lvl:'yellow',txt:'Peso sin cambios significativos — revisá el plan'+sfx});
        else if(pesoBajoRapido)
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — peso en baja'+sfx});
        if(cinturaSubio&&diffC>=0.5)
          A.push({lvl:'red',txt:'Cintura en aumento — revisá calidad del superávit'+sfx});
      }else{
        // mantenimiento
        if(pesoEstable&&cinturaEstable)
          A.push({lvl:'info',txt:'Variables estables — mantenimiento en curso'+sfx});
        else if((pesoSubio&&diffP>=0.5)||(cinturaSubio&&diffC>=0.5))
          A.push({lvl:'red',txt:'Tendencia contraria al objetivo — revisá el plan'+sfx});
        else
          A.push({lvl:'yellow',txt:'Leve variación — monitorear próximas semanas'+sfx});
      }
    }
  }
  return A;
}
function getStatus(weeks,objetivo){
  const A=getAlerts(weeks,objetivo);
  if(A.some(a=>a.lvl==='red'))return'red';
  if(A.some(a=>a.lvl==='yellow'))return'yellow';
  if(weeks.length>0)return'green';
  return'grey';
}

// ── PIN SCREEN ────────────────────────────────────────────────────────
function PinScreen({onUnlock}){
  const [pin,setPin]=useState('');
  const [shake,setShake]=useState(false);
  const tryPin=p=>{
    if(p===COACH_PIN){onUnlock();}
    else{setShake(true);setPin('');setTimeout(()=>setShake(false),600);}
  };
  const press=d=>{
    const next=pin+d;
    if(next.length<=6)setPin(next);
    if(next.length>=4)tryPin(next);
  };
  const KEYS=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return h('div',{style:{maxWidth:'380px',margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',background:'#fff'}},
    h('div',{style:{fontSize:'36px',marginBottom:'12px'}},''),
    h('div',{style:{fontSize:'20px',fontWeight:'800',marginBottom:'4px'}},'Panel del Coach'),
    h('div',{style:{fontSize:'13px',color:'#999',marginBottom:'32px'}},'Ingresá tu PIN'),
    h('div',{style:{display:'flex',gap:'12px',marginBottom:'24px',transform:shake?'translateX(-8px)':'none',transition:'transform 0.1s'}},
      [0,1,2,3].map(i=>h('div',{key:i,style:{width:'14px',height:'14px',borderRadius:'50%',background:i<pin.length?'#111':'#E0E0E0',transition:'background 0.15s'}}))
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',width:'220px'}},
      KEYS.map((k,i)=>k===''?h('div',{key:i}):h('button',{key:i,onClick:()=>k==='⌫'?setPin(p=>p.slice(0,-1)):press(k),
        style:{height:'56px',fontSize:k==='⌫'?'20px':'18px',fontWeight:'700',background:k==='⌫'?'#F5F5F5':'#F8F8F8',border:'1px solid rgba(0,0,0,0.08)',borderRadius:'10px',cursor:'pointer',color:'#111'}},k))
    )
  );
}

// ── CLIENT LIST ───────────────────────────────────────────────────────
function ClientList({data,rutinas,onSelect,onRefresh}){
  const statusOrder={red:0,yellow:1,green:2,grey:3};
  const getObj=name=>{const r=rutinas.find(rt=>String(rt.Asesorado||'').trim().toLowerCase()===name.toLowerCase());return String(r?.Objetivo||'mantenimiento').toLowerCase().trim()||'mantenimiento';};
  const clients=Object.keys(data).sort((a,b)=>{
    const sa=getStatus(data[a],getObj(a)),sb=getStatus(data[b],getObj(b));
    if(statusOrder[sa]!==statusOrder[sb])return statusOrder[sa]-statusOrder[sb];
    const la=data[a],lb=data[b];
    return String(lb[lb.length-1]?.SemanID||'').localeCompare(String(la[la.length-1]?.SemanID||''));
  });
  const statusBg={red:'#FEF2F2',yellow:'#FFFBEB',green:'#F0FDF4',grey:'#F9F9F9'};
  const counts={red:0,yellow:0,green:0};
  clients.forEach(c=>{const s=getStatus(data[c],getObj(c));if(counts[s]!==undefined)counts[s]++;});

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh'}},
    h('div',{style:{background:'#fff',borderBottom:'1px solid rgba(0,0,0,0.09)',padding:'16px 18px',position:'sticky',top:0,zIndex:10}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,
          h('div',{style:{fontSize:'10px',color:'#999',fontWeight:'600',letterSpacing:'0.08em',textTransform:'uppercase'}},'Panel del Coach'),
          h('div',{style:{fontSize:'18px',fontWeight:'800'}},clients.length+' asesorados')
        ),
        h('button',{onClick:onRefresh,style:{background:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 14px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'↻ Actualizar')
      ),
      h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},
        [{c:'red',l:'Atención',color:R},{c:'yellow',l:'Revisar',color:O},{c:'green',l:'OK',color:G}].map(s=>
          h('div',{key:s.c,style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'#666'}},
            h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:s.color}}),
            counts[s.c]+' '+s.l
          )
        )
      )
    ),
    h('div',{style:{padding:'12px'}},
      clients.length===0&&h('div',{style:{textAlign:'center',padding:'60px 20px',color:'#999'}},
        h('div',{style:{fontSize:'40px',marginBottom:'12px'}},''),
        h('div',{style:{fontSize:'14px',fontWeight:'600'}},'No hay datos todavía'),
        h('div',{style:{fontSize:'12px',marginTop:'4px'}},'Los asesorados deben guardar al menos una semana')
      ),
      clients.map(name=>{
        const weeks=data[name];const lat=weeks[weeks.length-1];
        const obj=getObj(name);
        const status=getStatus(weeks,obj);const alerts=getAlerts(weeks,obj);
        const rutina=rutinas.find(r=>String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase());
        const tmpl=rutina?.Template?String(rutina.Template)+'kcal':'—';
        const latSemanID2=lat?.SemanID||'';
        const bloqueInicio2=parseInt(rutina?.BloqueInicio)||1;
        const latWkNum=latSemanID2?parseInt(latSemanID2.replace('sem_',''))||1:1;
        const semsEnBloque=Math.max(1,latWkNum-bloqueInicio2+1);
        const cpFreq=({'health phase':1,'mantenimiento':4,'deporte':4})[String(rutina?.Bloque||'').toLowerCase()]||2;
        const esCP=semsEnBloque%cpFreq===0;
        const redAlerts=alerts.filter(a=>a.lvl==='red').length;
        const yelAlerts=alerts.filter(a=>a.lvl==='yellow').length;
        return h('div',{key:name,onClick:()=>onSelect(name),
          style:{...card,cursor:'pointer',background:statusBg[status]||'#fff',borderLeft:'3px solid '+(status==='red'?R:status==='yellow'?O:status==='green'?G:'#E0E0E0')}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}},
            h('div',null,
              h('div',{style:{fontWeight:'800',fontSize:'15px',color:'#111'}},name),
              h('div',{style:{fontSize:'11px',color:'#999',marginTop:'2px'}},lat?.Semana||'Sin datos',' · ',tmpl,esCP&&h('span',{style:{marginLeft:'6px',background:AC,color:'#fff',fontSize:'10px',fontWeight:'700',padding:'1px 6px',borderRadius:'20px'}},' CP'))
            ),
            h('div',{style:{textAlign:'right',display:'flex',gap:'4px',alignItems:'center'}},
              redAlerts>0&&h('span',{style:{background:R,color:'#fff',fontSize:'10px',fontWeight:'700',padding:'2px 6px',borderRadius:'20px'}},redAlerts+''),
              yelAlerts>0&&h('span',{style:{background:O,color:'#fff',fontSize:'10px',fontWeight:'700',padding:'2px 6px',borderRadius:'20px'}},yelAlerts+''),
              h('span',{style:{fontSize:'14px',color:'#999'}},'>>')
            )
          ),
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px'}},
            [
              {l:'Peso',v:lat?.Peso?lat.Peso+' kg':'—'},
              {l:'Cintura',v:lat?.Cintura?lat.Cintura+' cm':'—'},
              {l:'Comidas',v:fmtPct((lat||{})['%Comidas'])},
              {l:'Sueño',v:lat?.DiasSueno!=null?lat.DiasSueno+'/7':'—'},
            ].map((m,i)=>h('div',{key:i,style:{background:'rgba(255,255,255,0.7)',borderRadius:'6px',padding:'6px 4px',textAlign:'center'}},
              h('div',{style:{fontSize:'12px',fontWeight:'700',color:'#111'}},m.v),
              h('div',{style:{fontSize:'9px',color:'#999',marginTop:'1px'}},m.l)
            ))
          )
        );
      })
    )
  );
}

  const currentWkNum=latSemanID?parseInt(latSemanID.replace('sem_',''))||'—':'—';
  const bloqueActual=String(rutina?.Bloque||'—');
  const bloqueInicio=parseInt(rutina?.BloqueInicio)||1;
  const semanasEnBloque=Math.max(1,(typeof currentWkNum==='number'?currentWkNum:1)-bloqueInicio+1);
  const CHECKPOINT_FREQ={'health phase':1,'mantenimiento':4,'deporte':4};
  const checkpointFreq=CHECKPOINT_FREQ[bloqueActual.toLowerCase()]||2;
  const esCheckpoint=semanasEnBloque>0&&semanasEnBloque%checkpointFreq===0;

  const [arbolStep,setArbolStep]=useState(0);
  const [arbolResp,setArbolResp]=useState({});
  const [arbolDone,setArbolDone]=useState(null);
  const [arbolNota,setArbolNota]=useState('');
  const [arbolSaving,setArbolSaving]=useState(false);

  // Datos para el árbol
  const ultE=lat?.Energia||'—';
  const ultH=lat?.Hambre||'—';
  const ultS=lat?.DiasSueno!=null?lat.DiasSueno+'/6 noches ≥7hs':'—';

  const pctComp=parsePct((lat||{})['%Comidas']||0);
  const e1rmLat=weeks.length>=2?(()=>{
    try{const e=JSON.parse(lat?.E1RM||'{}');const prev=JSON.parse(weeks[weeks.length-2]?.E1RM||'{}');const keys=Object.keys(e);if(!keys.length)return null;const k=keys[0];const d=parseFloat(e[k]||0)-parseFloat(prev[k]||0);return{ex:k,delta:d.toFixed(1)};}catch(e2){return null;}
  })():null;

  // Árboles por bloque
  const ARBOLES={
    volumen:[
      {id:'dolor',q:'¿Hay dolor articular nuevo esta semana?',datos:[{l:'Dolor registrado',v:ultDolor==='si'?(ultDolorZ||'Sí'):'No',c:ultDolor==='si'?R:G}],criterio:'Cualquier dolor articular nuevo detiene la progresión de ese ejercicio.',ops:[{v:'no',l:'No hay dolor'},{ v:'si',l:'Sí hay dolor'}]},
      {id:'sens',q:'¿Sensaciones dentro del innegociable?',datos:[{l:'Energía',v:ultE},{l:'Sueño',v:ultS},{l:'Hambre',v:ultH}],criterio:'Innegociable = energía OK + sueño ≥4 noches/sem + hambre no alterada. Si alguno falla → Health Phase.',ops:[{v:'si',l:'Sí, están OK'},{v:'no',l:'No, hay algo alterado'}]},
      {id:'comp',q:'¿Compliance ≥ mínimo (70%)?',datos:[{l:'Comidas',v:pctComp+'%',c:pctComp>=70?G:R}],criterio:'Si el compliance es bajo → hablar antes de tocar el plan. No ajustar nada.',ops:[{v:'si',l:'Sí, ≥70%'},{v:'no',l:'No, <70%'}]},
      {id:'e1rm',q:'¿e1RM subió en los últimos 14 días?',datos:e1rmLat?[{l:e1rmLat.ex,v:(parseFloat(e1rmLat.delta)>0?'+':'')+e1rmLat.delta+' kg',c:parseFloat(e1rmLat.delta)>0?G:R}]:[{l:'e1RM',v:'Sin datos suficientes'}],criterio:'Si no subió → evaluar semanas sin progresión. 1 sem: esperar. 2 sem: revisar DOMS y contexto. 3 sem: Fase 1.',ops:[{v:'si',l:'Sí, subió'},{v:'1sem',l:'No subió · 1 semana'},{v:'2sem',l:'No subió · 2 semanas'},{v:'3sem',l:'No subió · 3+ semanas'}]},
    ],
    fuerza:[
      {id:'dolor',q:'¿Hay dolor articular nuevo?',datos:[{l:'Dolor',v:ultDolor==='si'?(ultDolorZ||'Sí'):'No',c:ultDolor==='si'?R:G}],criterio:'Dolor en ejercicio de fuerza → reducir % y revisar técnica. Si persiste → Fase 1.',ops:[{v:'no',l:'No'},{v:'si',l:'Sí'}]},
      {id:'sens',q:'¿Sensaciones dentro del innegociable?',datos:[{l:'Energía',v:ultE},{l:'Sueño',v:ultS}],criterio:'Fuerza requiere sueño ≥7hs y energía. Sin recuperación el SNC no adapta.',ops:[{v:'si',l:'Sí, OK'},{v:'no',l:'No, alteradas'}]},
      {id:'comp',q:'¿Ejecutó los pesos pautados exactos?',datos:[{l:'Comidas',v:pctComp+'%',c:pctComp>=70?G:R}],criterio:'Compliance del protocolo = ejecutó los pesos pautados sin improvisar.',ops:[{v:'si',l:'Sí'},{v:'no',l:'No'}]},
      {id:'pesos',q:'¿Los pesos de trabajo subieron en 14 días?',datos:e1rmLat?[{l:e1rmLat.ex,v:(parseFloat(e1rmLat.delta)>0?'+':'')+e1rmLat.delta+' kg',c:parseFloat(e1rmLat.delta)>0?G:R}]:[{l:'e1RM',v:'Sin datos'}],criterio:'2 sem sin subir + contexto normal → bajar 5% y reiniciar. 3 sem → Fase 1.',ops:[{v:'si',l:'Sí, subieron'},{v:'2sem_ctx',l:'No · 2 sem + contexto exigente'},{v:'2sem',l:'No · 2 sem + contexto normal'},{v:'3sem',l:'No · 3+ semanas'}]},
    ],
    health:[
      {id:'mejora',q:'¿Sensaciones mejoraron vs semana anterior?',datos:[{l:'Energía',v:ultE},{l:'Sueño',v:ultS},{l:'Hambre',v:ultH},{l:'Contexto',v:ultCtx}],criterio:'Criterio de salida: 2 semanas consecutivas con energía OK + sueño ≥7hs + hambre normal + sin dolor.',ops:[{v:'si2',l:'Sí · 2 semanas consecutivas OK'},{v:'si1',l:'Sí · pero solo esta semana'},{v:'no_ctx',l:'No · hay causa externa'},{v:'no_4sem',l:'No · lleva >4 semanas sin mejora'},{v:'no',l:'No · sin causa clara'}]},
    ],
    base:[
      {id:'dolor',q:'¿Hay dolor articular?',datos:[{l:'Dolor',v:ultDolor==='si'?(ultDolorZ||'Sí'):'No',c:ultDolor==='si'?R:G}],criterio:'Dolor generalizado → Health Phase. Dolor puntual → revisar ejercicio específico.',ops:[{v:'no',l:'No'},{v:'puntual',l:'Sí, puntual'},{v:'generalizado',l:'Sí, generalizado'}]},
      {id:'sens',q:'¿Sensaciones dentro del innegociable?',datos:[{l:'Energía',v:ultE},{l:'Sueño',v:ultS}],criterio:'Si sensaciones alteradas → Health Phase antes de continuar NM.',ops:[{v:'si',l:'Sí, OK'},{v:'no',l:'No, alteradas'}]},
      {id:'rir',q:'¿Puede predecir su RIR con ±1-2 reps consistentemente?',datos:[{l:'Semanas en bloque',v:semanasEnBloque}],criterio:'<4 sem: temprano, continuar. 4-8 sem: evaluar instrucción. >8 sem: Fase 1.',ops:[{v:'si',l:'Sí, con precisión'},{v:'no_4',l:'No · <4 semanas en bloque'},{v:'no_48',l:'No · 4-8 semanas'},{v:'no_8',l:'No · >8 semanas'}]},
    ],
    man:[
      {id:'ctx',q:'¿El contexto de vida mejoró? ¿Puede priorizar el entrenamiento?',datos:[{l:'Contexto',v:ultCtx==='normal'?'Normal':ultCtx==='exigente'?'Más exigente':'Muy difícil'}],criterio:'Si el contexto mejoró → Fase 1 y bloque activo.',ops:[{v:'si',l:'Sí, mejoró'},{v:'no',l:'No, sigue igual'}]},
      {id:'e1rm',q:'¿e1RM estable (±5%)?',datos:e1rmLat?[{l:e1rmLat.ex,v:(parseFloat(e1rmLat.delta)>0?'+':'')+e1rmLat.delta+' kg',c:Math.abs(parseFloat(e1rmLat.delta))<5?G:R}]:[{l:'e1RM',v:'Sin datos'}],criterio:'e1RM que baja >5% indica pérdida de adaptación. Revisar compliance o sensaciones.',ops:[{v:'si',l:'Sí, estable'},{v:'no_sens',l:'No, bajó · sensaciones alteradas'},{v:'no_comp',l:'No, bajó · sensaciones OK'}]},
      {id:'peso',q:'¿Peso y cintura estables?',datos:[{l:'Peso',v:lat?.Peso?lat.Peso+' kg':'—'},{l:'Cintura',v:lat?.Cintura?lat.Cintura+' cm':'—'}],criterio:'Estable = ±0.5 kg/sem. Cintura que sube → revisar calórico.',ops:[{v:'si',l:'Sí, estables'},{v:'cintura',l:'No, cintura sube'}]},
    ],
    deporte:[
      {id:'sens',q:'¿Sensaciones dentro del innegociable?',datos:[{l:'Energía',v:ultE},{l:'Sueño',v:ultS}],criterio:'Si NO → Health Phase táctica: 1 semana de descarga. No cancela el plan.',ops:[{v:'si',l:'Sí, OK'},{v:'no',l:'No, alteradas'}]},
      {id:'comp',q:'¿Compliance del protocolo OK?',datos:[{l:'Comidas',v:pctComp+'%',c:pctComp>=70?G:R}],criterio:'Sin entender el porqué del incumplimiento → no ajustar el protocolo.',ops:[{v:'si',l:'Sí'},{v:'no',l:'No'}]},
      {id:'test',q:'¿Métricas del test mejoraron vs checkpoint anterior?',datos:e1rmLat?[{l:e1rmLat.ex,v:(parseFloat(e1rmLat.delta)>0?'+':'')+e1rmLat.delta+' kg',c:parseFloat(e1rmLat.delta)>0?G:R}]:[{l:'Test',v:'Sin datos'}],criterio:'<4 sem para evento: no tocar nada. 4-8 sem: solo recuperación. >8 sem: recalibrar si el % no genera el RIR esperado.',ops:[{v:'si',l:'Sí, mejoraron'},{v:'no_8',l:'No · >8 sem para evento'},{v:'no_48',l:'No · 4-8 sem para evento'},{v:'no_4',l:'No · <4 sem para evento'}]},
    ],
  };

  // Decisiones finales por respuesta
  function getDecision(blq,step,resp){
    const DECS={
      volumen:{
        dolor:{si:'Bajar carga 10-15% en ese ejercicio. No cambiar bloque. Monitorear proximo checkpoint.'},
        sens:{no:'Health Phase reactivo. Override inmediato.'},
        comp:{no:'Hablar con el asesorado antes de ajustar el plan. No tocar nada esta semana.'},
        e1rm:{si:'Bloque funciona. Continuar igual.',si_serie:'Bloque funciona. Considerar +1 serie al ejercicio principal.','1sem':'Esperar 1 semana mas. No tocar nada.','2sem':'Rotar o ajustar ejercicio puntual. Registrar motivo.','3sem':'Estancamiento confirmado. Ir a Fase 1.'}
      },
      fuerza:{
        dolor:{si:'Reducir porcentaje y revisar tecnica. Si persiste ir a Fase 1.'},
        sens:{no:'Health Phase reactivo.'},
        comp:{no:'Hablar primero. No ajustar protocolo.'},
        pesos:{si:'Continuar. Ajustar onda del proximo ciclo.','2sem_ctx':'Esperar 1 semana mas. Contexto exigente.','2sem':'Bajar 5% el peso de trabajo. Reiniciar ciclo.','3sem':'Estancamiento confirmado. Ir a Fase 1.'}
      },
      health:{
        mejora:{si2:'Criterio de salida cumplido. Ir a Fase 1.',si1:'Continuar Health Phase. Una semana mas.',no_ctx:'Continuar. Abordar causa externa si es posible.',no_4sem:'Investigar causa medica o clinica. Derivar si corresponde.',no:'Continuar. El cuerpo necesita mas tiempo.'}
      },
      base:{
        dolor:{si:'Revisar ejercicio especifico. Modificar variante.',generalizado:'Health Phase.'},
        sens:{no:'Health Phase.'},
        rir:{si:'Criterio de salida cumplido. Ir a Fase 1 (habitualmente Volumen).',no_4:'Continuar. Es temprano.',no_48:'Reformular instruccion tecnica.',no_8:'Ir a Fase 1. Revisar si NM es el bloque correcto.'}
      },
      man:{
        ctx:{si:'Ir a Fase 1 con bloque activo.'},
        e1rm:{no_sens:'Health Phase.',no_comp:'Revisar compliance con el asesorado.'},

      },
      deporte:{

        comp:{no:'Hablar primero. No ajustar hasta entender el porque.'},
        test:{si:'Ajustar onda del proximo mes. Mantener todo lo demas.',no_8:'Recalibrar 1RM y rehacer la onda.',no_48:'No cambiar. Maximizar compliance y recuperacion.',no_4:'No tocar nada. Puesta a punto.'}
      },
    };
        return((DECS[blq]||{})[step]||{})[resp]||null;
  }

  function saveDecision(decision){
    setArbolSaving(true);
    const payload={action:'decision',asesorado:name,bloque:bloqueActual,semanaEnBloque:semanasEnBloque,decision,nota:arbolNota};
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .finally(()=>{setArbolSaving(false);setArbolDone(decision);});
  }

  const bloqueKey2=bloqueActual.toLowerCase().replace(' phase','').replace('conexion nm','base').replace('conexión nm','base').replace('mantenimiento','man').replace('intensidad/nm','deporte').replace('intensidad','deporte');
  const arbol=ARBOLES[bloqueKey2]||ARBOLES['volumen'];
  const pasoActual=arbol[arbolStep];

  function ArbolCheckpoint(){
    if(arbolDone)return h('div',{style:{...card,background:'#EAF7F2',border:'1px solid #A3DFC8'}},
      h('div',{style:{fontSize:'14px',fontWeight:'800',color:G,marginBottom:'8px'}},'✅ Decisión registrada'),
      h('div',{style:{fontSize:'13px',color:'#333',lineHeight:'1.5',marginBottom:'12px'}},arbolDone),
      h('button',{onClick:()=>{setArbolStep(0);setArbolResp({});setArbolDone(null);setArbolNota('');},style:{background:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 16px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},'Nuevo checkpoint')
    );
    if(!pasoActual)return null;
    const dec=getDecision(bloqueKey2,pasoActual.id,arbolResp[pasoActual.id]);
    return h('div',null,
      h('div',{style:{...card,background:'#0A0A0A',border:'none'}},
        h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.4)',fontWeight:'700',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}},'Checkpoint '+bloqueActual+' · Semana '+semanasEnBloque),
        h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.35)',marginBottom:'12px'}},'Paso '+(arbolStep+1)+' de '+arbol.length),
        h('div',{style:{fontSize:'15px',fontWeight:'800',color:'#fff',marginBottom:'14px',lineHeight:'1.4'}},pasoActual.q),
        // Datos
        h('div',{style:{background:'rgba(255,255,255,0.06)',borderRadius:'8px',padding:'10px',marginBottom:'10px'}},
          h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.4)',fontWeight:'700',marginBottom:'6px',letterSpacing:'0.06em'}},' DATOS DE ESTA SEMANA'),
          pasoActual.datos.map(function(d,i){return h('div',{key:i,style:{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:'12px'}},
            h('span',{style:{color:'rgba(255,255,255,0.5)'}},d.l),
            h('span',{style:{fontWeight:'700',color:d.c||'#fff'}},d.v)
          );})
        ),
        // Criterio
        h('div',{style:{borderLeft:'3px solid '+AC,paddingLeft:'10px',marginBottom:'14px'}},
          h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.4)',fontWeight:'700',marginBottom:'4px',letterSpacing:'0.06em'}},' CRITERIO'),
          h('div',{style:{fontSize:'11px',color:'rgba(255,255,255,0.65)',lineHeight:'1.5'}},pasoActual.criterio)
        ),
        // Opciones
        h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
          pasoActual.ops.map(function(op){
            const sel=arbolResp[pasoActual.id]===op.v;
            return h('button',{key:op.v,onClick:function(){
              var newResp=Object.assign({},arbolResp,{});
              newResp[pasoActual.id]=op.v;
              setArbolResp(newResp);
              // Verificar si hay decisión inmediata
              var d=getDecision(bloqueKey2,pasoActual.id,op.v);
              if(d){setArbolDone(null);} // se muestra abajo
            },style:{padding:'10px 14px',fontSize:'12px',fontWeight:sel?'700':'400',cursor:'pointer',borderRadius:'8px',border:'1px solid',textAlign:'left',color:sel?'#fff':'rgba(255,255,255,0.6)',background:sel?AC:'rgba(255,255,255,0.06)',borderColor:sel?AC:'rgba(255,255,255,0.1)',transition:'all 0.15s'}},op.l);
          })

              h('div',{style:{display:'flex',gap:'8px'}},
                h('button',{onClick:function(){saveDecision(dec);},disabled:arbolSaving,style:{flex:1,background:GRAD,color:'#fff',border:'none',borderRadius:'8px',padding:'12px',fontSize:'13px',fontWeight:'700',cursor:'pointer'}},arbolSaving?'Guardando...':'Confirmar y registrar'),
                h('button',{onClick:function(){setArbolResp(Object.assign({},arbolResp,{[pasoActual.id]:undefined}));},style:{background:'rgba(0,0,0,0.06)',border:'none',borderRadius:'8px',padding:'12px',fontSize:'12px',cursor:'pointer'}},'Cambiar')
              )
            )
          :h('div',{style:{display:'flex',gap:'8px'}},

                :h('div',null,
                    h('textarea',{placeholder:'Nota adicional (opcional)',value:arbolNota,onChange:function(e){setArbolNota(e.target.value);},style:{...inp,height:'60px',resize:'none',fontSize:'12px',marginBottom:'8px'}}),
                    h('button',{onClick:function(){saveDecision('✅ Continuar igual — todos los criterios OK');},disabled:arbolSaving,style:{flex:1,background:GRAD,color:'#fff',border:'none',borderRadius:'8px',padding:'12px',fontSize:'13px',fontWeight:'700',cursor:'pointer',width:'100%'}},arbolSaving?'Guardando...':'Registrar: Continuar igual')
                  )
            )
      )
    );
  }

  const DTABS=[{id:'med',l:' Tendencias'},{id:'ent',l:' Entreno'},{id:'hab',l:' Sensaciones'},{id:'cp',l:' Checkpoint'}];

  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh'}},
    // Header
    h('div',{style:{background:'#fff',borderBottom:'1px solid rgba(0,0,0,0.09)',padding:'14px 18px',position:'sticky',top:0,zIndex:10}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'4px'}},
        h('button',{onClick:onBack,style:{background:'none',border:'none',cursor:'pointer',fontSize:'18px',color:'#111',padding:0}},'←'),
        h('div',{style:{fontSize:'18px',fontWeight:'800'}},name)
      ),
      h('div',{style:{fontSize:'11px',color:'#999',marginLeft:'30px'}},
        tmpl,' · ',numSes,' sesiones · Semana ',currentWkNum,' · ',
        h('span',{style:{fontWeight:'700',color:'#111'}},bloqueActual),
        ' sem.',semanasEnBloque,
        esCheckpoint&&h('span',{style:{marginLeft:'8px',background:AC,color:'#fff',fontSize:'10px',fontWeight:'700',padding:'2px 8px',borderRadius:'20px'}},' Checkpoint'),
        ' · Obj: ',h('span',{style:{fontWeight:'700',color:String(rutina?.Objetivo||'').toLowerCase()==='deficit'?B:String(rutina?.Objetivo||'').toLowerCase()==='superavit'?G:O}},String(rutina?.Objetivo||'mantenimiento'))
      )
    ),
    h('div',{style:{padding:'12px',paddingBottom:'20px'}},
      // Alertas
      alerts.length>0&&h('div',{style:{marginBottom:'10px'}},
        alerts.map((a,i)=>h('div',{key:i,style:{background:ALERT_BG[a.lvl]||'#F8F8F8',border:'1px solid '+(ALERT_COLOR[a.lvl]||'#ddd'),borderRadius:'8px',padding:'10px 12px',marginBottom:'6px',display:'flex',gap:'8px',alignItems:'flex-start'}},
          h('span',{style:{fontSize:'14px'}},a.lvl==='red'?'':a.lvl==='yellow'?'':'ℹ'),
          h('span',{style:{fontSize:'12px',color:'#111',fontWeight:'500',lineHeight:'1.4'}},a.txt)
        ))
      ),
      // Métricas rápidas última semana
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'5px',marginBottom:'10px'}},
        [
          {l:'Peso',v:lat.Peso?lat.Peso+' kg':'—',c:'#111'},
          {l:'Cintura',v:lat.Cintura?lat.Cintura+' cm':'—',c:'#111'},
          {l:'Comidas',v:fmtPct(lat['%Comidas']),c:parsePct(lat['%Comidas'])<60?R:parsePct(lat['%Comidas'])<80?O:G},
          {l:'Sueño',v:lat.DiasSueno!=null?lat.DiasSueno+'/7':'—',c:G},
          {l:'Tóxicos',v:lat.Toxicos!=null?lat.Toxicos+'d':'—',c:parseInt(lat.Toxicos||0)>=4?O:'#111'},
        ].map((m,i)=>h('div',{key:i,style:{background:'#fff',borderRadius:'8px',padding:'8px 4px',textAlign:'center',border:'1px solid rgba(0,0,0,0.08)'}},
          h('div',{style:{fontSize:'13px',fontWeight:'800',color:m.c}},m.v),
          h('div',{style:{fontSize:'9px',color:'#999',marginTop:'1px'}},m.l)
        ))
      ),
      // Tabs
      h('div',{style:{display:'flex',background:'#fff',borderRadius:'10px',padding:'3px',marginBottom:'10px',border:'1px solid rgba(0,0,0,0.08)'}},
        DTABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'8px 4px',fontSize:'11px',fontWeight:tab===t.id?'700':'400',cursor:'pointer',borderRadius:'8px',border:'none',background:tab===t.id?'#111':'transparent',color:tab===t.id?'#fff':'#999',transition:'all 0.15s'}},t.l))
      ),

      // TAB: TENDENCIAS
      tab==='med'&&h('div',null,
        (()=>{
          const hb=HIST_BASE[normName(name)]||null;
          const pesoBase=hb?hb.p:(pesos[0]||null);
          const cinBase=hb?hb.c:(cinturas[0]||null);
          const pesoActual=pesos.length>0?pesos[pesos.length-1]:null;
          const cinActual=cinturas.length>0?cinturas[cinturas.length-1]:null;
          const pesoColor=pesoActual&&pesoBase?(pesoActual<pesoBase?G:pesoActual>pesoBase?R:'#111'):'#111';
          const cinColor=cinActual&&cinBase?(cinActual<cinBase?G:cinActual>cinBase?R:'#111'):'#111';
          const pesoDelta=pesoActual&&pesoBase?(' ('+(pesoActual-pesoBase>0?'+':'')+(pesoActual-pesoBase).toFixed(1)+'kg)'):'';
          const cinDelta=cinActual&&cinBase?(' ('+(cinActual-cinBase>0?'+':'')+(cinActual-cinBase).toFixed(1)+'cm)'):'';
          return h('div',null,
            hb&&h('div',{style:{...card,background:'#F8F8F8',marginBottom:'10px'}},
              h('div',{style:{...lbl,marginBottom:'6px'}},'Referencia pre-app ('+hb.n+' semanas)'),
              h('div',{style:{display:'flex',gap:'16px'}},
                h('div',null,h('div',{style:{fontSize:'11px',color:'#999'}},'Peso base'),h('div',{style:{fontSize:'16px',fontWeight:'800'}},hb.p+' kg')),
                h('div',null,h('div',{style:{fontSize:'11px',color:'#999'}},'Cintura base'),h('div',{style:{fontSize:'16px',fontWeight:'800'}},hb.c+' cm'))
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Peso'),
              pesos.length>=1?h(LineChart,{data:pesos,color:G,h:110,labels:pesoLabels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'20px'}},'Sin registros aún'),
              pesoActual&&h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'6px',fontSize:'12px'}},
                h('span',{style:{color:'#666'}},'Base: '+(pesoBase||'—')+' kg'),
                h('span',{style:{fontWeight:'700',color:pesoColor}},pesoActual+' kg'+pesoDelta)
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Cintura'),
              cinturas.length>=1?h(LineChart,{data:cinturas,color:B,h:110,labels:cinLabels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'20px'}},'Sin registros aún'),
              cinActual&&h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'6px',fontSize:'12px'}},
                h('span',{style:{color:'#666'}},'Base: '+(cinBase||'—')+' cm'),
                h('span',{style:{fontWeight:'700',color:cinColor}},cinActual+' cm'+cinDelta)
              )
            ),
            h('div',{style:card},
              h('div',{style:{...lbl,marginBottom:'8px'}},'Compliance comidas'),
              comps.length>=2?h(LineChart,{data:comps,color:O,h:90,labels:labels}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'16px'}},'Faltan más semanas')
            )
          );
        })()
      ),

      // TAB: ENTRENAMIENTO
      tab==='ent'&&h('div',null,
        exNames.length===0
          ?h('div',{style:{...card,textAlign:'center',padding:'30px',color:'#999'}},
              h('div',{style:{fontSize:'30px',marginBottom:'8px'}},''),
              h('div',null,'Sin datos de entrenamiento todavía'),
              h('div',{style:{fontSize:'12px',marginTop:'4px'}},'El asesorado debe guardar semanas con reps cargadas')
            )
          :h('div',null,
              h('div',{style:card},
                h('div',{style:lbl},'e1RM estimado — seleccioná ejercicio'),
                h('select',{value:selEx,onChange:e=>setSelEx(parseInt(e.target.value)),style:{width:'100%',padding:'10px',border:'1px solid rgba(0,0,0,0.1)',borderRadius:'8px',fontSize:'13px',marginBottom:'10px',background:'#fff'}},
                  exNames.map((n,i)=>h('option',{key:i,value:i},n))
                ),
                e1rmHistory.data.length>=2
                  ?h('div',null,
                      h(LineChart,{data:e1rmHistory.data,color:G,h:110,labels:e1rmHistory.labels}),
                      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'8px'}},
                        h('span',{style:{fontSize:'12px',color:'#666'}},'Inicio: '+e1rmHistory.data[0]+' kg'),
                        h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
                          (function(){
                            var last=e1rmHistory.data[e1rmHistory.data.length-1];
                            var prev=e1rmHistory.data[e1rmHistory.data.length-2];
                            var diff=parseFloat((last-prev).toFixed(1));
                            var ind=diff>0?'↑':diff<0?'↓':'→';
                            var col=diff>0?G:diff<0?R:O;
                            return h('span',{style:{fontWeight:'800',fontSize:'14px',color:col}},ind+' '+last+' kg '+(diff!==0?'('+( diff>0?'+':'')+diff+')':''));
                          })()
                        )
                      ),
                      // Indicador vs checkpoint anterior
                      (function(){
                        var cpFreqE=checkpointFreq||2;
                        var idxCP=e1rmHistory.data.length-cpFreqE-1;
                        if(idxCP<0)return null;
                        var lastE=e1rmHistory.data[e1rmHistory.data.length-1];
                        var cpE=e1rmHistory.data[idxCP];
                        var diffCP=parseFloat((lastE-cpE).toFixed(1));
                        var col=diffCP>0?G:diffCP<0?R:O;
                        var label=diffCP>0?'Sube vs checkpoint anterior':'Sin progresion vs checkpoint anterior';
                        return h('div',{style:{marginTop:'6px',padding:'8px 10px',background:col+'12',borderRadius:'8px',border:'1px solid '+col+'30',fontSize:'11px',color:col,fontWeight:'600'}},
                          label+' ('+(diffCP>0?'+':'')+diffCP+' kg)'
                        );
                      })()
                    )
                  :h('div',{style:{textAlign:'center',color:'#bbb',padding:'20px',fontSize:'12px'}},'Guardá al menos 2 semanas con reps cargadas')
              )
            )
      ),

      // TAB: SENSACIONES
      tab==='hab'&&h('div',null,
        h('div',{style:card},
          h('div',{style:{...lbl,marginBottom:'8px'}},'Sueño vs Tóxicos'),
          h('div',{style:{display:'flex',gap:'12px',marginBottom:'6px'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},h('div',{style:{width:'8px',height:'8px',background:G,borderRadius:'2px'}}),h('span',{style:{fontSize:'10px',color:'#666'}},'Noches ≥7hs')),
            h('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},h('div',{style:{width:'8px',height:'8px',background:R,borderRadius:'2px'}}),h('span',{style:{fontSize:'10px',color:'#666'}},'Días con tóxicos'))
          ),
          svtData.length>=2?h(DualBarChart,{data:svtData}):h('div',{style:{color:'#bbb',fontSize:'12px',textAlign:'center',padding:'16px'}},'Faltan más semanas')
        ),
        h('div',{style:card},
          h('div',{style:{...lbl,marginBottom:'10px'}},'Sensaciones semana a semana'),
          h('div',{style:{overflowX:'auto'}},
            h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'11px'}},
              h('thead',null,
                h('tr',null,
                  ['Semana','Energía','Hambre','Digestión','Estrés'].map((col,i)=>
                    h('th',{key:i,style:{textAlign:'left',padding:'4px 8px',color:'#999',fontWeight:'600',borderBottom:'1px solid rgba(0,0,0,0.08)',whiteSpace:'nowrap'}},col)
                  )
                )
              ),
              h('tbody',null,
                weeks.slice().reverse().map((w,i)=>
                  h('tr',{key:i,style:{borderBottom:'1px solid rgba(0,0,0,0.04)'}},
                    h('td',{style:{padding:'6px 8px',color:'#666',whiteSpace:'nowrap'}},String(w.SemanID||'').slice(5)||w.Semana||'—'),
                    ['Energia','Hambre','Digestion','Estres'].map((k,j)=>
                      h('td',{key:j,style:{padding:'6px 8px'}},h(SensBadge,{val:w[k]}))
                    )
                  )
                )
              )
            )
          )
        ),
        weeks.some(w=>w.Nota)&&h('div',{style:card},
          h('div',{style:{...lbl,marginBottom:'8px'}},'Notas del asesorado'),
          weeks.filter(w=>w.Nota).slice().reverse().map((w,i)=>
            h('div',{key:i,style:{padding:'10px',background:'#F8F8F8',borderRadius:'8px',marginBottom:'6px'}},
              h('div',{style:{fontSize:'10px',color:'#999',marginBottom:'4px'}},String(w.SemanID||'').slice(5)||w.Semana||''),
              h('div',{style:{fontSize:'13px',color:'#111',lineHeight:'1.5'}},w.Nota)
            )
          )
        ),
        h(VideoPanel,{name})
      ),
      // TAB: CHECKPOINT
      tab==='cp'&&h('div',null,
        h('div',{style:{...card,background:'#0A0A0A',border:'none',marginBottom:'10px'}},
          h('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.4)',fontWeight:'700',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}},'Checkpoint · '+bloqueActual),
          h('div',{style:{fontSize:'13px',color:'rgba(255,255,255,0.7)',marginBottom:'4px'}},
            esCheckpoint
              ?'✅ Semana '+semanasEnBloque+' — es momento de checkpoint'
              :'Próximo: sem '+(Math.ceil(semanasEnBloque/checkpointFreq)*checkpointFreq)+' del bloque (cada '+checkpointFreq+' sem)'
          )
        ),
        h(ArbolCheckpoint,null)
      )
    )
  );
}

function VideoPanel({name}){
  const [videos,setVideos]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    fetch(SCRIPT_URL+'?action=videos')
      .then(r=>r.json())
      .then(rows=>{
        const vids=rows.filter(r=>String(r.Asesorado||'').trim().toLowerCase()===name.trim().toLowerCase());
        setVideos(vids);
      }).catch(()=>{}).finally(()=>setLoading(false));
  },[name]);
  if(loading)return null;
  if(!videos.length)return null;
  return h('div',{style:card},
    h('div',{style:{...lbl,marginBottom:'10px'}},' Videos subidos'),
    videos.slice().reverse().map((v,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:i<videos.length-1?'1px solid rgba(0,0,0,0.05)':'none'}},
      h('div',null,
        h('div',{style:{fontWeight:'600',fontSize:'13px'}},'Ses. '+(v.Sesion||''),' — ',v.Ejercicio||''),
        h('div',{style:{fontSize:'10px',color:'#999'}},v.Fecha||'')
      ),
      h('a',{href:v.URL,target:'_blank',rel:'noreferrer',style:{background:'#EAF7F2',color:G,borderRadius:'8px',padding:'6px 12px',fontSize:'12px',fontWeight:'700',textDecoration:'none'}},'▶ Ver')
    ))
  );
}
function SemanaPanel({data,rutinas}){
  const [copied,setCopied]=useState(null);
  const [view,setView]=useState('lun');
  const TIPS={
    nutricion:{volumen:'Sin las comidas no hay energia para construir. Apunta a 4 comidas aunque sean simples.',fuerza:'La fuerza necesita energia disponible. Esta semana mantene las comidas aunque el dia este cargado.',health:'La recuperacion empieza en la cocina. Esta semana priorizá comer regular aunque sea poco.',man:'Sostener las comidas es lo que evita perder lo ganado. Aunque sea simple, no salteés.',base:'Establece el habito de las 4 comidas. Todo el proceso depende de eso.',deporte:'Segui el plan de alimentacion. El rendimiento depende directamente de esto.'},
    sueno:{volumen:'Con menos de 7hs la construccion muscular se frena. Esta semana priorizá dormir.',fuerza:'La fuerza se construye mientras dormis, no mientras entrenás. Priorizá el descanso.',health:'El descanso ES el objetivo de este bloque. Priorizalo por encima de todo.',man:'El sueno es lo que sostiene la recuperacion sin perder lo ganado.',base:'Establece una rutina de sueno. Todo el proceso depende de eso.',deporte:'El rendimiento en competencia depende del descanso previo. Dormí bien.'},
    entreno:{volumen:'Completa todas las sesiones esta semana. Sin el volumen de entrenamiento no hay estimulo.',fuerza:'No salteés ninguna sesion. La progresion de carga necesita estimulo consistente.',health:'Realiza las sesiones pautadas sin forzar. El movimiento ayuda a la recuperacion.',man:'Mantene la frecuencia. Es lo que sostiene lo que construiste.',base:'Priorizá la tecnica en cada rep. El control del esfuerzo es el objetivo ahora.',deporte:'No salteés sesiones. Cada una tiene un proposito especifico para la fecha que se viene.'},
  };
  function getBloqueKey(rutina){var b=String((rutina&&rutina.Bloque)||'volumen').toLowerCase();if(b.includes('health'))return 'health';if(b.includes('fuerza'))return 'fuerza';if(b.includes('man'))return 'man';if(b.includes('base')||b.includes('conexion')||b.includes('nm'))return 'base';if(b.includes('deporte')||b.includes('intensidad'))return 'deporte';return 'volumen';}
  function getPilarDebil(weeks,rutina){
    if(!weeks||!weeks.length)return null;
    var lat=weeks[weeks.length-1];
    var compPct2=parsePct((lat||{})['%Comidas']||0);
    var suenoOk=parseInt((lat&&lat.DiasSueno)||0);
    var e1rmOk=false;try{e1rmOk=Object.keys(JSON.parse((lat&&lat.E1RM)||'{}')).length>0;}catch(e){}
    var scores={nutricion:compPct2/100,sueno:suenoOk/6,entreno:e1rmOk?1:0};
    var min=Math.min.apply(null,Object.values(scores));
    return Object.keys(scores).find(function(k){return scores[k]===min;})||'nutricion';
  }
  function genMensaje(name,weeks,rutina){
    if(!weeks||!weeks.length)return 'Hola '+name+'! Arrancamos semana.\n\nNo tengo info tuya de la semana pasada para trabajar. Contame rapido:\n\n- Como estuvo el entrenamiento?\n- Como llegaste con las comidas?\n- Peso y cintura de esta semana?\n- Algo que cambio en tu contexto o vida?\n\nCon eso ya puedo orientarte para arrancar bien.';
    var lat=weeks[weeks.length-1];
    var pilar=getPilarDebil(weeks,rutina);
    var bloqueKey=getBloqueKey(rutina);
    var tip=((TIPS[pilar]||{})[bloqueKey])||((TIPS[pilar]||{}).volumen)||'Segui igual, la consistencia es la variable mas importante.';
    var compPct2=parsePct((lat||{})['%Comidas']||0);
    var suenoOk=parseInt((lat&&lat.DiasSueno)||0);
    var pilarLabel=pilar==='nutricion'?'Comidas':pilar==='sueno'?'Sueno':'Entrenamiento';
    var pilarDato=pilar==='nutricion'?compPct2+'% de comidas cumplidas':pilar==='sueno'?suenoOk+'/6 noches con sueno suficiente':'Registro de entreno incompleto';
    var resto=[];if(pilar!=='nutricion')resto.push('comidas');if(pilar!=='sueno')resto.push('descanso');if(pilar!=='entreno')resto.push('entreno');
    return 'Hola '+name+'! Arrancamos semana.\n\nLa semana pasada tu punto mas debil fue '+pilarLabel+':\n- '+pilarDato+'\n\nEsta semana: '+tip+'\n\n'+(resto.length?'En '+resto.join(' y ')+' venis bien, segui igual.\n\n':'')+'Cualquier duda en el momento me avisas, no esperes al sabado.';
  }
  function genMidWeek(name,weeks,rutina){
    if(!weeks||!weeks.length)return 'Sin datos de semanas anteriores para '+name+'.';
    var pilar=getPilarDebil(weeks,rutina);
    var bloqueKey=getBloqueKey(rutina);
    var tip=((TIPS[pilar]||{})[bloqueKey])||((TIPS[pilar]||{}).volumen)||'Segui igual.';
    var pilarLabel=pilar==='nutricion'?'las comidas':pilar==='sueno'?'el sueno':'el entreno';
    return 'Hola '+name+'! Mitad de semana.\n\nRecordatorio: la sem pasada tuviste dificultades con '+pilarLabel+'.\nEsta semana: '+tip+'\n\nEstas a tiempo de terminar fuerte. Cualquier duda me avisas.';
  }
  function copy(text,id){navigator.clipboard.writeText(text).then(function(){setCopied(id);setTimeout(function(){setCopied(null);},2000);});}
  var clients=Object.keys(data).sort();
  var MsgViernes='Ya arrancamos el fin de semana!\n\nRecordatorio: el sabado es el ultimo dia para registrar todo en la app antes de cerrar la semana.\n\nComidas, peso, cintura, sensaciones: todo lo que anotes le da herramientas a tu coach para ajustar el plan la semana que viene.\n\nCualquier duda del reporte me avisan.';
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',background:'#F5F5F5',minHeight:'100vh'}},
    h('div',{style:{background:'#fff',borderBottom:'1px solid rgba(0,0,0,0.09)',padding:'14px 18px',position:'sticky',top:0,zIndex:10}},
      h('div',{style:{fontSize:'18px',fontWeight:'800',marginBottom:'10px'}},'Mensajes semanales'),
      h('div',{style:{display:'flex',gap:'6px'}},
        [{v:'lun',l:'Lun/Dom'},{v:'mie',l:'Mie'},{v:'vie',l:'Vie'}].map(function(t){return h('button',{key:t.v,onClick:function(){setView(t.v);},style:{flex:1,padding:'8px',fontSize:'11px',fontWeight:view===t.v?'700':'400',cursor:'pointer',borderRadius:'8px',border:'none',background:view===t.v?'#111':'#F0F0F0',color:view===t.v?'#fff':'#666'}},t.l);})
      )
    ),
    h('div',{style:{padding:'12px'}},
      view==='vie'&&h('div',{style:{background:'#fff',borderRadius:'12px',padding:'16px',border:'1px solid rgba(0,0,0,0.08)'}},
        h('div',{style:{fontSize:'11px',fontWeight:'700',color:'#999',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:'8px'}},'Mensaje comunidad Viernes'),
        h('div',{style:{fontSize:'12px',color:'#555',lineHeight:'1.6',whiteSpace:'pre-line',background:'#F8F8F8',borderRadius:'8px',padding:'10px',marginBottom:'12px'}},MsgViernes),
        h('button',{onClick:function(){copy(MsgViernes,'vie');},style:{width:'100%',background:copied==='vie'?G:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'10px',fontSize:'12px',fontWeight:'700',cursor:'pointer'}},copied==='vie'?'Copiado!':'Copiar')
      ),
      (view==='lun'||view==='mie')&&clients.map(function(name){
        var weeks=data[name]||[];
        var rutina=rutinas.find(function(r){return String(r.Asesorado||'').trim().toLowerCase()===name.toLowerCase();});
        var msg=view==='lun'?genMensaje(name,weeks,rutina):genMidWeek(name,weeks,rutina);
        var pilar=getPilarDebil(weeks,rutina);
        var pilarColor=pilar==='nutricion'?O:pilar==='sueno'?B:G;
        var hasData=weeks&&weeks.length>0;
        return h('div',{key:name,style:{background:'#fff',borderRadius:'12px',padding:'14px',marginBottom:'10px',border:'1px solid rgba(0,0,0,0.08)'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},
            h('div',null,
              h('div',{style:{fontWeight:'800',fontSize:'14px'}},name),
              h('div',{style:{fontSize:'11px',marginTop:'2px',color:hasData?pilarColor:R,fontWeight:'600'}},hasData?('Punto debil: '+(pilar==='nutricion'?'Comidas':pilar==='sueno'?'Sueno':'Entreno')):'Sin reporte')
            ),
            h('button',{onClick:function(){copy(msg,name+view);},style:{background:copied===name+view?G:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'8px 14px',fontSize:'11px',fontWeight:'700',cursor:'pointer',flexShrink:0}},copied===name+view?'Copiado!':'Copiar')
          ),
          h('div',{style:{fontSize:'12px',color:'#555',lineHeight:'1.6',whiteSpace:'pre-line',background:'#F8F8F8',borderRadius:'8px',padding:'10px',maxHeight:'120px',overflowY:'auto'}},msg)
        );
      })
    )
  );
}

function App(){
  const [unlocked,setUnlocked]=useState(()=>sessionStorage.getItem('coach_ok')==='1');
  const [loading,setLoading]=useState(false);
  const [data,setData]=useState({});
  const [rutinas,setRutinas]=useState([]);
  const [selected,setSelected]=useState(null);
  const [error,setError]=useState(null);
  const [appTab,setAppTab]=useState('lista');
  const unlock=()=>{sessionStorage.setItem('coach_ok','1');setUnlocked(true);};
  const loadData=()=>{
    setLoading(true);setError(null);
    Promise.all([
      fetch(SCRIPT_URL+'?action=reportes').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=rutinas').then(r=>r.json()).catch(()=>[])
    ]).then(([reportes,ruts])=>{
      const grouped={};
      (reportes||[]).forEach(row=>{const name=String(row.Asesorado||'').trim();if(!name)return;if(!grouped[name])grouped[name]=[];grouped[name].push(row);});
      Object.values(grouped).forEach(w=>w.sort((a,b)=>String(a.SemanID||'').localeCompare(String(b.SemanID||''))));
      setData(grouped);setRutinas(ruts||[]);
    }).catch(()=>setError('Error al cargar datos.')).finally(()=>setLoading(false));
  };
  useEffect(()=>{if(unlocked)loadData();},[unlocked]);
  if(!unlocked)return h(PinScreen,{onUnlock:unlock});
  if(loading)return h('div',{style:{maxWidth:'480px',margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#fff'}},h('div',{style:{fontSize:'14px',color:'#999'}},'Cargando datos...'));
  if(error)return h('div',{style:{maxWidth:'480px',margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#fff',padding:'40px'}},h('div',{style:{fontSize:'14px',color:'#666',marginBottom:'20px',textAlign:'center'}},error),h('button',{onClick:loadData,style:{background:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'12px 24px',fontSize:'14px',cursor:'pointer'}},'Reintentar'));
  if(selected)return h(ClientDetail,{name:selected,weeks:data[selected]||[],rutina:rutinas.find(r=>String(r.Asesorado||'').trim().toLowerCase()===selected.toLowerCase()),onBack:()=>setSelected(null)});
  return h('div',null,
    h('div',{style:{paddingBottom:'60px'}},
      appTab==='lista'&&h(ClientList,{data,rutinas,onSelect:setSelected,onRefresh:loadData}),
      appTab==='sem'&&h(SemanaPanel,{data,rutinas})
    ),
    h('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'480px',background:'#fff',borderTop:'1px solid rgba(0,0,0,0.08)',display:'flex',zIndex:20}},
      [{v:'lista',l:'Asesorados',ic:'👥'},{v:'sem',l:'Semana',ic:'📅'}].map(t=>
        h('button',{key:t.v,onClick:()=>setAppTab(t.v),style:{flex:1,padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:appTab===t.v?'2px solid #111':'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',color:appTab===t.v?'#111':'#999',fontWeight:appTab===t.v?'700':'400'}},h('span',{style:{fontSize:'18px'}},t.ic),t.l)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
