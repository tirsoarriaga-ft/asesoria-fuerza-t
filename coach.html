// ── PESTAÑA COBROS: facturación integrada (vencimientos desde FechaInicio + registro de pagos) ──
function CobrosPanel({maestra,pagos,onRefresh}){
  var [marcando,setMarcando]=useState(null); // asesoradoId que se está marcando
  var [busqueda,setBusqueda]=useState('');
  var [subTab,setSubTab]=useState('todos'); // todos | moroso | hoy | aldia
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var norm=function(x){return String(x||'').trim().toLowerCase();};
  function parseFecha(s){
    s=String(s||'').trim(); if(!s)return null;
    var m;
    if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));}
    if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)){return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));}
    var d=new Date(s); return isNaN(d.getTime())?null:d;
  }
  function calcCobro(fInicio){
    var fi=parseFecha(fInicio); if(!fi)return null;
    fi.setHours(0,0,0,0);
    var diaCobro=fi.getDate();
    // El vencimiento del ciclo EN CURSO = el día de cobro de este mes calendario.
    var vencEsteMes=new Date(hoy.getFullYear(),hoy.getMonth(),diaCobro); vencEsteMes.setHours(0,0,0,0);
    // Si el día de cobro de este mes todavía no llegó, el ciclo en curso venció el mes pasado.
    var vencActual;
    if(hoy>=vencEsteMes){ vencActual=vencEsteMes; }
    else { vencActual=new Date(hoy.getFullYear(),hoy.getMonth()-1,diaCobro); vencActual.setHours(0,0,0,0); }
    // MesNumero del ciclo en curso = meses transcurridos desde el inicio hasta vencActual + 1
    var mesActual=(vencActual.getFullYear()-fi.getFullYear())*12+(vencActual.getMonth()-fi.getMonth())+1;
    if(mesActual<1)mesActual=1;
    // días desde que venció el ciclo actual (0 = vence hoy, >0 = ya pasó)
    var diasVencido=Math.round((hoy-vencActual)/(1000*60*60*24));
    // próximo vencimiento (el siguiente ciclo)
    var prox=new Date(vencActual); prox.setMonth(prox.getMonth()+1);
    return {mesActual:mesActual,vencActual:vencActual,proxVenc:prox,diasVencido:diasVencido,diaCobro:diaCobro};
  }
  function pagoDeMes(aseId,mes){
    return (pagos||[]).find(function(p){return norm(p.AsesoradoID)===norm(aseId)&&String(p.MesNumero).trim()===String(mes).trim();});
  }
  function marcarPagado(a,mes,monto,fechaVenc){
    var aseId=a.AsesoradoID||'';
    if(!aseId){alert('Ese asesorado no tiene AsesoradoID.');return;}
    setMarcando(aseId);
    var fechaPago=fechaVenc?fechaVenc.toLocaleDateString('es-AR'):new Date().toLocaleDateString('es-AR');
    var payload={action:'registrarPago',asesoradoId:aseId,asesorado:a.Asesorado||'',mesNumero:mes,fechaPago:fechaPago,monto:monto||''};
    fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .finally(function(){setTimeout(function(){setMarcando(null);if(onRefresh)onRefresh();},1600);});
  }
  var activos=(maestra||[]).filter(function(a){return norm(a.Estado)!=='baja'&&String(a.Asesorado||'').trim();});
  var filas=activos.map(function(a){
    var c=calcCobro(a.FechaCobro||a.FechaInicio);
    var precio=parseFloat(String(a.PrecioCuota||'').replace(/[^\d.]/g,''))||0;
    var pagado=c?pagoDeMes(a.AsesoradoID,c.mesActual):null;
    var estado='sinfecha';
    if(c){
      if(pagado)estado='aldia';               // pagó el ciclo en curso
      else if(c.diasVencido>0)estado='vencido';  // el día ya pasó y no pagó → moroso
      else if(c.diasVencido===0)estado='hoy';    // vence hoy
      else estado='pendiente';                    // (no debería pasar con esta lógica)
    }
    return {a:a,c:c,precio:precio,pagado:pagado,estado:estado};
  });
  // Orden alfabético por nombre
  filas.sort(function(x,y){return String(x.a.Asesorado||'').localeCompare(String(y.a.Asesorado||''));});
  var EST={
    vencido:{l:'Vencido',c:'#EF4444',bg:'#FEF2F2'},
    hoy:{l:'Vence hoy',c:'#D97706',bg:'#FFFBEB'},
    pronto:{l:'Vence pronto',c:'#D97706',bg:'#FFFBEB'},
    pendiente:{l:'Al día',c:'#1D9E75',bg:'#F0FDF4'},
    aldia:{l:'Pagado',c:'#1D9E75',bg:'#F0FDF4'},
    sinfecha:{l:'Sin fecha',c:'#999',bg:'#F7F7F7'}
  };
  // Totales (sobre todos, no sobre el filtro)
  var totalMes=filas.reduce(function(a,f){return a+(f.pagado?f.precio:0);},0);
  var pendienteMes=filas.reduce(function(a,f){return a+((!f.pagado&&f.estado!=='sinfecha')?f.precio:0);},0);
  // Contadores por sub-pestaña
  var nMoroso=filas.filter(function(f){return f.estado==='vencido';}).length;
  var nHoy=filas.filter(function(f){return f.estado==='hoy';}).length;
  var nAldia=filas.filter(function(f){return f.estado==='aldia';}).length;
  // Aplicar filtros: sub-pestaña + búsqueda
  var vis=filas.filter(function(f){
    if(subTab==='moroso'&&f.estado!=='vencido')return false;
    if(subTab==='hoy'&&f.estado!=='hoy')return false;
    if(subTab==='aldia'&&f.estado!=='aldia')return false;
    if(busqueda.trim()&&norm(f.a.Asesorado).indexOf(norm(busqueda))<0)return false;
    return true;
  });
  var subTabs=[
    {v:'todos',l:'Todos',n:filas.length},
    {v:'moroso',l:'Morosos',n:nMoroso},
    {v:'hoy',l:'Vence hoy',n:nHoy},
    {v:'aldia',l:'Al día',n:nAldia}
  ];
  return h('div',{style:{maxWidth:'480px',margin:'0 auto',padding:'12px 12px 90px'}},
    h('div',{style:{marginBottom:'12px'}},
      h('div',{style:{fontSize:'20px',fontWeight:'800'}},'Cobros'),
      h('div',{style:{fontSize:'12px',color:'#999'}},activos.length+' activos'+(nMoroso>0?(' · '+nMoroso+' moroso'+(nMoroso>1?'s':'')):''))
    ),
    // Resumen
    h('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}},
      h('div',{style:{flex:1,background:'#F0FDF4',borderRadius:'10px',padding:'12px'}},
        h('div',{style:{fontSize:'10px',color:'#1D9E75',fontWeight:'700',textTransform:'uppercase'}},'Cobrado este mes'),
        h('div',{style:{fontSize:'18px',fontWeight:'800',color:'#111'}},'$'+totalMes.toLocaleString('es-AR'))
      ),
      h('div',{style:{flex:1,background:'#FEF2F2',borderRadius:'10px',padding:'12px'}},
        h('div',{style:{fontSize:'10px',color:'#EF4444',fontWeight:'700',textTransform:'uppercase'}},'Por cobrar'),
        h('div',{style:{fontSize:'18px',fontWeight:'800',color:'#111'}},'$'+pendienteMes.toLocaleString('es-AR'))
      )
    ),
    // Buscador
    h('input',{type:'text',value:busqueda,onChange:function(e){setBusqueda(e.target.value);},placeholder:'🔍 Buscar por nombre…',
      style:{width:'100%',boxSizing:'border-box',padding:'10px 12px',border:'1px solid rgba(0,0,0,0.15)',borderRadius:'10px',fontSize:'14px',marginBottom:'10px'}}),
    // Sub-pestañas
    h('div',{style:{display:'flex',gap:'6px',marginBottom:'12px',overflowX:'auto'}},
      subTabs.map(function(st){
        var sel=subTab===st.v;
        return h('button',{key:st.v,onClick:function(){setSubTab(st.v);},
          style:{flexShrink:0,padding:'7px 12px',borderRadius:'20px',border:'none',cursor:'pointer',fontSize:'12px',fontWeight:'700',
            background:sel?'#111':'#F0F0F0',color:sel?'#fff':'#666'}},
          st.l+(st.n>0?(' ('+st.n+')'):''));
      })
    ),
    vis.length===0&&h('div',{style:{textAlign:'center',padding:'40px 20px',color:'#999',fontSize:'13px'}},'Nada por acá'),
    vis.map(function(f){
      var e=EST[f.estado];
      var venceStr=f.c?(f.pagado?f.c.proxVenc:f.c.vencActual).toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'—';
      return h('div',{key:f.a.AsesoradoID||f.a.Asesorado,style:{background:'#fff',border:'1px solid rgba(0,0,0,0.08)',borderRadius:'12px',padding:'13px',marginBottom:'8px'}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}},
          h('div',null,
            h('div',{style:{fontSize:'15px',fontWeight:'700',color:'#111'}},f.a.Asesorado),
            h('div',{style:{fontSize:'11px',color:'#999',marginTop:'2px'}},(f.a.Plan||'—')+(f.precio?(' · $'+f.precio.toLocaleString('es-AR')):''))
          ),
          h('span',{style:{fontSize:'10px',fontWeight:'700',color:e.c,background:e.bg,padding:'3px 8px',borderRadius:'20px'}},e.l)
        ),
        f.estado!=='sinfecha'&&h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('div',{style:{fontSize:'11px',color:'#666'}},
            f.pagado?('✓ Mes '+f.c.mesActual+' pagado · próx '+venceStr):('Mes '+f.c.mesActual+' · venció '+venceStr)
          ),
          f.pagado
            ?h('span',{style:{fontSize:'11px',color:'#1D9E75',fontWeight:'700'}},'Al día')
            :h('button',{onClick:function(){marcarPagado(f.a,f.c.mesActual,f.precio,f.c.vencActual);},disabled:marcando===f.a.AsesoradoID,
                style:{background:marcando===f.a.AsesoradoID?'#ccc':'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'7px 14px',fontSize:'12px',fontWeight:'700',cursor:marcando===f.a.AsesoradoID?'default':'pointer'}},
                marcando===f.a.AsesoradoID?'Guardando…':'Marcar pagado')
        )
      );
    })
  );
}

function App(){
  const [unlocked,setUnlocked]=useState(()=>sessionStorage.getItem('coach_ok')==='1');
  const [loading,setLoading]=useState(false);
  const [data,setData]=useState({});
  const [rutinas,setRutinas]=useState([]);
  const [videosPend,setVideosPend]=useState({}); // {nombreLower: cantidad} de videos sin corregir
  const [ejercicios,setEjercicios]=useState([]); // hoja Ejercicios para el constructor de rutinas
  const [diagnosticos,setDiagnosticos]=useState([]); // hoja Diagnosticos (Fase 3C)
  const [pagos,setPagos]=useState([]); // hoja Pagos (facturación)
  const [maestra,setMaestra]=useState([]); // hoja Asesorados (para cobros: FechaInicio, PrecioCuota, Plan)
  const [decisiones,setDecisiones]=useState([]);
  const [selected,setSelected]=useState(null);
  const [error,setError]=useState(null);
  const [appTab,setAppTab]=useState('lista');
  const unlock=()=>{sessionStorage.setItem('coach_ok','1');setUnlocked(true);};
  const loadData=()=>{
    setLoading(true);setError(null);
    Promise.all([
      fetch(SCRIPT_URL+'?action=reportes').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=rutinas').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=decisiones').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=asesorados').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=videos').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=ejercicios').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=diagnosticos').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=pagos').then(r=>r.json()).catch(()=>[]),
      fetch(SCRIPT_URL+'?action=dietas').then(r=>r.json()).catch(()=>[])
    ]).then(([reportes,ruts,decs,asesorados,vids,ejs,diags,pagosData,dietasData])=>{
      const grouped={};
      (reportes||[]).forEach(row=>{const name=String(row.Asesorado||'').trim();if(!name)return;if(!grouped[name])grouped[name]=[];grouped[name].push(row);});
      Object.values(grouped).forEach(w=>w.sort((a,b)=>String(a.SemanID||'').localeCompare(String(b.SemanID||''))));
      // Enriquecer cada rutina con la identidad de la ficha maestra (Asesorados), con fallback a lo de Rutinas.
      const norm=x=>String(x||'').trim().toLowerCase();
      const fichas={};
      (asesorados||[]).forEach(a=>{fichas[norm(a.Asesorado)]=a;});
      // Índice de Dietas por AsesoradoID y por nombre (para traer el Template, que vive en Dietas)
      const dietaPorId={}, dietaPorNombre={};
      (dietasData||[]).forEach(d=>{
        const id=norm(d.AsesoradoID); const nm=norm(d.Asesorado);
        if(id)dietaPorId[id]=d;
        if(nm)dietaPorNombre[nm]=d;
      });
      const templateDe=(r,f)=>{
        const id=norm((f&&f.AsesoradoID)||r.AsesoradoID);
        const nm=norm(r.Asesorado);
        const d=(id&&dietaPorId[id])||dietaPorNombre[nm]||null;
        return d&&String(d.Template||'').trim()!=='' ? d.Template : (r.Template||'');
      };
      const rutsEnriquecidas=(ruts||[]).map(r=>{
        const f=fichas[norm(r.Asesorado)];
        if(!f)return Object.assign({},r,{Template:templateDe(r,null)}); // fallback + template de dieta
        const pref=(campoFicha,campoRut)=>{
          if(f[campoFicha]!==undefined&&String(f[campoFicha]).trim()!=='')return f[campoFicha];
          return r[campoRut];
        };
        return Object.assign({},r,{
          Sexo:pref('Sexo','Sexo'),
          Edad:pref('Edad','Edad'),
          Altura:pref('Altura','Altura'),
          PesoRef:pref('PesoRef','PesoRef'),
          Objetivo:pref('Objetivo','Objetivo'),
          FechaInicio:pref('FechaInicio','FechaInicio'),
          Nivel:pref('Plan','Nivel'),
          Estado:f.Estado||'',
          AsesoradoID:f.AsesoradoID||'',
          Template:templateDe(r,f)
        });
      });
      // Asesorados de la maestra que NO tienen fila en Rutinas todavía (recién dados de alta).
      // Se agregan como filas virtuales para que aparezcan en la lista aunque no tengan rutina.
      const conRutina={};
      (ruts||[]).forEach(r=>{conRutina[norm(r.Asesorado)]=1;});
      // Los de plan "Básico" NO entran al seguimiento (solo se cobran, aparecen en pestaña Cobros).
      const esBasico=a=>String(a.Plan||'').trim().toLowerCase()==='basico'||String(a.Plan||'').trim().toLowerCase()==='básico';
      const virtuales=(asesorados||[]).filter(a=>{
        const n=norm(a.Asesorado);
        return n&&!conRutina[n]&&String(a.Estado||'').toLowerCase()!=='baja'&&!esBasico(a);
      }).map(a=>({
        Asesorado:a.Asesorado||'', AsesoradoID:a.AsesoradoID||'', Estado:a.Estado||'',
        Sexo:a.Sexo||'', Edad:a.Edad||'', Altura:a.Altura||'', PesoRef:a.PesoRef||'',
        Objetivo:a.Objetivo||'', FechaInicio:a.FechaInicio||'', FechaCobro:a.FechaCobro||'', Nivel:a.Plan||'', Template:templateDe({Asesorado:a.Asesorado,AsesoradoID:a.AsesoradoID},a)
      }));
      const rutsCompletas=rutsEnriquecidas.concat(virtuales);
      // Videos sin corregir por asesorado (dedup por asesorado+ejercicio, más reciente)
      const normV=x=>String(x||'').trim().toLowerCase();
      const conIdxV=(vids||[]).map((v,i)=>({...v,_ord:i}));
      const porClaveV={};
      conIdxV.forEach(v=>{const k=normV(v.Asesorado)+'|'+normV(v.Sesion)+'|'+normV(v.Ejercicio);if(!porClaveV[k]||v._ord>porClaveV[k]._ord)porClaveV[k]=v;});
      const pend={};
      Object.values(porClaveV).forEach(v=>{
        const corr=String(v.Revisado||'').toLowerCase()==='si'||(v.Feedback&&String(v.Feedback).trim());
        if(!corr){const a=normV(v.Asesorado);pend[a]=(pend[a]||0)+1;}
      });
      setVideosPend(pend);
      setEjercicios(ejs||[]);
      setDiagnosticos(diags||[]);
      setPagos(pagosData||[]);
      setMaestra(asesorados||[]);
      setData(grouped);setRutinas(rutsCompletas);setDecisiones(decs||[]);
    }).catch(()=>setError('Error al cargar datos.')).finally(()=>setLoading(false));
  };
  useEffect(()=>{if(unlocked)loadData();},[unlocked]);
  if(!unlocked)return h(PinScreen,{onUnlock:unlock});
  if(loading)return h('div',{style:{maxWidth:'480px',margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#fff'}},h('div',{style:{fontSize:'14px',color:'#999'}},'Cargando datos...'));
  if(error)return h('div',{style:{maxWidth:'480px',margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#fff',padding:'40px'}},h('div',{style:{fontSize:'14px',color:'#666',marginBottom:'20px',textAlign:'center'}},error),h('button',{onClick:loadData,style:{background:'#111',color:'#fff',border:'none',borderRadius:'8px',padding:'12px 24px',fontSize:'14px',cursor:'pointer'}},'Reintentar'));
  if(selected){
    const rutSel=rutinas.find(r=>String(r.Asesorado||'').trim().toLowerCase()===selected.toLowerCase());
    const diagSel=(diagnosticos||[]).find(d=>String(d.Asesorado||'').trim().toLowerCase()===selected.toLowerCase()||(rutSel&&String(d.AsesoradoID||'').trim().toLowerCase()===String(rutSel.AsesoradoID||'').trim().toLowerCase()&&String(rutSel.AsesoradoID||'').trim()!==''));
    return h(ClientDetail,{name:selected,weeks:data[selected]||[],rutina:rutSel,ejercicios,diagnostico:diagSel,onRefresh:loadData,onBack:()=>setSelected(null)});
  }
  return h('div',null,
    h('div',{style:{paddingBottom:'60px'}},
      appTab==='lista'&&h(ClientList,{data,rutinas,decisiones,videosPend,onSelect:setSelected,onRefresh:loadData}),
      appTab==='vids'&&h(VideosGlobal,{onSelect:setSelected}),
      appTab==='sem'&&h(SemanaPanel,{data,rutinas}),
      appTab==='aud'&&h(AuditoriaPanel,{data,rutinas,decisiones}),
      appTab==='cobros'&&h(CobrosPanel,{maestra,pagos,onRefresh:loadData})
    ),
    h('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'480px',background:'#fff',borderTop:'1px solid rgba(0,0,0,0.08)',display:'flex',zIndex:20}},
      [{v:'lista',l:'Asesorados',ic:'👥'},{v:'vids',l:'Videos',ic:'🎬'},{v:'sem',l:'Semana',ic:'📅'},{v:'aud',l:'Auditoria',ic:'📊'},{v:'cobros',l:'Cobros',ic:'💰'}].map(t=>
        h('button',{key:t.v,onClick:()=>setAppTab(t.v),style:{flex:1,padding:'10px 2px 14px',fontSize:'10px',background:'none',border:'none',borderTop:appTab===t.v?'2px solid #111':'2px solid transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',color:appTab===t.v?'#111':'#999',fontWeight:appTab===t.v?'700':'400'}},h('span',{style:{fontSize:'18px'}},t.ic),t.l)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
